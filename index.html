{c:"c2",t:"Task types",q:"Is temperature available in the Claude apps?",a:"No — temperature is an API parameter. In the apps you instruct Claude to evaluate strictly against stated criteria instead."},
{c:"c2",t:"Task types",q:"Research: three things to tighten.",a:"The research question, source requirements, and citation requirements. Loosen the synthesis approach."},
{c:"c2",t:"Task types",q:"Two verification rules for research output.",a:"(1) Training data has a cutoff, so prices, regulations and org structures are silently stale. (2) Web search must be available and explicitly requested; returned citations must be opened — a link can be real while the claim attached to it is not."},
{c:"c2",t:"Task types",q:"Brainstorming: how much constraint is right?",a:"Goal plus basic guardrails only. Excessive constraints suppress divergence — generate broadly, filter later."},

/* ---------- Course 3 ---------- */
{c:"c3",t:"Discernment",q:"Define discernment and diligence.",a:"Discernment: critically evaluate output against requirements, source material and professional standards. Diligence: know when extra verification or human review is needed, and take responsibility for the deliverable."},
{c:"c3",t:"Discernment",q:"Name the three evaluation references.",a:"1. Requirements. 2. Source material. 3. Professional standards."},
{c:"c3",t:"Discernment",q:"What is the classic requirements trap?",a:"The output addresses the main ask while silently skipping a secondary requirement buried in the prompt. Cross-check the full brief, not just the headline."},
{c:"c3",t:"Discernment",q:"Why isn't 'it was in the uploaded file' sufficient for a source check?",a:"Claude can misread tables, skip rows, misalign columns and attribute data to the wrong document. Verify the interpretation, not just the presence."},
{c:"c3",t:"Discernment",q:"How does risk change the depth of review?",a:"High-risk work (legal, financial, compliance) requires every claim verified. Low-risk work (brainstorming, ideas) justifies a lighter pass. The question is: what happens if this is wrong?"},
{c:"c3",t:"Discernment",q:"Name the three possible outcomes of an evaluation.",a:"Ready to use · Needs revision · Needs human override."},
{c:"c3",t:"Discernment",q:"How can an output be 100% accurate and still fail?",a:"Completeness. It may omit the single most important factor — e.g. the competitor the client cares about — while every statement is correct."},

{c:"c3",t:"Failure patterns",q:"Name the four output failure patterns.",a:"Hallucination, inconsistency, bias, completeness failure."},
{c:"c3",t:"Failure patterns",q:"What one fact makes hallucination hard to spot?",a:"Claude writes with the same fluency whether it is right or wrong — confidence is a property of the prose, not evidence of accuracy."},
{c:"c3",t:"Failure patterns",q:"How do you detect inconsistencies in a long document?",a:"Ask Claude to summarise its key claims as a numbered list, then check whether any two conflict."},
{c:"c3",t:"Failure patterns",q:"How do you counter confirmation bias in output?",a:"Ask for arguments for and against, or ask Claude to challenge its own recommendation before finalising. Strongly suggestive prompts push the model toward the implied answer."},
{c:"c3",t:"Failure patterns",q:"What is a capability hallucination?",a:"When Claude states or implies it performed an action — sent an email, saved a file, notified a colleague — when no tool actually did. Verify externally that side effects occurred."},
{c:"c3",t:"Failure patterns",q:"Checklist for a suspicious statistic.",a:"Is a source cited? Is the precision disproportionate? Does it appear in a trusted external source you can open? Any 'no' → unverified until confirmed."},
{c:"c3",t:"Failure patterns",q:"Does a confident tone indicate accuracy?",a:"No — false. The writing style is identical whether the content is right or wrong."},

{c:"c3",t:"Grounding",q:"Name the six grounding techniques.",a:"1. Allow 'I don't know'. 2. Restrict to provided sources. 3. Require verifiable citations. 4. Quote before analysing. 5. Compare multiple responses. 6. Verify against authoritative sources."},
{c:"c3",t:"Grounding",q:"Is there a 'citations mode' button in claude.ai?",a:"No. Native Citations is an API/developer feature. Grounding is achieved through prompting."},
{c:"c3",t:"Grounding",q:"Which two grounding techniques work best together, and why?",a:"Restrict to provided sources + allow 'I don't know'. One defines the universe of acceptable evidence; the other defines behaviour at its edge."},
{c:"c3",t:"Grounding",q:"What is the quote-before-analyse pattern for?",a:"Long documents — extract the relevant text, present supporting quotes, then analyse. It separates evidence from inference and is standard for contract, policy and compliance review."},
{c:"c3",t:"Grounding",q:"What does running the same prompt 2–3 times reveal?",a:"Which claims are stable and which appear in only one run. Unstable claims deserve investigation before you rely on them — valuable for high-stakes work."},
{c:"c3",t:"Grounding",q:"Why is asking Claude to verify its own output not verification?",a:"It has the same information and blind spots as the process that produced the answer. Verification requires an independent source."},

{c:"c3",t:"Human review",q:"Name the four risk thresholds.",a:"Stakes · Reversibility · Audience · Regulatory exposure."},
{c:"c3",t:"Human review",q:"Which outputs never go out without human validation?",a:"Final client deliverables, business-critical financial calculations, regulated/sensitive information, public statements, legal communications."},
{c:"c3",t:"Human review",q:"Where does accountability sit?",a:"With the professional who approves and distributes. No prompt, grounding technique or model selection moves it."},
{c:"c3",t:"Human review",q:"What do tools do to risk?",a:"Reduce it. They do not eliminate the need for human judgement on high-stakes work."},

{c:"c3",t:"Editing",q:"Name the three editing passes, in order.",a:"1. Clarity (remove complexity). 2. Tone (adapt to audience). 3. Formatting (match consumption)."},
{c:"c3",t:"Editing",q:"How does an executive version differ from a working-team version?",a:"Executive: leads with impact and recommendation, brief support, decision-oriented. Working team: methodology, supporting detail, owners and timelines, action-oriented. Facts identical."},

{c:"c3",t:"Formats",q:"Rank the four output formats by reliability.",a:"Inline response (lower) → Artifact (medium) → Structured output (medium–high) → Code execution (highest for numerical work)."},
{c:"c3",t:"Formats",q:"Is there a dedicated structured-output mode in claude.ai?",a:"No. You request structure in the prompt or build an Artifact. Enforced schema-valid JSON is an API capability."},
{c:"c3",t:"Formats",q:"Why prefer code execution for numbers?",a:"Prose figures may simply be wrong. Code execution produces an actual traceable calculation — though you must still verify the inputs and the logic."},

/* ---------- Course 4 ---------- */
{c:"c4",t:"Requirements",q:"What separates 'I use Claude' from 'our workflow uses Claude'?",a:"Repeatability: a defined process where Claude performs specified activities every run. That creates sustained value — and the risk of delegating the wrong activities or removing oversight."},
{c:"c4",t:"Requirements",q:"What four properties must a requirement have?",a:"Clear, structured, testable, actionable. 'We need better reporting' has none of them."},
{c:"c4",t:"Requirements",q:"What is the traceability pattern for RFP extraction?",a:"Short label + exact section reference + verbatim quote of the source sentence, plus a flag when the requirement cannot be located verbatim."},
{c:"c4",t:"Requirements",q:"Why is a section reference alone insufficient in a long document?",a:"It is a known failure mode — a plausible-sounding but wrong section number. The quote makes the reference checkable in seconds."},
{c:"c4",t:"Requirements",q:"Project instructions versus a Skill.",a:"Project instructions: behaviour inside one Project. Skill: a versioned, account-level repeatable procedure available across conversations and Projects."},
{c:"c4",t:"Requirements",q:"What does a Skill need once a workflow depends on it?",a:"A named owner and an update path — it is production infrastructure, not a personal shortcut."},
{c:"c4",t:"Requirements",q:"Describe the two-pass RFP approach.",a:"Pass 1 extract: labels, sections, quoted sentences, clarification flags, structured register. Pass 2 pressure-test: which requirements are ambiguous, implied rather than stated, or open to multiple interpretations."},

{c:"c4",t:"Planning",q:"Split planning into its two halves.",a:"Synthesis (organise, compare, explain trade-offs — Claude's reasoning, to be verified) and calculation (accurate numbers — code execution, not conversational text)."},
{c:"c4",t:"Planning",q:"Three limits of the code-execution sandbox.",a:"It is isolated, it has no internet access, and inputs must therefore be uploaded. It cannot query a production database directly."},
{c:"c4",t:"Planning",q:"What must you do with Research citations?",a:"Open them and check them. The synthesis being coherent says nothing about whether the sources support it."},
{c:"c4",t:"Planning",q:"What data handling step precedes uploading timesheets?",a:"Remove or mask personal identifiers in line with company policy. Also check file type and size limits (CSV/XLSX typical)."},
{c:"c4",t:"Planning",q:"Which judgements stay human?",a:"Risk appetite, budget priorities, organisational constraints, business relationships and situational politics — none of which are in the inputs. Claude prepares the analysis; the human decides."},

{c:"c4",t:"Solution design",q:"Describe the iterative design cycle.",a:"Generate ideas → prototype → feedback → refine → repeat until it meets the requirement, all inside a Project so context and decisions persist."},
{c:"c4",t:"Solution design",q:"What is the precondition for a usable dashboard Artifact?",a:"Machine-readable data — a CSV or a table. A screenshot or a chart embedded in a PDF is the most common first-attempt failure."},
{c:"c4",t:"Solution design",q:"How should you phrase a refinement to a prototype?",a:"Describe the required change, not the code — tell Claude what you need, not how to build it."},
{c:"c4",t:"Solution design",q:"What are the limits of an Artifact?",a:"It is client-side, on data supplied in the conversation. No live data source, no refresh — a snapshot tool, not a reporting system."},
{c:"c4",t:"Solution design",q:"What is the warning sign that you must escalate?",a:"Dependency — when others rely on it as infrastructure. Then reliability, security, integrations and governance require real engineering."},

{c:"c4",t:"Delegation",q:"Name the three delegation assignments.",a:"AI-appropriate (Claude performs), collaborative (Claude assists, a person reviews and decides), human-retained (a person must own it)."},
{c:"c4",t:"Delegation",q:"Name the official three delegation criteria for workflow steps.",a:"Reversibility · Stakes · Accountability. (Use-case screening in Governance adds human creativity/empathy; data sensitivity is classified separately.)"},
{c:"c4",t:"Delegation",q:"Why is data sensitivity an independent gate?",a:"It can block delegation even when the other three criteria are green. Unapproved data makes a low-stakes, reversible step inappropriate."},
{c:"c4",t:"Delegation",q:"Contract review: who approves each change, and why?",a:"Human-retained. It is high stakes and accountability cannot be transferred — drafting quality is not decision authority."},
{c:"c4",t:"Delegation",q:"What is halo delegation?",a:"Delegating the next step because Claude did the previous one well. Prevention: apply the four criteria to every step separately."},
{c:"c4",t:"Delegation",q:"What makes 'AI drafts, human reviews' fail?",a:"No named reviewer and no defined meaning of review — it becomes automation with a ceremonial step attached. Name the person, define the checklist, verify reviews happen."},
{c:"c4",t:"Delegation",q:"What is 'mapping the tool instead of the work'?",a:"Designing the workflow around a liked feature. Correct order: map the work → assess risk per step → choose the delegation model → select the capability."},
{c:"c4",t:"Delegation",q:"What is the right order for designing an AI-assisted workflow?",a:"1. Map the work. 2. Assess the risk of each step. 3. Decide the delegation model. 4. Select the Claude capability."},

{c:"c4",t:"Communication",q:"Four phrases never to use when describing an AI workflow.",a:"'Fully automated', 'Claude handles everything', 'It is as good as a person', 'Human review is no longer required'."},
{c:"c4",t:"Communication",q:"What makes an accurate capability statement?",a:"It states what Claude does, identifies the human-review gate, names who is accountable, and sets realistic expectations."},

/* ---------- Course 5 ---------- */
{c:"c5",t:"Surfaces",q:"Name the four in-project mechanisms and what each holds.",a:"Instructions = behaviour; knowledge base = facts; Skills = procedures; scoped memory = continuity. (Connectors are the fifth surface, at account level.)"},
{c:"c5",t:"Surfaces",q:"What single question routes information to the right surface?",a:"Is this behaviour, knowledge, a procedure, or continuity?"},
{c:"c5",t:"Surfaces",q:"What is the precedence rule between account and project instructions?",a:"Inside a Project, project-level instructions take precedence over conflicting account-level preferences."},
{c:"c5",t:"Surfaces",q:"How does the knowledge base actually work?",a:"Claude searches and retrieves relevant excerpts — it does not load the whole KB into context every turn. That is why over-uploading causes partial recall."},
{c:"c5",t:"Surfaces",q:"What gets wrongly blamed for partial recall from a bloated KB?",a:"The prompt. Over-uploading degrades retrieval, and the symptom looks like bad prompting."},
{c:"c5",t:"Surfaces",q:"Where do Skills live and who can see them?",a:"At account level, reusable across multiple Projects, subject to scope and admin settings — a managed workspace may not see them until an admin enables them."},
{c:"c5",t:"Surfaces",q:"Four properties of scoped memory.",a:"Project-scoped by design; plan-gated and can be disabled; Claude-generated but user-editable; not perfect automatic recall."},

{c:"c5",t:"Connectors",q:"At what level do connectors operate?",a:"Account or organisation level — not inside a Project."},
{c:"c5",t:"Connectors",q:"Whose permissions do connectors use?",a:"The authorising user's own permissions — no more, no less."},
{c:"c5",t:"Connectors",q:"A connector can read messages but errors when asked to send one. Diagnosis?",a:"Not a malfunction — it has reached its defined capability boundary. Sending was never within its permitted scope."},
{c:"c5",t:"Connectors",q:"What is the wrong-connector-path risk?",a:"Connecting via an arbitrary custom MCP server URL found outside the approved list. Use the organisation's approved connector list; admins can allowlist and block."},
{c:"c5",t:"Connectors",q:"What is the knowledge hygiene rule of thumb?",a:"If you would not trust a colleague to use a document, remove it from the knowledge base. Duplicate and stale policies produce confident wrong answers."},

{c:"c5",t:"Instructions",q:"Why do vague instructions fail?",a:"They have no observable criteria, so they are interpreted differently each time and fail silently — no reviewer can verify compliance."},
{c:"c5",t:"Instructions",q:"Give a strong, measurable instruction set.",a:"'Use formal language, define acronyms when first introduced, and keep paragraphs under four sentences.' Also: 'For every metric, provide the source. Label unsupported figures as unverified.'"},

{c:"c5",t:"Maintenance",q:"How should review cadence be set?",a:"Match it to how often underlying documents and processes change, plus event-driven reviews: fiscal year rollover, policy reissue, team change. Monthly is a reasonable default, not a rule."},
{c:"c5",t:"Maintenance",q:"What does an outdated metric in an instruction cause?",a:"Silently incorrect output. The error is in the configuration, not the prompt."},
{c:"c5",t:"Maintenance",q:"Quality degraded gradually in a working Project. What do you check first?",a:"Configuration drift: stale instructions, duplicate documents, outdated memory. Not the prompt."},
{c:"c5",t:"Maintenance",q:"What must you check before troubleshooting a prompt that uses a Skill?",a:"Whether the Skill itself is current. It is one of the most overlooked diagnostic steps."},
{c:"c5",t:"Maintenance",q:"What does the official course say about maintaining Memory?",a:"Review it periodically and edit/delete stale entries; export it as a backup before a major change; do a full reset if outdated context would mislead. Accuracy beats volume."},
{c:"c5",t:"Maintenance",q:"Three hard limits of configuration.",a:"It does not guarantee accuracy (verification still needed); it is not secure storage (no secrets, credentials or regulated personal data); it does not grant autonomous action."},

/* ---------- Course 6 ---------- */
{c:"c6",t:"Use cases",q:"Name the four use-case evaluation criteria (Course 6).",a:"Reversibility · Consequence of error · Need for human creativity or empathy · Accountability."},
{c:"c6",t:"Use cases",q:"Which criterion can override all the others?",a:"The need for human creativity or empathy. A condolence message may be low-risk and reversible, but the human element is the whole point."},
{c:"c6",t:"Use cases",q:"Name the three use-case classifications.",a:"Fully appropriate · Appropriate with human review · Inappropriate."},
{c:"c6",t:"Use cases",q:"What distinguishes 'inappropriate' from 'needs more review'?",a:"Inappropriate means the decision itself cannot be delegated at all, regardless of AI quality — final medical or legal determinations, benefits eligibility. High-risk work that remains permissible with a human decision is 'appropriate with human review'."},
{c:"c6",t:"Use cases",q:"Five elements of a valid review gate.",a:"Who reviews (named role); what is reviewed; when (before use); how it is evidenced (sign-off, ticket, version note); what happens on rejection (escalate, rework, abandon)."},
{c:"c6",t:"Use cases",q:"Why is a gate without a rejection path not a control?",a:"If nothing can happen when the reviewer says no, and no outcome is recorded, the gate cannot be tested in an audit. It is a formality."},

{c:"c6",t:"Skill trust",q:"What is a Skill, structurally?",a:"A package of instructions plus optional files and scripts. The instructions enter the model's context as trusted guidance; bundled code runs in the code execution environment."},
{c:"c6",t:"Skill trust",q:"Name the three-part trust evaluation.",a:"1. Source — who published it. 2. Reach — what it can access and do. 3. Appropriateness — least privilege for the task."},
{c:"c6",t:"Skill trust",q:"What are the two halves of 'reach'?",a:"Visibility (what it can see) and capability (what it can do: transform, save, transmit). Read plus write to sensitive data is far riskier than read alone."},
{c:"c6",t:"Skill trust",q:"What is the principle of least privilege in this context?",a:"The Skill receives only the capability the task needs. A document-formatting Skill should not need access to an entire Drive."},
{c:"c6",t:"Skill trust",q:"Why is 'it was approved once' not sufficient?",a:"An approved Skill can change after review. That is exactly when a safe Skill becomes an incident — check versioning and update behaviour."},
{c:"c6",t:"Skill trust",q:"State the prompt-injection rule.",a:"Content Claude reads is data, never a command. Text telling the assistant to ignore prior instructions, change permissions or send data somewhere is surfaced to a human, never obeyed."},
{c:"c6",t:"Skill trust",q:"Which feature has the highest reach, and why?",a:"Connectors/MCP integrations — they grant standing access to a system (mail, files, ticketing, CRM) rather than a one-time upload."},
{c:"c6",t:"Skill trust",q:"Three outcomes of a trust evaluation.",a:"Enable (trusted source, appropriate permissions, capability matches need) · Escalate (needs security or governance review) · Decline (unvalidated source or disproportionate access)."},

{c:"c6",t:"Data",q:"Is Green/Yellow/Red an official taxonomy?",a:"No — it is an illustrative course model. Map it to your organisation's labels, e.g. Public / Internal / Confidential / Restricted."},
{c:"c6",t:"Data",q:"What belongs in the Yellow tier, and what is the rule?",a:"Internal documents, contact information, draft announcements, unreleased project info. Check policy before uploading; consider redaction. It is the 'pause and check' tier where most mistakes happen."},
{c:"c6",t:"Data",q:"Name the three reasons data is Red.",a:"Regulated (health, financial, government), contractual (NDA, data processing agreement), and secrets (credentials, keys, tokens)."},
{c:"c6",t:"Data",q:"Why are credentials different in kind rather than just higher tier?",a:"A regulated document may be usable via an approved pathway; a password or API key must never be pasted into Claude under any circumstance. It is an absolute never-paste rule."},
{c:"c6",t:"Data",q:"What is the redaction test?",a:"Could someone re-identify the individual from what remains? If yes, the redaction is incomplete — removing a name but leaving a unique identifier still reveals identity."},
{c:"c6",t:"Data",q:"When does redaction not solve the problem?",a:"Over-redaction: if the task genuinely needs the sensitive detail, use an approved pathway or don't upload — don't strip the data the work depends on."},
{c:"c6",t:"Data",q:"What does the code-execution sandbox protect?",a:"The host system, from code execution. It is isolated and session-scoped. It does not protect the data — Red content is still Red once uploaded."},
{c:"c6",t:"Data",q:"What should you do after a session involving sensitive content?",a:"Check memory and clear unwanted entries — do not assume automatic exclusion."},
{c:"c6",t:"Data",q:"Two limits of incognito mode.",a:"(1) The conversation is not saved, so you cannot retrieve it later — a problem when a record of an AI-assisted decision is itself required. (2) Enterprise logging, retention and audit obligations continue independently."},
{c:"c6",t:"Data",q:"What is the first question about any sensitive information?",a:"Is this information approved for use with Claude? Privacy features come after that answer, not before. Incognito does not make data safe."},

{c:"c6",t:"Policy",q:"Name the three common audit gaps.",a:"Uploading restricted information; enabling Skills without review; skipping mandatory human-review checkpoints."},
{c:"c6",t:"Policy",q:"What do you do on discovering a policy breach?",a:"Report it through the organisation's incident channel immediately — do not wait for a scheduled audit to surface it."},

{c:"c6",t:"Ethics",q:"What is the most frequent day-to-day ethical risk?",a:"Factual reliability — fluent, confident, wrong output, including misattributed or fabricated citations."},
{c:"c6",t:"Ethics",q:"Name the four ethical areas.",a:"Bias and fairness · transparency and disclosure · factual reliability · reasoning through grey areas."},
{c:"c6",t:"Ethics",q:"When is disclosure of AI involvement likely required?",a:"When client contracts or procurement policies mandate it, regulatory frameworks require AI transparency, or the audience reasonably expects human authorship. Good practice even when not required — when in doubt, disclose."},
{c:"c6",t:"Ethics",q:"Why document grey-area reasoning?",a:"It creates a defensible decision process: who is affected, what harm is possible, what outcome is fair, what disclosure is appropriate."},

/* ---------- Course 7 ---------- */
{c:"c7",t:"Diagnosis",q:"What is the first diagnostic clue for a failing output?",a:"Timing — when the problem appears. Wrong from the first response, degrading over time, a specific repeated error, worked-before-not-now, or impossible regardless of wording."},
{c:"c7",t:"Diagnosis",q:"Name the five failure patterns.",a:"Under-specification · Context overload · Wrong feature or model · Stale configuration · Task-fit mismatch."},
{c:"c7",t:"Diagnosis",q:"Context overload: symptoms, cause, fix.",a:"Started well then degraded; forgets earlier instructions. Cause: conversation exceeds the context window and instruction-to-content ratio dilutes. Fix: fresh conversation, your own summary, reload essential context. A better prompt will not solve it."},
{c:"c7",t:"Diagnosis",q:"What happens near the context limit in claude.ai (official)?",a:"Earlier messages are auto-summarised (paid plans with code execution). Detail compresses, so early instructions lose force. Fix: restart, summarise, persist."},
{c:"c7",t:"Diagnosis",q:"Output lacks depth despite detailed instructions. First lever?",a:"Extended thinking — before swapping to a larger model."},
{c:"c7",t:"Diagnosis",q:"How do you avoid misdiagnosing stale configuration?",a:"Outputs are non-deterministic. Reserve that diagnosis for a consistent, repeatable quality drop, not a single weak run."},
{c:"c7",t:"Diagnosis",q:"Task-fit mismatch: what is the fix?",a:"Reframe the request — ask for a range, the key factors, or scenarios, instead of a single guaranteed figure."},
{c:"c7",t:"Diagnosis",q:"Name the seven diagnostic steps in order.",a:"1. Revisit prompt. 2. Check conversation length. 3. Verify feature/model. 4. Check tools and connectors. 5. Review configuration. 6. Verify the output itself. 7. Re-evaluate the task."},
{c:"c7",t:"Diagnosis",q:"Which step is the most consequential, and why?",a:"Step 6 — verifying the output itself. Claude can be confidently wrong; read the generated code rather than trusting the printed number."},
{c:"c7",t:"Diagnosis",q:"Common real causes at the tools-and-connectors step.",a:"Expired authentication, insufficient permission scopes, a file that failed to parse."},
{c:"c7",t:"Diagnosis",q:"Why do most 'broken Skills' not actually have a broken procedure?",a:"The Skill description is too vague, so the Skill never fires. It is a description problem far more often than a logic problem."},

{c:"c7",t:"Feedback",q:"How do you convert a reaction into an action?",a:"Make it specific enough that someone else could apply it without asking what you meant. 'Too generic' → add audience and define the desired outcome. 'Missed the point' → state the key question the output must answer."},
{c:"c7",t:"Feedback",q:"Where do recurring fixes get promoted?",a:"Rule → Project instructions. Reference → knowledge base. Multi-step procedure → Skill."},
{c:"c7",t:"Feedback",q:"What is the rule of more than twice?",a:"If you are fixing the same thing more than twice, it belongs in configuration — not in your head or your clipboard."},

{c:"c7",t:"Optimisation",q:"Name the three types of workflow friction.",a:"Repetition (same context pasted every time), repeated corrections (same error fixed every report), variability (different users get different outputs)."},
{c:"c7",t:"Optimisation",q:"Apply the rule-reference-procedure test.",a:"Rules → Project instructions. References → knowledge base. Procedures → Skills."},
{c:"c7",t:"Optimisation",q:"Four metrics for measuring workflow improvement.",a:"Time saved, reduction in revision cycles, consistency improvements, quality improvements."},
{c:"c7",t:"Optimisation",q:"May you quote the training before/after numbers as expected savings?",a:"No. They are illustrative, not benchmarks."},

/* ---------- Course 8 ---------- */
{c:"c8",t:"Framework",q:"Name the seven lifecycle stages.",a:"1. Select the right capability. 2. Structured prompts. 3. Evaluate and validate. 4. Integrate into workflows. 5. Configure reusable environments. 6. Govern responsibly. 7. Troubleshoot and optimise."},
{c:"c8",t:"Framework",q:"Name the 4 Ds of AI Fluency.",a:"Delegation · Description · Discernment · Diligence."},
{c:"c8",t:"Framework",q:"Are the 4 Ds sequential?",a:"No — they operate simultaneously on the same piece of work."},
{c:"c8",t:"Framework",q:"What does Delegation cover?",a:"Deciding what Claude does, what a human does, and what is collaborative."},
{c:"c8",t:"Framework",q:"How should a model be chosen?",a:"As a capability / cost / latency trade-off — not by picking the newest."},
{c:"c8",t:"Framework",q:"What is the Associate scope boundary?",a:"Developer-level work — building an MCP server, for example — is outside it. Recognise the boundary and escalate to someone with Developer-level certification."}
];

</script>
<script>
/* ==== practice-b.js ==== */
/* Quiz bank, glossary, exam facts */
window.CA = window.CA || {};

window.CA.quiz = [
/* ---- C2 L1 ---- */
{c:"c2",l:"c2l1",q:"A colleague sends the prompt: “Write a summary of our quarterly operations.” Which component is present?",opts:["Context","Task","Constraints","Examples"],a:1,why:"It contains a task verb and nothing else — no role, no context, no constraints, no format. That is exactly why the output is generic."},
{c:"c2",l:"c2l1",q:"You need a 150-word executive summary. What is the most reliable instruction?",opts:["“Write exactly 150 words.”","“Keep it brief.”","“Write roughly 120–160 words, in three short paragraphs.”","“Write 150 words maximum, no more.”"],a:2,why:"Word counts are targets, not limits. Models approximate length, so ranges plus structural constraints (three paragraphs) are followed far more reliably than an exact number."},
{c:"c2",l:"c2l1",q:"Which single addition most often improves tone and structure adherence?",opts:["A longer role description","One or two worked examples (few-shot)","A request for step-by-step reasoning","A higher temperature setting"],a:1,why:"Few-shot examples are frequently the highest-impact single addition — even one bullet example steers shape and tone more reliably than wording tweaks."},
{c:"c2",l:"c2l1",q:"The prompt says “summarise only metrics deviating more than 10% from target” but no file is attached. What is the risk?",opts:["Claude will refuse the task","Claude will infer plausible targets or omit the comparison","Claude will ask for the file","Claude will produce a shorter summary"],a:1,why:"A precise constraint over missing data produces confident fiction: Claude infers targets or silently drops the comparison, and the output looks more rigorous than a vague request would."},

/* ---- C2 L2 ---- */
{c:"c2",l:"c2l2",q:"Why decompose a complex request into steps?",opts:["Because Claude's context window is too small for large requests","To improve reviewability and isolate errors","Because multi-step prompts use fewer tokens","To avoid using a Project"],a:1,why:"The rationale is reviewability and error isolation — not capacity. Context windows comfortably hold most business documents."},
{c:"c2",l:"c2l2",q:"In a four-step vendor evaluation, you start step 3 in a fresh chat. What breaks?",opts:["Nothing — each step is independent","The criteria and scores from steps 1–2 are lost","Claude refuses to continue","The output becomes longer"],a:1,why:"A fresh conversation loses the shared state. Claude will reconstruct plausible criteria and scores without telling you they are new."},
{c:"c2",l:"c2l2",q:"What is the correct order of a vendor evaluation?",opts:["Score vendors, define criteria, recommend, identify trade-offs","Define criteria, score vendors, identify trade-offs, recommend","Identify trade-offs, score vendors, define criteria, recommend","Define criteria, recommend, score vendors, identify trade-offs"],a:1,why:"Criteria first, because scoring against wrong criteria produces a well-formatted wrong answer. Trade-offs come before the recommendation so errors surface before they influence it."},

/* ---- C2 L3 ---- */
{c:"c2",l:"c2l3",q:"The output is competent but generic. Which diagnosis is most likely?",opts:["Missing context","Wrong model","Context overload","Task-fit mismatch"],a:0,why:"Generic output is the signature of missing context — Claude assumed the audience, the situation and the purpose."},
{c:"c2",l:"c2l3",q:"An output cites a plausible-looking statistic. What is the correct first move?",opts:["Ask Claude to double-check its own answer","Ask for the source, supply source material, and instruct it to say when information is absent","Increase the model's capability tier","Rewrite the entire prompt"],a:1,why:"The model filled a gap. Supply the source and restrict the answer to it — asking Claude to verify itself is not verification."},
{c:"c2",l:"c2l3",q:"When should you stop iterating on a prompt?",opts:["After three iterations, regardless of quality","When the last two iterations produced only cosmetic changes","As soon as the output looks acceptable","When you run out of ideas"],a:1,why:"The goal is a usable outcome, not a perfect prompt. Two consecutive cosmetic-only iterations mean a manual edit is now faster."},
{c:"c2",l:"c2l3",q:"Analysis is shallow despite a detailed, well-specified prompt. What is the first lever?",opts:["Switch to a more capable model","Enable extended thinking","Add more examples","Increase the word count"],a:1,why:"For 'lacks depth despite detailed instructions', extended thinking is the first lever — before any model swap."},

/* ---- C2 L4 ---- */
{c:"c2",l:"c2l4",q:"You want lower creativity for an analytical task in the Claude app. What do you do?",opts:["Set temperature to 0.2 in settings","Instruct Claude to evaluate strictly against stated criteria and ground every claim in the data","Use a smaller model","Disable web search"],a:1,why:"Temperature is an API parameter and is not exposed in the Claude apps. The prompt-level equivalent is strict evaluation against explicit criteria."},
{c:"c2",l:"c2l4",q:"For a research task, which parts should you tighten?",opts:["The synthesis approach","Sources, citation requirements and the research question","The tone and rhetorical style","The number of paragraphs"],a:1,why:"Research is judged on traceability. Tighten sources, citations and the question; leave the synthesis approach loose."},
{c:"c2",l:"c2l4",q:"A returned citation links to a real page. What have you established?",opts:["That the claim is supported","That the source exists — not that it supports the claim","That the statistic is current","Nothing needs checking"],a:1,why:"A link can be real while the claim attached to it is not. Citations must be opened and read."},
{c:"c2",l:"c2l4",q:"How tightly should a brainstorming prompt be constrained?",opts:["Very tightly — specify structure, length and categories","Goal plus basic guardrails, with quantity and structure left loose","Not at all — no goal either","Only specify the output format"],a:1,why:"Excessive constraints reduce the range of ideas, which defeats the purpose. Generate broadly, filter later."},

/* ---- C3 L1 ---- */
{c:"c3",l:"c3l1",q:"Name the three references for evaluating output.",opts:["Accuracy, speed, cost","Requirements, source material, professional standards","Clarity, tone, formatting","Prompt, context, constraints"],a:1,why:"Discernment evaluates against what was asked, what the sources say, and what the profession expects."},
{c:"c3",l:"c3l1",q:"An accurate market analysis omits the competitor the client cares most about. How do you classify it?",opts:["Ready to use","Needs revision","Needs human override","A hallucination"],a:1,why:"It is a completeness failure with an identifiable gap. Nothing in it is wrong, which is exactly what makes the omission hard to see."},
{c:"c3",l:"c3l1",q:"How should review depth be set?",opts:["Always verify every claim","Scale it to the consequences if the output is wrong","By document length","By how confident the output sounds"],a:1,why:"High-risk work (legal, financial, compliance) warrants claim-by-claim verification; low-risk idea generation justifies a lighter pass."},

/* ---- C3 L2 ---- */
{c:"c3",l:"c3l2",q:"Output is written confidently. Does that indicate accuracy?",opts:["Yes — hedging indicates uncertainty","No — style is identical whether right or wrong","Only for factual questions","Only when citations are present"],a:1,why:"Fluency is a property of the prose, not evidence of correctness. Confidence carries no information about accuracy."},
{c:"c3",l:"c3l2",q:"Claude says it “sent the report to the client.” What is the correct response?",opts:["Trust it — it has tool access","Verify externally that the action occurred","Ask it to confirm","Assume it queued the email"],a:1,why:"This is a capability hallucination. Text describing an action is not the action — verify that a tool actually performed it."},
{c:"c3",l:"c3l2",q:"A 20-page analysis may contradict itself. What technique exposes that?",opts:["Ask it to rewrite more concisely","Ask it to list key claims as a numbered list, then check for conflicts","Ask for a longer conclusion","Re-run the prompt at a lower temperature"],a:1,why:"A numbered claim list converts prose into something comparable, making internal contradictions visible."},
{c:"c3",l:"c3l2",q:"A prompt strongly implies the answer you want. Which risk rises?",opts:["Hallucinated citations","Confirmation bias","Context overload","Formatting drift"],a:1,why:"Claude may build the case for the implied conclusion. Ask for arguments for and against, or have it challenge its own recommendation."},

/* ---- C3 L3 ---- */
{c:"c3",l:"c3l3",q:"How do you enable citations in claude.ai?",opts:["Settings → Citations → On","There is no citations mode; you request citations in the prompt","Use the /cite command","Attach a citation style guide"],a:1,why:"Native Citations is an API/developer feature. In the app, grounding is achieved through prompting — cite clause numbers, quote sources, restrict to provided documents."},
{c:"c3",l:"c3l3",q:"Which two grounding techniques work best together?",opts:["Compare responses and verify externally","Allow “I don't know” and restrict to provided sources","Quote before analysing and use code execution","Require citations and increase word count"],a:1,why:"One defines the universe of acceptable evidence; the other defines behaviour at its edge. Together they close the gap where invention happens."},
{c:"c3",l:"c3l3",q:"You must review a 40-page contract for risk. What is the strongest prompt pattern?",opts:["“Summarise the risks in this contract.”","Answer only from the document, quote the supporting clause, cite clause numbers, and state when the contract is silent","“Use your knowledge of contract law to identify risks.”","“Rate the contract from 1 to 10.”"],a:1,why:"Restrict, quote, cite, allow silence — evidence is separated from inference and every claim is checkable."},
{c:"c3",l:"c3l3",q:"Why is asking Claude to verify its own output insufficient?",opts:["It costs extra tokens","It shares the same information and blind spots as the original answer","It cannot read its own output","It always agrees"],a:1,why:"Verification requires an independent source. Self-checking is a consistency pass, not a truth test."},

/* ---- C3 L4 ---- */
{c:"c3",l:"c3l4",q:"A compliance summary for a regulator reads beautifully. What is the next step?",opts:["Send it — quality is high","Have a qualified human reviewer approve it before release","Run it through a second model","Add more citations and send"],a:1,why:"Regulatory exposure is a threshold. Regulated artefacts require a qualified human reviewer regardless of how good the prose looks."},
{c:"c3",l:"c3l4",q:"Which is NOT one of the four risk thresholds?",opts:["Stakes","Reversibility","Audience","Token cost"],a:3,why:"The four are stakes, reversibility, audience and regulatory exposure."},
{c:"c3",l:"c3l4",q:"Which output never ships without human validation?",opts:["An internal brainstorm note","A draft agenda for a team meeting","A business-critical financial calculation","A personal to-do list"],a:2,why:"Final client deliverables, critical financials, regulated information, public statements and legal communications all require human validation."},
{c:"c3",l:"c3l4",q:"What does good prompting do to high-stakes risk?",opts:["Eliminates it","Reduces it without eliminating the need for human judgement","Transfers it to the model provider","Has no effect"],a:1,why:"No combination of prompting, grounding, model choice or configuration removes human judgement from high-stakes work."},

/* ---- C3 L5 ---- */
{c:"c3",l:"c3l5",q:"What is the correct order of editing passes?",opts:["Formatting, tone, clarity","Clarity, tone, formatting","Tone, clarity, formatting","Clarity, formatting, tone"],a:1,why:"Remove complexity first, then adapt register, then shape the artefact to how the audience consumes it."},
{c:"c3",l:"c3l5",q:"How should an executive version differ from a working-team version?",opts:["Different facts","It leads with impact and recommendation","It includes more methodology","It uses more technical vocabulary"],a:1,why:"The facts are identical. The executive version leads with the 'so what' and a recommendation; the working version leads with method, detail and action items."},

/* ---- C3 L6 ---- */
{c:"c3",l:"c3l6",q:"A figure must be exactly right. Which format do you choose?",opts:["Inline response","Artifact","Code execution","A structured table in chat"],a:2,why:"Code execution produces an actual traceable calculation — highest reliability for numerical work. You still spot-check the inputs and logic."},
{c:"c3",l:"c3l6",q:"Is there a dedicated structured-output mode in claude.ai?",opts:["Yes, under Settings","Yes, via the Artifacts menu","No — request structure in the prompt or build an Artifact","Only for Enterprise plans"],a:2,why:"Enforced schema-valid JSON is an API capability. In the app you ask for structure or produce it as an Artifact."},

/* ---- C4 L1 ---- */
{c:"c4",l:"c4l1",q:"An RFP extraction table lists section references but no quotes. Why is that a problem?",opts:["It looks unprofessional","A section reference alone can point at the wrong place and cannot be verified in seconds","It uses too many tokens","It duplicates the requirements register"],a:1,why:"In a 40-page document a plausible-looking wrong section is a known failure mode. The verbatim quote is what makes the reference checkable."},
{c:"c4",l:"c4l1",q:"A requirement-extraction procedure must be reused across many Projects. Where does it belong?",opts:["Project instructions","A Skill","Scoped memory","The knowledge base"],a:1,why:"Skills are versioned, account-level procedures reusable across Projects. Project instructions apply only inside one Project."},
{c:"c4",l:"c4l1",q:"What is the second pass of a two-pass requirements workflow?",opts:["Re-extract the requirements","Pressure-test for ambiguity, implied requirements and multiple interpretations","Format the table","Score the requirements"],a:1,why:"Pass 1 extracts with quotes and flags. Pass 2 asks which requirements are ambiguous, implied rather than stated, or readable two ways."},

/* ---- C4 L2 ---- */
{c:"c4",l:"c4l2",q:"What can code execution NOT do?",opts:["Analyse an uploaded CSV","Generate a chart","Query a production database directly","Compute a growth trend"],a:2,why:"The sandbox is isolated with no internet access. Inputs must be uploaded — it cannot reach out to a live system."},
{c:"c4",l:"c4l2",q:"Which half of planning belongs in code execution?",opts:["Comparing options","Explaining trade-offs","Producing accurate numbers","Structuring the plan"],a:2,why:"Calculation belongs in code execution. Synthesis — organising, comparing, explaining — is Claude's reasoning and should be verified."},
{c:"c4",l:"c4l2",q:"Before uploading a ticket export for analysis, what must you do?",opts:["Convert it to PDF","Remove or mask personal identifiers per policy","Compress it","Summarise it first"],a:1,why:"Uploading is itself a delegation decision. Identifiers should be removed or masked before upload, in line with company policy."},

/* ---- C4 L3 ---- */
{c:"c4",l:"c4l3",q:"What is the most common first-attempt dashboard failure?",opts:["Too many metrics","Data supplied as a screenshot or PDF chart instead of machine-readable data","Using the wrong colour scheme","Building it in a Project"],a:1,why:"An Artifact needs machine-readable input — CSV or a table. A screenshot cannot be parsed reliably."},
{c:"c4",l:"c4l3",q:"How should you phrase a refinement to a prototype?",opts:["Paste the corrected code","Describe the required change in business terms","Rewrite the original prompt","Rebuild it from scratch"],a:1,why:"Tell Claude what you need, not how to build it. Describe the change and let it implement."},
{c:"c4",l:"c4l3",q:"What is the clearest signal to escalate from an Artifact to real engineering?",opts:["The dashboard has many charts","Other people start depending on it operationally","The data file is large","The layout needs printing"],a:1,why:"Dependency is the warning sign — reliability, security, integrations and governance requirements arrive with it."},

/* ---- C4 L4 ---- */
{c:"c4",l:"c4l4",q:"In the official Workflow module, which three criteria classify each workflow step?",opts:["Reversibility, stakes, accountability","Reversibility, consequence, empathy","Accuracy, completeness, tone","Source, reach, appropriateness"],a:0,why:"Steps are mapped on reversibility, stakes and accountability. Use-case screening in Governance adds human creativity/empathy; source/reach/appropriateness is the Skill trust check."},
{c:"c4",l:"c4l4",q:"A step is low-stakes, fully reversible, with clear ownership — but the data is not cleared for use. What is the correct assignment?",opts:["AI-appropriate","Collaborative","Human-retained","Inappropriate until the data question is resolved"],a:3,why:"Data sensitivity is an independent gate. It can block delegation even when the other three criteria are green."},
{c:"c4",l:"c4l4",q:"Claude extracted all clauses perfectly. A colleague suggests it should therefore approve the contract changes. What is this?",opts:["Reasonable escalation","Halo delegation","Over-automation","Task-fit mismatch"],a:1,why:"Halo delegation — inferring permission from performance. Drafting quality is not decision authority; apply the four criteria to each step."},
{c:"c4",l:"c4l4",q:"Who signs and sends the contract?",opts:["AI-appropriate","Collaborative","Human-retained","Depends on the model"],a:2,why:"External, irreversible and legally binding. Accountability cannot be delegated."},
{c:"c4",l:"c4l4",q:"“AI drafts, human reviews” with no named reviewer is an example of…",opts:["Halo delegation","Treating collaboration as automation","Mapping the tool instead of the work","Over-delegation"],a:1,why:"Without a named reviewer and a defined review standard, the human step is fictional and the process is effectively automated."},

/* ---- C4 L5 ---- */
{c:"c4",l:"c4l5",q:"Which statement describes the workflow accurately?",opts:["“Our AI system reviews contracts automatically.”","“Claude drafts the redline and flags playbook differences; the legal lead reviews and approves every change before anything is sent.”","“Claude handles everything.”","“Human review is no longer required.”"],a:1,why:"It states what Claude does, identifies the review gate, and names who is accountable."},

/* ---- C5 L1 ---- */
{c:"c5",l:"c5l1",q:"“Always cite sources for factual claims” belongs where?",opts:["Knowledge base","Project instructions","Scoped memory","A connector"],a:1,why:"It is behaviour applied to every conversation — project instructions."},
{c:"c5",l:"c5l1",q:"“Company brand colours and logo guidelines” belong where?",opts:["Project instructions","Knowledge base","Scoped memory","Project instructions and memory"],a:1,why:"Reference facts, reused without re-upload — the knowledge base."},
{c:"c5",l:"c5l1",q:"Account preferences conflict with project instructions. What applies inside the Project?",opts:["Account preferences","Project instructions","Whichever is newer","Claude asks each time"],a:1,why:"Project-level instructions take precedence inside that Project."},
{c:"c5",l:"c5l1",q:"Which statement about scoped memory is correct?",opts:["It is global across all Projects","It is project-scoped, Claude-generated and user-editable","It is a complete and automatic recall of past conversations","It cannot be disabled"],a:1,why:"Memory is project-scoped by design, plan-gated, editable, and explicitly not perfect recall."},
{c:"c5",l:"c5l1",q:"A knowledge base with 40 documents produces partial recall. Most likely cause?",opts:["The prompt is too short","Over-uploading degrades retrieval","Claude cannot read PDFs","The model is too small"],a:1,why:"Claude retrieves relevant excerpts rather than loading the whole KB. Over-uploading causes partial recall — and is usually blamed on prompting."},

/* ---- C5 L2 ---- */
{c:"c5",l:"c5l2",q:"A connector searches messages but errors when asked to send one. What does this indicate?",opts:["A permission bug","The connector has reached its defined capability boundary","The connector is not authenticated","The workspace admin blocked it"],a:1,why:"Capability limits are boundaries, not malfunctions. Sending was never within its permitted scope."},
{c:"c5",l:"c5l2",q:"Whose permissions does a connector operate under?",opts:["The workspace admin's","The authorising user's — no more, no less","The organisation's maximum permissions","Claude's own service account"],a:1,why:"Connectors never exceed the permissions of the user who authorised them."},
{c:"c5",l:"c5l2",q:"Where do connectors operate?",opts:["Inside a single Project","At account or organisation level","Only in Claude Code","Per conversation"],a:1,why:"Connectors are the fifth configuration surface and live above the Project level."},
{c:"c5",l:"c5l2",q:"A colleague finds a custom MCP server URL online and wants to connect it. What is the correct guidance?",opts:["Connect it — MCP is standard","Use the organisation's approved connector list; admins can allowlist or block","Connect it and review later","Ask Claude whether it is safe"],a:1,why:"Arbitrary MCP URLs bypass the governance that the approved list provides."},

/* ---- C5 L3 ---- */
{c:"c5",l:"c5l3",q:"Why does “make the reports professional” fail as an instruction?",opts:["It is too long","It describes an outcome without observable criteria","It is too specific","It conflicts with the knowledge base"],a:1,why:"It has no measurable criterion, so it is interpreted differently each time and compliance cannot be verified."},
{c:"c5",l:"c5l3",q:"Which is a measurable project instruction?",opts:["“Make reports high quality.”","“Use formal language, define acronyms on first use, keep paragraphs under four sentences.”","“Be professional and accurate.”","“Match our house style.”"],a:1,why:"Every element is observable and repeatable, so any reviewer can verify compliance."},

/* ---- C5 L4 ---- */
{c:"c5",l:"c5l4",q:"A reporting Project produces subtly worse output over months. What do you investigate first?",opts:["Rewrite the prompts","Configuration drift — stale instructions, duplicate documents, outdated memory","Switch models","Increase context"],a:1,why:"Gradual degradation is the signature of drift. The fix is maintenance, not prompt engineering."},
{c:"c5",l:"c5l4",q:"You are about to restructure a Project. What does the official course say to do with Memory first?",opts:["Export it as a backup","Turn memory off","Nothing — memory cannot be changed","Copy it into the knowledge base"],a:0,why:"Official: export Memory as a backup before a major change, and do a full reset if accumulated outdated context would mislead."},
{c:"c5",l:"c5l4",q:"How should review cadence be decided?",opts:["Monthly for every Project","Match it to how often underlying documents and processes change, plus event-driven reviews","Only annually","Whenever output looks wrong"],a:1,why:"Monthly is a reasonable default, but cadence should track change frequency, and trigger events (fiscal rollover, policy reissue, team change) always earn an extra review."},
{c:"c5",l:"c5l4",q:"Which must never be placed in project instructions or the knowledge base?",opts:["Tone guidelines","Credentials and regulated personal data","Formatting templates","Citation rules"],a:1,why:"Configuration surfaces are not secure storage. Secrets and regulated personal data never belong in them."},

/* ---- C6 L1 ---- */
{c:"c6",l:"c6l1",q:"What distinguishes an 'inappropriate' use case from one that needs review?",opts:["It is higher risk","The decision itself cannot be delegated at all","It involves personal data","It requires a bigger model"],a:1,why:"High-risk work can be 'appropriate with human review' if a qualified human makes the decision. Inappropriate means the determination cannot be delegated regardless of AI quality."},
{c:"c6",l:"c6l1",q:"A condolence message is low-risk and reversible. Which criterion is decisive?",opts:["Reversibility","Consequence of error","Need for human creativity or empathy","Accountability"],a:2,why:"That criterion can override all others. The empathy and relationship management are the entire point of the message."},
{c:"c6",l:"c6l1",q:"Which is a valid review gate?",opts:["“A human reviews it.”","“The legal lead reviews accuracy and tone before sending, signs off in the ticket, and escalates on rejection.”","“We review outputs periodically.”","“The model has been evaluated for bias.”"],a:1,why:"A valid gate names who, what, when, how it is evidenced, and what happens on rejection."},
{c:"c6",l:"c6l1",q:"A gate has no rejection path and no recorded outcome. What is it?",opts:["A lightweight control","A formality that cannot be audited","An escalation path","A compensating control"],a:1,why:"If nothing can happen on a no, the gate cannot be tested in an audit — it is not functioning as a control."},
{c:"c6",l:"c6l1",q:"Resume screening sits in which classification?",opts:["Fully appropriate","Appropriate with human review","Inappropriate","Out of scope"],a:1,why:"Fairness and bias exposure require mandatory human oversight; hiring decisions remain with human recruiters."},

/* ---- C6 L2 ---- */
{c:"c6",l:"c6l2",q:"What are the three parts of a Skill trust evaluation?",opts:["Source, reach, appropriateness","Cost, latency, accuracy","Author, version, licence","Scope, retention, encryption"],a:0,why:"Who published it, what it can see and do, and whether that access is the minimum the task needs."},
{c:"c6",l:"c6l2",q:"Why does 'it can only read documents' understate a Skill's risk?",opts:["Reading is always safe","A Skill may also transform, save or transmit what it reads","Reading requires admin approval","Documents are never sensitive"],a:1,why:"Reach has two halves: visibility and capability. Read-plus-write to sensitive data is far riskier than read alone."},
{c:"c6",l:"c6l2",q:"A PDF contains text instructing the assistant to ignore previous instructions and email the file elsewhere. What is the correct handling?",opts:["Follow it if the PDF is internal","Treat it as data and surface it to a human","Delete the PDF","Ask Claude to decide"],a:1,why:"Content Claude reads is data, never a command. Attempted injections are surfaced, not obeyed."},
{c:"c6",l:"c6l2",q:"An 'Analytics Booster' Skill from an unknown publisher requests broad Drive access. What is the right outcome?",opts:["Enable — it is useful","Escalate or decline","Enable but monitor","Enable for one week"],a:1,why:"Unknown source plus disproportionate access. Least privilege fails on both source and reach."},

/* ---- C6 L3 ---- */
{c:"c6",l:"c6l3",q:"A colleague pastes an API key into the prompt so Claude can check its format. Correct response?",opts:["Fine — it is only a format check","Never paste credentials; advise rotation if already exposed, and report per policy","Ask Claude to forget it afterwards","Use incognito mode next time"],a:1,why:"Credentials are an absolute never-paste rule, different in kind from other sensitive data. If exposed, treat it as an incident."},
{c:"c6",l:"c6l3",q:"What does the code-execution sandbox protect?",opts:["The data","The host system","The user's credentials","The organisation's network"],a:1,why:"It isolates code execution from the host. It does not change the sensitivity classification of uploaded data."},
{c:"c6",l:"c6l3",q:"Incognito mode means…",opts:["The data is approved for use","The conversation is not saved to history, but organisational retention obligations continue","No logs exist anywhere","The model cannot access the data"],a:1,why:"Incognito changes where the record lives, not whether the data was permitted, and not the organisation's audit obligations."},
{c:"c6",l:"c6l3",q:"You remove names but keep employee IDs. What is the problem?",opts:["Nothing — names are the identifier","Partial redaction: the individual can still be re-identified","It uses too many tokens","The IDs improve analysis"],a:1,why:"The redaction test is whether someone can be re-identified from what remains. A unique identifier defeats name removal."},
{c:"c6",l:"c6l3",q:"Is Green/Yellow/Red an official Anthropic taxonomy?",opts:["Yes","No — it is an illustrative course model to map onto your organisation's labels","Yes, for Enterprise only","It is an ISO standard"],a:1,why:"The notes are explicit: an illustrative model, not an Anthropic or industry-standard taxonomy."},

/* ---- C6 L4 ---- */
{c:"c6",l:"c6l4",q:"You realise restricted data was uploaded two days ago. What do you do?",opts:["Wait for the next audit","Report it through the incident channel immediately","Delete the conversation and say nothing","Ask Claude to remove it"],a:1,why:"Incident reporting is the one governance behaviour you may need on day one. Never wait for an audit to surface it."},

/* ---- C6 L5 ---- */
{c:"c6",l:"c6l5",q:"What is the most frequent day-to-day ethical risk?",opts:["Bias in hiring","Factual unreliability — confident, fluent, wrong output","Copyright infringement","Model drift"],a:1,why:"Fluency plus fabrication is the everyday risk, and every review gate depends on someone checking the figure."},
{c:"c6",l:"c6l5",q:"When should you disclose AI involvement?",opts:["Only when legally required","When required by contract, regulation or audience expectation — and when in doubt","Never, to avoid reputational risk","Only for external audiences"],a:1,why:"The reputational cost of undisclosed AI discovered later exceeds the cost of disclosure. When in doubt, disclose."},

/* ---- C7 L1 ---- */
{c:"c7",l:"c7l1",q:"What is the first diagnostic clue for a failing output?",opts:["The model version","When the problem appears","The prompt length","The token count"],a:1,why:"Timing separates the five patterns faster than any other signal — first response, gradual decline, repeated specific error, worked-before, or impossible."},
{c:"c7",l:"c7l1",q:"A conversation started strong and now ignores earlier formatting instructions. What is the fix?",opts:["A better prompt","Start a fresh conversation with your own summary and reload essential context","Switch models","Add more examples"],a:1,why:"That is context overload. A better prompt will not solve it because the earliest turns have fallen out of scope."},
{c:"c7",l:"c7l1",q:"A workflow worked perfectly last month and now consistently underperforms. What do you check?",opts:["Configuration drift","Temperature","Token limits","Prompt length"],a:0,why:"Consistent, repeatable decline after a period of good performance is the signature of stale configuration."},
{c:"c7",l:"c7l1",q:"A Skill 'isn't working'. What is the most common actual cause?",opts:["The procedure logic is broken","The description is too vague, so the Skill never fires","The model is too small","The Skill was deleted"],a:1,why:"A vague description means the Skill never triggers. It is a description problem far more often than a logic problem."},
{c:"c7",l:"c7l1",q:"Which is the last step of the official diagnostic sequence?",opts:["Re-read the prompt","Check conversation length","Re-evaluate whether the task fits at all","Review configuration"],a:2,why:"Official order, cheapest first: prompt (five components) → conversation length → feature/model → configuration → only then task fit. Task fit is the most expensive conclusion, so it comes last."},
{c:"c7",l:"c7l1",q:"You asked for next quarter's exact sales figure. What is the correct fix?",opts:["Use a bigger model","Reframe: ask for a range, key factors, and scenarios","Add more context","Turn on extended thinking"],a:1,why:"This is a task-fit mismatch. No wording makes a single precise future number reliable; reframing makes the request answerable."},

/* ---- C7 L2 ---- */
{c:"c7",l:"c7l2",q:"Which is an actionable fix rather than a reaction?",opts:["“Too generic.”","“Add the target audience and state the decision the reader must make.”","“Not quite right.”","“Make it better.”"],a:1,why:"The test is whether someone else could apply the fix without asking what you meant."},
{c:"c7",l:"c7l2",q:"You have corrected the same omission three times. What should happen?",opts:["Keep correcting manually","Promote the correction into configuration — instructions, KB or a Skill","Switch models","Shorten the prompt"],a:1,why:"If you are fixing the same thing more than twice, it belongs in configuration, not in your head."},

/* ---- C7 L3 ---- */
{c:"c7",l:"c7l3",q:"Different analysts get different outputs for the same weekly report. Which friction is this?",opts:["Repetition","Repeated corrections","Variability","Context overload"],a:2,why:"Variability is solved with shared Skills, shared knowledge bases and standardised configuration."},
{c:"c7",l:"c7l3",q:"Where does a multi-step data-extraction procedure belong?",opts:["Project instructions","Knowledge base","A Skill","Scoped memory"],a:2,why:"Procedures map to Skills; rules map to instructions; references map to the knowledge base."},
{c:"c7",l:"c7l3",q:"How should before/after workflow metrics be treated?",opts:["As benchmarks to promise management","As illustrative examples, not expected savings","As guaranteed ROI","As irrelevant"],a:1,why:"Measure your own workflow, but do not quote training examples as expected savings."},

/* ---- C8 ---- */
{c:"c8",l:"c8l1",q:"Which order matches the certification lifecycle?",opts:["Prompt, configure, validate, govern","Select capability, prompt, validate, integrate, configure, govern, optimise","Govern, prompt, validate, configure","Configure, prompt, select capability, optimise"],a:1,why:"Capability choice comes first because no prompt rescues the wrong tool."},
{c:"c8",l:"c8l2",q:"Which set is the 4 Ds of AI Fluency?",opts:["Delegation, Description, Discernment, Diligence","Design, Develop, Deploy, Document","Detect, Decide, Delegate, Deliver","Describe, Diagnose, Decide, Deliver"],a:0,why:"They operate simultaneously, not as a sequence."},
{c:"c8",l:"c8l2",q:"Which competency covers deciding what Claude does versus what a human does?",opts:["Description","Discernment","Delegation","Diligence"],a:2,why:"Delegation is the division of labour between human and AI."},
{c:"c8",l:"c8l3",q:"A stakeholder asks you to build a custom MCP server. What is the appropriate response?",opts:["Build it — it is straightforward","Recognise it as developer-level work outside Associate scope and escalate","Ask Claude to build it","Decline and end the conversation"],a:1,why:"The Associate scope excludes developer-level work such as building an MCP server. Recognise the boundary and route to someone with Developer-level skills."}
];

window.CA.glossary = [
  {t:"Artifact", d:"A stand-alone, editable output surface inside Claude Chat or a Project — reports, code, documents. Medium reliability; needs human review. Runs client-side on data supplied in the conversation, with no live refresh."},
  {t:"Capability hallucination", d:"Claude implying it performed an external action (sent mail, saved a file, notified a colleague) when no tool did. Verify side effects externally."},
  {t:"Code execution", d:"An isolated, session-scoped sandbox with no internet access. Inputs must be uploaded. Highest reliability for numerical work; it does not change data sensitivity."},
  {t:"Configuration drift", d:"Gradual quality decline caused by stale instructions, duplicate or outdated knowledge, misaligned Skills or outdated memory — not by prompting."},
  {t:"Connector", d:"An account/org-level integration giving Claude access to an external system under the authorising user's own permissions. Highest-reach surface; grants standing access."},
  {t:"Context overload", d:"The third failure pattern: a conversation long enough that early turns fall out of scope, so instruction adherence dilutes. Fix by restarting with your own summary."},
  {t:"Decomposition", d:"Splitting a task into sequential steps with reviewable artefacts. Justified by reviewability and error isolation, not context limits."},
  {t:"Delegation mapping", d:"Listing every workflow step and assigning it as AI-appropriate, collaborative or human-retained using reversibility, stakes and accountability (official Workflow module)."},
  {t:"Diligence", d:"The competency of knowing when extra verification or human review is required, and taking ownership of the final deliverable."},
  {t:"Discernment", d:"The competency of critically evaluating output against requirements, source material and professional standards."},
  {t:"Extended thinking", d:"A mode giving the model room to reason before answering. The first lever for 'lacks depth despite detailed instructions'."},
  {t:"Few-shot", d:"Supplying one or two worked examples of the desired shape and tone. Often the highest-impact single prompt addition."},
  {t:"Halo delegation", d:"Delegating the next step because Claude performed the previous one well. Prevented by applying the four criteria to every step."},
  {t:"Incognito mode", d:"Prevents a session appearing in memory and history. Does not override organisational retention or audit obligations, and does not make data approved."},
  {t:"Knowledge base", d:"Project-level store of facts and reference material. Claude retrieves relevant excerpts rather than loading all of it; over-uploading degrades recall."},
  {t:"Memory (scoped)", d:"Project-scoped continuity: stakeholder names, decisions, long-running preferences. Plan-gated, user-editable; export as a backup before major changes."},
  {t:"Over-delegation", d:"Giving AI more responsibility than the step's risk profile permits — a good draft is not approval authority."},
  {t:"Project instructions", d:"Persistent behaviour for all conversations in a Project: tone, format, verification and citation practice. Precedence over account preferences inside that Project."},
  {t:"Prompt injection", d:"Instructions embedded in content Claude reads (PDF, web page, connector record). Treated as data, never a command; surfaced to a human."},
  {t:"Review gate", d:"A defined control specifying who reviews, what is reviewed, when (before use), how it is evidenced, and what happens on rejection."},
  {t:"Skill", d:"A versioned, account-level package of instructions plus optional files and scripts implementing a repeatable procedure. Treated as software, owned by someone."},
  {t:"Stale configuration", d:"Failure pattern four: the workflow worked before and now consistently underperforms because the environment drifted. Distinguish from ordinary non-determinism."},
  {t:"Structured output", d:"Machine-readable output (tables, schemas). In claude.ai there is no dedicated mode; enforced schema-valid JSON is API-only."},
  {t:"Task-fit mismatch", d:"Failure pattern five: the request is beyond what a language model can reliably deliver (e.g. one precise future number). Fix by reframing."},
  {t:"Under-specification", d:"Failure pattern one: the prompt lacks context, constraints, audience or output specs, so the first response is already wrong."},
  {t:"Yellow data", d:"Internal documents, contact information, drafts, unreleased project info. 'Pause and check' before uploading; consider redaction."}
];
