<script>
/* ==== practice-c.js ==== */
/* Modules 1, 2, 3, 6 — quiz items, flashcards, glossary, blueprint */
(function () {

  var quiz = [
  /* ---------- Module 1 ---------- */
  {c:"m1",l:"m1l1",q:"What distinguishes generative AI from the classifiers most people already use?",opts:["It runs faster","It produces new content one token at a time rather than sorting inputs into buckets","It has internet access","It is trained on more data"],a:1,why:"Spam filters, recommenders and fraud detection classify, rank or predict. Generative models produce content token by token — and every property in this module follows from that."},
  {c:"m1",l:"m1l1",q:"Claude invents a plausible-looking statistic to fill a gap in an answer instead of saying it does not know. What is this called?",opts:["Hallucination","Confabulation","Sycophancy","Source amnesia"],a:1,why:"Confabulation is specifically filling a gap with plausible material. Hallucination is the broader term for false-but-fluent output. The distinction is tested."},
  {c:"m1",l:"m1l1",q:"Which sampling setting keeps the smallest set of candidates whose probabilities sum to p, adapting to the model's confidence?",opts:["Temperature","Top-k","Top-p","Frequency penalty"],a:2,why:"Top-k keeps a fixed number of candidates. Top-p keeps a probability mass, so the candidate set widens when the model is unsure and narrows when it is confident."},
  {c:"m1",l:"m1l1",q:"Which part of a generated summary most deserves verification?",opts:["The overall gist","The names, dates, statistics and citations","The paragraph order","The tone"],a:1,why:"Fabrication concentrates in specificity. Summarising is a well-worn path, so the gist is usually sound — the precise tokens are where invention hides."},
  {c:"m1",l:"m1l2",q:"A question concerns last week's news. Which mitigation actually addresses the cause?",opts:["A larger context window","Web search","A more capable model","A cleaner prompt"],a:1,why:"The knowledge cutoff is a Knowledge property. A bigger context window is Working Memory and cannot contain facts that post-date training."},
  {c:"m1",l:"m1l2",q:"In embedding terms, what does cosine similarity measure?",opts:["The length of a vector","The closeness of two vectors by direction, from -1 to 1","The number of shared words","The model's confidence"],a:1,why:"Embeddings place meaning at coordinates; cosine similarity compares direction. -1 is opposite, 0 unrelated, 1 identical."},
  {c:"m1",l:"m1l3",q:"Which property fails as a cliff rather than degrading gradually?",opts:["Next Token Prediction","Knowledge","Working Memory","Steerability"],a:2,why:"The context window works until it does not — and truncation can be silent. The other three degrade more gracefully."},
  {c:"m1",l:"m1l3",q:"A critical instruction sits in the middle of a 20-page pasted brief and is missed. Best fix?",opts:["Paste even more context","Put the instruction at the start and restate it at the end","Ask for a longer answer","Switch models"],a:1,why:"This is lost in the middle — a primacy-recency U-curve, with a 30%+ accuracy drop for mid-context facts. Adding context pushes the instruction deeper into the dead zone."},
  {c:"m1",l:"m1l4",q:"Claude follows 'make it shorter' literally and deletes the key ask. What is the correct fix?",opts:["Repeat the instruction with emphasis","Restate the goal, e.g. 'shorten it so a skimmer sees the ask in line one'","Switch to a more capable model","Start a new chat"],a:1,why:"This is letter over spirit. Repeating louder does not close the gap between your words and your intent — only stating the goal does."},
  {c:"m1",l:"m1l4",q:"Which fine-tuning fingerprint explains why Claude tends to agree with a flawed premise you present confidently?",opts:["Verbosity","Sycophancy","Over-caution","Loose confidence calibration"],a:1,why:"Sycophancy pulls toward validating your framing. The counter is explicit: invite disagreement, or ask for the counter-case."},
  {c:"m1",l:"m1l4",q:"Claude builds confidently on a mistaken figure you supplied earlier in the conversation. Which collision is this?",opts:["NTP + Knowledge","Working Memory + Steerability","NTP + Working Memory (context-poisoned generation)","Knowledge + Steerability"],a:2,why:"Fluent generation continues from bad context — the failure pairs Next Token Prediction with Working Memory. Curate context carefully."},
  {c:"m1",l:"m1l4",q:"Which pair produces 'agreeable bad premises'?",opts:["NTP + Knowledge","Knowledge + Steerability","Working Memory + Steerability","NTP + Steerability"],a:1,why:"The model accepts your framing (Steerability) using plausible domain assumptions (Knowledge). The fix is to explicitly invite pushback."},

  /* ---------- Module 2 ---------- */
  {c:"m2",l:"m2l1",q:"You are on an Enterprise plan and cannot find Claude Slides or Docs. Most likely reason?",opts:["Your plan does not include them","They are off by default on Enterprise until an admin enables them under Organization settings > Artifacts","They require a Developer certification","They were removed"],a:1,why:"Design, Slides and Docs are on by default for Pro/Max/Team, off by default on Enterprise until an Owner enables them."},
  {c:"m2",l:"m2l1",q:"Which surface is specifically designed for a multi-step task that ends in a deliverable file?",opts:["Chat","Cowork","Claude Tag","Learning mode"],a:1,why:"Chat is turn by turn — you stitch the steps. Cowork plans across tools and delivers the finished artifact."},
  {c:"m2",l:"m2l2",q:"Why does adding detail to a Project's description field not change Claude's behaviour?",opts:["It is limited to 500 characters","Claude does not see the description; it is for humans","It only applies after the first message","It is overridden by memory"],a:1,why:"The description is organizational metadata for people. Instructions are what Claude follows — a favourite exam distinction."},
  {c:"m2",l:"m2l2",q:"A Project knowledge base approaches the context limit. What happens?",opts:["It stops accepting files","Claude switches to searching the knowledge base via RAG, up to 10x capacity","It silently truncates the oldest files","It duplicates the knowledge into memory"],a:1,why:"Near the limit, Claude retrieves relevant chunks instead of holding everything. Filenames and document hygiene become retrieval features."},
  {c:"m2",l:"m2l3",q:"You need a Word file to send to a client. Artifact or file creation?",opts:["Artifact — it is shareable by link","File creation — a downloadable Office document","Either; they are the same object","Neither; use Research"],a:1,why:"Artifacts live and update inside Claude and are shared by link. A document that must leave Claude and be circulated is file creation."},
  {c:"m2",l:"m2l3",q:"What must be enabled before Skills will work?",opts:["Web search","Code execution and file creation","A paid plan only","Connectors"],a:1,why:"Skills can run code, so they require code execution and file creation — Settings > Capabilities. On Enterprise an Owner must enable it first."},
  {c:"m2",l:"m2l4",q:"What does MCP stand for, and what is the common analogy?",opts:["Model Control Protocol — a firewall","Model Context Protocol — USB-C for AI","Managed Connector Platform — a plugin store","Multi-Channel Pipeline — an API gateway"],a:1,why:"MCP is the open standard behind connectors, described as USB-C for AI: one socket for many tools."},
  {c:"m2",l:"m2l4",q:"A user worries that connecting Gmail lets Claude read the CEO's inbox. What is true?",opts:["It does — connectors use org-wide permissions","It sees only what the user can see, with scoped and revocable permissions","It can read but not search","It depends on the model tier"],a:1,why:"Connectors operate under the authorising user's own permissions, scoped and revocable."},
  {c:"m2",l:"m2l4",q:"Which tool fits a comprehensive comparative report that needs citations from many sources?",opts:["Web search","Research","Thinking","Enterprise Search"],a:1,why:"Research is the agentic multi-source investigation. Web search is for a quick single fact; Thinking is for reasoning without external information."},

  /* ---------- Module 3 ---------- */
  {c:"m3",l:"m3l1",q:"Which four decisions are made before the first prompt?",opts:["Tone, length, format, examples","Entry point, capability layer, model, context management","Role, task, constraints, output","Prompt, refine, verify, publish"],a:1,why:"These set the quality ceiling. No prompt recovers from choosing the wrong entry point, capability or model — or from running out of context."},
  {c:"m3",l:"m3l2",q:"A weekly report recurs, the background changes every week, and the format is fixed. Build a Project?",opts:["No, because the background is not stable","Yes — two of the three conditions hold","Only if the output format is inconsistent","Only for the first report"],a:1,why:"The official Project test has three questions: does it recur, is the background stable, is the format consistent? Yes to 2 or more → build it. Recurrence and format are two."},
  {c:"m3",l:"m3l3",q:"Which layer verifies a computation rather than generating one?",opts:["Projects","Skills","Code execution","Memory"],a:2,why:"Prose gives plausible numbers; code gives a verified result. Use code execution for any numeric output that will be reported."},
  {c:"m3",l:"m3l3",q:"A consultant serves two competitors and context must never cross. Correct setup?",opts:["Incognito for every session","One Project with careful prompts","Separate Projects with Project-scoped memory","Different models per client"],a:2,why:"Memory is isolated per Project. Incognito works only outside Projects and would destroy all useful continuity."},
  {c:"m3",l:"m3l5",q:"Two hours in, Claude stops following the framework set at the start. Best response?",opts:["Re-paste the framework in the same chat","Switch to Opus","Start a new chat with a summary of decisions and progress","Turn on Research"],a:2,why:"This is context exhaustion. Repeating extends a degraded session; a bigger model does not add context. Restart from a summary."},
  {c:"m3",l:"m3l3",q:"Which is true of memory import from other AI platforms?",opts:["It is available on every plan including Enterprise","It is experimental and documented for Free, Pro, Max and Team but not Enterprise","It imports directly into the Project knowledge base","It replaces manual memory curation"],a:1,why:"Memory import is experimental and not available on Enterprise. The fallback is adding key facts to Memory manually — not to a Project knowledge base."},
  {c:"m3",l:"m3l4",q:"500 vendor agreements must be classified against a clear, unambiguous rubric in one session. Which model?",opts:["Opus","Sonnet","Haiku","Any model; they are identical"],a:2,why:"Structured classification at volume with a clear rubric is exactly Haiku's strength. Opus is for nuanced judgement, not volume."},
  {c:"m3",l:"m3l4",q:"A one-off 15-page board analysis from four reports with ambiguous inputs. Which model, and why?",opts:["Haiku for speed","Sonnet because it is the default","Opus, buying depth of reasoning for a high-stakes one-off","Any; the model does not affect quality"],a:2,why:"Ambiguity plus high stakes is the Opus case. Sonnet would be right if it were routine or time-critical; Haiku would under-resource it."},
  {c:"m3",l:"m3l4",q:"Why should you not answer exam questions with a fourth model tier?",opts:["It does not exist","The exam uses the three-tier Haiku/Sonnet/Opus frame","It is not available in the EU","It is only for API users"],a:1,why:"The product has added a tier above Opus, but the exam explicitly uses the three-tier frame. Answer within it."},

  /* ---------- Module 6 ---------- */
  {c:"m6",l:"m6l1",q:"In Cowork, which confirmation appears even when 'Act without asking' is selected?",opts:["Sending email","Posting to Slack","Permanently deleting a file","Reading a folder"],a:2,why:"Permanent deletion always asks, and that prompt cannot be skipped. Send, post and share confirmations are skippable in the other mode."},
  {c:"m6",l:"m6l1",q:"What does choosing a working folder actually grant?",opts:["Read-only access","Read and write access — open, edit, create and organise in that folder","Access to the whole drive","Temporary access for one message"],a:1,why:"That read/write scope is the difference from attaching a file to a chat. Choose a folder scoped to one project, never your whole Documents."},
  {c:"m6",l:"m6l1",q:"A task started from your phone needs files on your laptop. What happens?",opts:["It works normally","It reaches connectors but not local folders","It copies the files automatically","It runs when the laptop wakes"],a:1,why:"Web and phone tasks are remote by design. They cannot reach local folders — the desktop app is required for local files."},
  {c:"m6",l:"m6l2",q:"A scheduled Friday roll-up uses only Gmail and Slack connectors, and your laptop is off. What happens?",opts:["It fails silently","It runs remotely on schedule","It waits until the app opens","It runs in Incognito"],a:1,why:"Connector-only tasks run remotely. Only tasks needing local files or apps require the desktop app to be open — and those are picked up and reported as delayed if you were away."},
  {c:"m6",l:"m6l2",q:"A Cowork draft is mostly right but one section has the wrong tone. Best move?",opts:["Regenerate the whole thing","Tell Claude what to change in that section","Start a new task","Switch to Chat"],a:1,why:"It edits faster than it regenerates. Reserve a restart for a load-bearing error, which usually means the prompt lacked load-bearing context."},
  {c:"m6",l:"m6l3",q:"You need every user to run a compliance-check plugin with no opt-out. Which publish option?",opts:["Available","Installed by default","Required","Private"],a:2,why:"Available is optional. Installed by default can be turned off. Required stays on — the correct choice for compliance."},
  {c:"m6",l:"m6l3",q:"When evaluating a new skill, what is the comparison point?",opts:["Your previous skill version","The same prompt answered without the skill (the baseline)","The best output you have ever seen","A competitor's product"],a:1,why:"The baseline is the same prompt without the skill. Ship when the cases you care about beat it meaningfully and you can name the gaps that remain."},
  {c:"m6",l:"m6l3",q:"Data lives in an internal dashboard with no connector. Best approach?",opts:["Export it manually every week","Claude in Chrome with Cowork — you sign in first","Ask Research to find it","Use Enterprise Search"],a:1,why:"Chrome is the bridge for tools without a connector. It cannot sign in for you; you authenticate once and it works in your session."},
  {c:"m6",l:"m6l3",q:"A regulated workflow needs a complete audit trail of AI activity. Is Cowork suitable?",opts:["Yes, always","No — Cowork activity is not in audit logs or exports","Yes, if you use Opus","Yes, in Incognito"],a:1,why:"Cowork transcripts are not in audit logs or data exports; the Compliance API returns them only for Enterprise, in beta. Regulated audit-trail work belongs elsewhere."},
  {c:"m6",l:"m6l3",q:"Which is the difference between global instructions and project instructions?",opts:["Global is per chat; project is per message","Global applies to every session; project applies within one workstream","They are the same setting","Global only works in Cowork"],a:1,why:"Global instructions are your standing brief across every session. Project instructions scope to one stream of work."},
  {"c":"m3","l":"m3l2","q":"You are about to create a quarterly board deck. Is an Artifact a place to start the work?","opts":["Yes — it is a workspace like a Project","No — an Artifact is an output produced inside Chat or a Project","Only on paid plans","Only if the deck is longer than ten slides"],"a":1,"why":"An Artifact is the shape of the deliverable, not a workspace. You work in Chat or a Project and ask for the artifact to be produced there."},
  {"c":"m3","l":"m3l1","q":"A very long chat stops following an instruction given at the start. What is the official explanation?","opts":["Claude is deliberately ignoring it","Near the context limit, earlier messages were auto-summarised and the instruction lost its detail","The model forgot its training data","The instruction was too vague"],"a":1,"why":"The official course: near the limit, claude.ai auto-summarises earlier messages (paid plans with code execution). Detail compresses, so early instructions lose force. That is not Claude ignoring you — fix it with restart, summarise or persist."},
  {"c":"m3","l":"m3l3","q":"What is the difference between an upload and a connector?","opts":["An upload is larger","An upload adds information to one chat or Project; a connector links a live external system under the user's own permissions","A connector is only for email","They are the same thing with different names"],"a":1,"why":"An upload is a snapshot you supplied. A connector reaches a live system, and Claude sees only what that user can see."},
  {"c":"m3","l":"m3l3","q":"Which is appropriate to store in memory?","opts":["A client's confidential financial data","A colleague's personal contact details","Your role, preferred styles, frequent collaborators and standard rules","An API key so you do not have to paste it again"],"a":2,"why":"Memory is a convenience surface, not a safe. Never store confidential client data, personal data or credentials in it."},
  {"c":"m3","l":"m3l3","q":"Code execution produced a total. What has actually been verified?","opts":["The logic and the inputs are correct","That the code ran","That the business assumption is sound","That the figure matches last quarter"],"a":1,"why":"Verified means the code executed. A human must still check the logic and the input data — code removes arithmetic error, not judgement error."}
  ];

  var cards = [
  /* Module 1 */
  {c:"m1",t:"Properties",q:"Name the four properties of generative AI and the question each answers.",a:"Next Token Prediction (where do answers come from?), Knowledge (what does it actually know?), Working Memory (what is it paying attention to now?), Steerability (how much am I in control?)."},
  {c:"m1",t:"Properties",q:"What is calibrated trust?",a:"Locating a task on each of the four continua and matching verification to that position — not 'trust everything' or 'trust nothing'."},
  {c:"m1",t:"NTP",q:"What are the two sides of next token prediction?",a:"Fluency and hallucination — the same mechanism. A plausible continuation is not always a true one."},
  {c:"m1",t:"NTP",q:"Hallucination versus confabulation.",a:"Hallucination = false but plausible output. Confabulation = filling a gap with plausible material instead of flagging that the gap exists."},
  {c:"m1",t:"NTP",q:"Where does fabrication concentrate?",a:"Specificity — names, dates, statistics, citations, URLs, quotes. The more precise the claim, the more verification it earns."},
  {c:"m1",t:"Sampling",q:"Define the three sampling knobs.",a:"Temperature = overall randomness. Top-k = keep the k most likely candidates. Top-p = keep the smallest set whose probabilities sum to p, so it adapts to confidence."},
  {c:"m1",t:"Knowledge",q:"What is the right question to ask about the knowledge property?",a:"Not 'does it know this?' but 'how well-represented was this in what it read?' Coverage is uneven, and the cutoff is absolute."},
  {c:"m1",t:"Knowledge",q:"What is an embedding, and how is similarity measured?",a:"Text mapped to a fixed-length vector so meaning becomes position; similarity is measured by cosine similarity (-1 opposite, 0 unrelated, 1 identical)."},
  {c:"m1",t:"Knowledge",q:"What is source amnesia?",a:"The model cannot say where it learned something — 'I read it somewhere' is not a citation. It is why specific claims need an external source check."},
  {c:"m1",t:"Working memory",q:"Which property fails as a cliff, and why does that matter?",a:"Working memory. It works until it does not, and truncation can be silent — unlike the other three, which degrade gradually."},
  {c:"m1",t:"Working memory",q:"What is 'lost in the middle', and what is the practical rule?",a:"Attention follows a U-curve: the start and end get weight, the middle drops by 30%+ when it holds the key fact. Put critical instructions at the start and repeat them at the end."},
  {c:"m1",t:"Working memory",q:"Do corrections teach the model?",a:"No. A correction changes only the context of that conversation. To make it stick, use Project instructions, a Skill or Memory."},
  {c:"m1",t:"Steerability",q:"Why does steerability work, and why is it limited?",a:"It works because fine-tuning taught instruction-following; it is limited because instructions are followed by pattern-matching, not understanding."},
  {c:"m1",t:"Steerability",q:"What is the fix for letter-over-spirit?",a:"Restate the goal. Repeating the instruction more forcefully does not close the gap between your words and your intent."},
  {c:"m1",t:"Fingerprints",q:"Name the four fine-tuning fingerprints.",a:"Sycophancy (agrees with you), verbosity (defaults long), over-caution (hedges or declines too readily), loose confidence calibration (stated confidence does not track reliability)."},
  {c:"m1",t:"Collisions",q:"Name three property collisions and their fixes.",a:"NTP + Knowledge = hallucinated citations (verify independently). Working Memory + Steerability = long-conversation drift (re-supply context or restart). Knowledge + Steerability = agreeable bad premises (invite pushback)."},
  {c:"m1",t:"Training",q:"What are the two training stages?",a:"Pretraining produces a document completer with no concept of helping you. Fine-tuning turns it into an assistant — helpful, honest, harmless — and leaves the four fingerprints."},

  /* Module 2 */
  {c:"m2",t:"Claude 101",q:"What guides Claude's behaviour at the training level?",a:"Constitutional AI — trained against principles to avoid toxic or discriminatory output, refuse harmful help, and be safe, beneficial and transparent. Aims: helpful, harmless, honest."},
  {c:"m2",t:"Claude 101",q:"What are Claude's context window sizes?",a:"200K+ tokens (roughly 500 pages), rising to up to 1M tokens on Pro, Max, Team and Enterprise with supported models."},
  {c:"m2",t:"Claude 101",q:"Thinking versus Learning mode.",a:"Thinking reasons step by step before answering. Learning mode guides your reasoning instead of giving the answer."},
  {c:"m2",t:"Surfaces",q:"Name the seven Claude surfaces.",a:"Claude.ai, Claude Code, Claude Cowork, Claude Tag, Claude Design, Claude for Microsoft 365, Claude in Chrome."},
  {c:"m2",t:"Surfaces",q:"Claude in Chrome: what are the plan defaults?",a:"On by default for Pro, Max and Team; off by default on Enterprise until an admin enables it; not available on Free."},
  {c:"m2",t:"Surfaces",q:"Claude for Microsoft 365: what is different about Outlook?",a:"It is a separate beta, installed separately from the Excel, PowerPoint and Word add-ins."},
  {c:"m2",t:"Projects",q:"What does a Project contain?",a:"Its own memory, chat history, knowledge base and instructions — a self-contained workspace for ongoing work."},
  {c:"m2",t:"Projects",q:"Does Claude see the project description?",a:"No. The description is for humans. Claude follows the instructions field — a commonly tested distinction."},
  {c:"m2",t:"Projects",q:"What happens at the Project knowledge limit?",a:"Claude switches to searching project knowledge (RAG), retrieving relevant chunks, giving up to 10x capacity with a visual indicator."},
  {c:"m2",t:"Artifacts",q:"Where do artifacts live on paid versus free plans?",a:"Paid: saved in the Artifacts tab, independent of the chat. Free: they stay with the conversation."},
  {c:"m2",t:"Artifacts",q:"Artifact versus file creation.",a:"An artifact opens and updates inside Claude and is shared by link. File creation produces a downloadable Word, Excel, PowerPoint or PDF."},
  {c:"m2",t:"Artifacts",q:"What are the plan defaults for Design, Slides and Docs?",a:"On by default for Pro/Max/Team; off by default on Enterprise until an admin enables them; beta, paid plans only."},
  {c:"m2",t:"Skills",q:"What is a Skill, and what does it need switched on?",a:"A folder of instructions, scripts and resources loaded dynamically when a task matches. It requires code execution and file creation to be enabled."},
  {c:"m2",t:"Skills",q:"Projects versus Skills.",a:"Projects store knowledge — the what. Skills perform tasks — the how. Knowledge is available in every chat of the project; Skill instructions apply when invoked."},
  {c:"m2",t:"Connectors",q:"What is MCP?",a:"Model Context Protocol — the open standard behind connectors, described as USB-C for AI: one socket for many tools."},
  {c:"m2",t:"Connectors",q:"Web connector versus desktop extension.",a:"Web connectors reach cloud services (Drive, Notion, Slack). Desktop extensions reach local files and native apps, installed via the desktop app."},
  {c:"m2",t:"Enterprise Search",q:"What connectors does Enterprise Search require?",a:"One Documents connector (Drive or SharePoint) and one Chat connector (Slack or Teams). Email is recommended but optional."},
  {c:"m2",t:"Research",q:"What does Research require to function?",a:"Web search must be enabled. Research is agentic and multi-source, takes minutes, and cites every claim."},
  {c:"m2",t:"Research",q:"Research vs web search vs Thinking vs Enterprise Search.",a:"Research: comprehensive cited reports. Web search: a quick fact. Thinking: reasoning with no external info needed. Enterprise Search: internal org knowledge."},

  /* Module 3 */
  {c:"m3",t:"Foundations",q:"Name the four decisions made before the first prompt.",a:"Entry point, capability layer, model, and context management. Together they set the quality ceiling of the session."},
  {c:"m3",t:"Foundations",q:"What are the five behavioural properties that apply everywhere?",a:"Responses vary; confident tone is not accuracy; context is a budget; knowledge has a cutoff; configured procedures still vary."},
  {c:"m3",t:"Foundations",q:"State the official Project test.",a:"Does the task recur? Is the background stable? Is the output format consistent? Yes to 2 or more → build the Project. Pays back in 2–3 sessions."},
  {c:"m3",t:"Foundations",q:"Do chats inside one Project share context with each other?",a:"No. They share the instructions and knowledge base, but each chat has its own context."},
  {c:"m3",t:"Layers",q:"Name the official four capability layers.",a:"Projects (context), Skills (procedure), Code Execution (verified computation), Memory (continuity). Skills live at account level, not inside a Project."},
  {c:"m3",t:"Layers",q:"Where do Skills live?",a:"At account level, not inside a Project. Claude invokes them automatically in any chat, inside or outside a Project."},
  {c:"m3",t:"Context",q:"What are the three responses to a full or degraded context?",a:"Restart (new chat; project instructions and knowledge carry over), Summarise (state summary into the new chat), Persist (save to Memory or the knowledge base)."},
  {c:"m3",t:"Context",q:"Two moves that do not fix context exhaustion.",a:"Repeating the instruction, and switching to a more capable model. Both extend or dress up a degraded session."},
  {c:"m3",t:"Memory",q:"How do you keep Client A out of Client B sessions?",a:"Separate Projects with Project-scoped memory. Incognito works only outside Projects and destroys useful continuity."},
  {c:"m3",t:"Memory",q:"How often should memory be reviewed, and why?",a:"At least monthly for active users. Accuracy beats volume, and stale memory is actively misleading."},
  {c:"m3",t:"Models",q:"Haiku, Sonnet, Opus — one line each.",a:"Haiku: fastest and most efficient, for structured high-volume work. Sonnet: balanced, the default for most professional work. Opus: highest capability, for nuance and ambiguity; slower."},
  {c:"m3",t:"Models",q:"What is the model selection rule?",a:"Start with Sonnet. Upgrade to Opus when a genuinely complex task falls short on quality. Drop to Haiku when speed and volume dominate and the task is structured."},

  /* Module 6 */
  {c:"m6",t:"Cowork",q:"Define Cowork in one line.",a:"Delegating whole tasks: you describe an outcome, and Claude plans, executes and delivers — multi-step, spanning tools, ending in a real file."},
  {c:"m6",t:"Cowork",q:"Chat vs Cowork vs Code.",a:"Chat is thinking with Claude, turn by turn, you stitch the steps. Cowork is delegating to Claude, many tools, one plan. Code is building software."},
  {c:"m6",t:"Cowork",q:"What does picking a working folder grant, and how should it be scoped?",a:"Read and write access — open, edit, create, organise. Scope it to one project; never point it at Documents, Downloads or Desktop."},
  {c:"m6",t:"Cowork",q:"Two Cowork permission modes, and the prompt that always appears.",a:"Ask before acting (default) pauses before actions that touch the outside world. Act without asking does not. Permanent deletion always asks, in both modes."},
  {c:"m6",t:"Cowork",q:"What three things must a good Cowork prompt name?",a:"The deliverable (format, length), the inputs (folders, channels, date range), and the specifics from your expertise."},
  {c:"m6",t:"Cowork",q:"What do clarifying questions represent?",a:"Claude closing context gaps before starting. They are the hand-off working, not friction."},
  {c:"m6",t:"Cowork",q:"Where do scheduled tasks run?",a:"Connector-only tasks run remotely, even if the computer is off. Tasks needing local files or apps run locally and need the desktop app open."},
  {c:"m6",t:"Cowork",q:"Can a scheduled task move between remote and local?",a:"No. A task stays where it started; to change where it runs, start a new one."},
  {c:"m6",t:"Cowork",q:"Name the four skill file types.",a:"Instructions (SKILL.md — the runbook), assets (logos, templates, fonts), references (examples of good output, style guides), scripts (code for steps that must run identically)."},
  {c:"m6",t:"Cowork",q:"Skill versus plugin.",a:"A Skill is one playbook. A plugin packages skills plus the connectors and subagents they depend on, built around a job."},
  {c:"m6",t:"Cowork",q:"Three plugin publish options.",a:"Available (optional install), Installed by default (users can turn it off), Required (stays on — compliance use)."},
  {c:"m6",t:"Cowork",q:"What is the eval baseline, and what is the ship bar?",a:"The baseline is the same prompt answered without the skill. Ship when the cases you care about pass meaningfully better, with the unhandled cases named."},
  {c:"m6",t:"Cowork",q:"What can Claude in Chrome not do?",a:"Sign in for you. You authenticate once and it works inside your session. It also asks before sensitive actions."},
  {c:"m6",t:"Cowork",q:"Name the three times Cowork is the wrong tool.",a:"Regulated workflows needing an audit trail (Cowork is not in audit logs; Compliance API is Enterprise beta), work you would not trust a smart colleague to do unsupervised, and highly sensitive personal data outside IT-approved boundaries."},
  {"c":"m3","t":"Foundations","q":"Which layer does each job: context, procedure, computation, continuity?","a":"Context → Projects. Procedure → Skills. Computation → Code Execution. Continuity → Memory."},
  {"c":"m3","t":"Foundations","q":"What does 'verified' mean in code execution?","a":"That the code ran — nothing more. The logic and the input data still need human checks."},
  {"c":"m3","t":"Foundations","q":"What must never be stored in memory?","a":"Confidential client data, personal data and passwords. Good uses: your role, preferred styles, people you work with, standard rules."},
  {"c":"m3","t":"Foundations","q":"Is an Artifact a starting point?","a":"No. It is an output panel inside Chat or a Project — the shape of the deliverable, not a workspace."},
  {"c":"m3","t":"Foundations","q":"What happens to early messages in a very long claude.ai conversation?","a":"Near the limit they are auto-summarised (official). Detail is compressed, so early instructions can lose force. That is not Claude ignoring you."}
  ];

  var glossary = [
    {t:"4D Framework", d:"AI Fluency competencies: Delegation, Description, Discernment, Diligence (Dakan & Feller). They operate simultaneously."},
    {t:"Act without asking", d:"Cowork mode with no pause before send, post or share. Permanent deletion still asks."},
    {t:"Agreeable bad premises", d:"Knowledge + Steerability failure where Claude adopts your wrong framing. Fix: invite pushback."},
    {t:"Artifact", d:"A standalone output (document, deck, design, dashboard, code) in its own window; saved in the Artifacts tab on paid plans."},
    {t:"Ask before acting", d:"The default Cowork permission mode: pauses before actions that touch the outside world."},
    {t:"Auto-summarization (compaction)", d:"Older messages condensed near the context limit, on paid plans with code execution. Detail compresses, so early instructions lose force."},
    {t:"Baseline (eval)", d:"The same prompt answered without the skill, used as the comparison point."},
    {t:"Best-of-N", d:"Running the same request several times and comparing. Disagreement between runs marks soft spots."},
    {t:"Calibrated trust", d:"Trust matched to where a task sits on each of the four property continua."},
    {t:"Capability hallucination", d:"Claude claims an action it did not or could not take — 'I emailed it' — with no tool connected."},
    {t:"Capability layer", d:"Projects (context), Skills (procedure), Code Execution (computation), Memory (continuity)."},
    {t:"Code execution", d:"A sandboxed environment where Claude writes and runs code. Gives verified numbers, charts and real files."},
    {t:"Compliance API", d:"Returns Cowork transcripts for audit; Enterprise only, in beta."},
    {t:"Confabulation", d:"Filling a gap with plausible material instead of flagging that the information is missing."},
    {t:"Configuration drift", d:"Instructions, knowledge, Skills or Memory going stale silently, degrading quality over time."},
    {t:"Connector", d:"An MCP-based link to an app — web connector or desktop extension. Claude sees only what you can see."},
    {t:"Constitutional AI", d:"Training Claude against principles to be safe, helpful, honest and transparent."},
    {t:"Context engineering", d:"Deciding what to include in context, where to place it, and what to leave out."},
    {t:"Context window", d:"Fixed-size working memory: 200K+ tokens (~500 pages), up to 1M on paid plans."},
    {t:"Context-poisoned generation", d:"NTP + Working Memory failure where fluent output builds on bad context."},
    {t:"Cosine similarity", d:"Closeness of two vectors by direction: -1 opposite, 0 unrelated, 1 identical."},
    {t:"Cowork", d:"Handing off whole multi-step tasks: Claude plans, executes and delivers a real file."},
    {t:"Desktop extension", d:"A local connector installed through the desktop app (Settings > Extensions)."},
    {t:"Document completer", d:"What pretraining alone produces: text continuation with no concept of helping you."},
    {t:"Edge case", d:"An unusual-but-real input where a skill tends to stumble; the target of an eval."},
    {t:"Embedding", d:"Text turned into a fixed-length vector so meaning becomes position."},
    {t:"Enterprise Search", d:"The 'Ask {Org}' project for org-wide knowledge. Team/Enterprise; requires a Documents and a Chat connector."},
    {t:"Entry point", d:"Chat, Project, Artifact or Research — chosen before the prompt."},
    {t:"Eval", d:"A try-out of a prompt or skill against real examples: 5–10 cases, or with-skill versus baseline."},
    {t:"Global instructions", d:"A standing brief in Settings applied to every session — every chat and every scheduled task."},
    {t:"Haiku", d:"The fastest, most efficient model tier: structured, high-volume work."},
    {t:"Halo delegation", d:"Delegating the next step because the previous one went well. Prevented by applying the criteria to every step."},
    {t:"Incognito mode", d:"Keeps a chat out of history and Memory. Standalone chats only; does not override organisational retention."},
    {t:"Inherited bias", d:"Defaults that reflect blind spots in the training data."},
    {t:"Knowledge base", d:"A Project's uploaded reference files — facts, not behavioural instructions."},
    {t:"Knowledge cutoff", d:"The date the training data ends. Everything after it is invisible to the model."},
    {t:"Letter over spirit", d:"An instruction met literally while the intent is missed. Fix: restate the goal."},
    {t:"Long-conversation drift", d:"Working Memory + Steerability failure where early constraints fade and the latest instructions win."},
    {t:"Loose confidence calibration", d:"A fine-tuning fingerprint: stated confidence does not track actual reliability."},
    {t:"Lost in the middle", d:"Mid-context information gets less attention — a 30%+ accuracy drop when the key fact sits in the middle."},
    {t:"MCP", d:"Model Context Protocol — the open standard behind connectors, 'USB-C for AI'."},
    {t:"Memory", d:"Saved context across sessions. Review monthly; it is project-scoped and user-editable."},
    {t:"Next Token Prediction", d:"Generating text one token at a time from what tends to follow — sophisticated autocomplete."},
    {t:"Opus", d:"The most capable of the exam's three tiers: nuance, ambiguity, high stakes; slower."},
    {t:"Over-caution", d:"A fine-tuning fingerprint: hedging or declining more than the risk warrants."},
    {t:"Plugin", d:"A bundle of skills plus the connectors and subagents they depend on, built around a job."},
    {t:"Pretraining", d:"The first stage: learning to predict the next token from vast text."},
    {t:"Primacy–recency effect", d:"Start and end are remembered, the middle is lost — the same U-curve appears in long-context accuracy."},
    {t:"Private marketplace", d:"An organisation's catalog for plugins: Available, Installed by default, or Required."},
    {t:"Project", d:"A workspace with standing instructions, a knowledge base and its own chat history. Chats do not share context with each other."},
    {t:"Project-scoped memory", d:"Memory isolated per Project, so one client never surfaces in another."},
    {t:"Prompt injection", d:"Instructions hidden in a document or web page being followed as if they were commands."},
    {t:"RAG", d:"Retrieval-augmented generation: fetch relevant chunks into context. How Projects scale to roughly 10x."},
    {t:"Reasoning drift", d:"Small errors compounding over a long chain of reasoning."},
    {t:"Research", d:"Agentic, multi-source investigation with citations. Paid; requires web search to be on."},
    {t:"Restart / Summarize / Persist", d:"The three responses to context degradation."},
    {t:"Sampling", d:"Picking the next token from a probability distribution — the source of run-to-run variation."},
    {t:"Scheduled task", d:"A recurring Cowork run via /schedule: hourly, daily, weekdays or manual."},
    {t:"Skill", d:"A folder of instructions (SKILL.md), assets, references and scripts. Account-level and auto-invoked."},
    {t:"skill-creator", d:"The built-in helper that drafts skills and runs with-skill versus baseline evaluations."},
    {t:"Sonnet", d:"The balanced model tier and the default starting point for most professional work."},
    {t:"Source amnesia", d:"The model cannot attribute where a piece of knowledge came from."},
    {t:"Steerability", d:"How well Claude follows instructions — achieved through pattern-matching, which bounds it."},
    {t:"Subagent", d:"A helper that handles one part of a job in its own context."},
    {t:"Sycophancy", d:"The pull to agree with you or validate your framing. Counter: invite disagreement."},
    {t:"Temperature", d:"The sampling knob for randomness: low is focused, high is varied."},
    {t:"Thinking", d:"A mode where Claude reasons step by step before answering."},
    {t:"Top-k / Top-p", d:"Keep the k most likely candidates / keep the smallest set whose probability mass sums to p."},
    {t:"Trust check (skills)", d:"Source, reach, appropriateness → enable, escalate or decline."},
    {t:"Verbosity", d:"A fine-tuning fingerprint: defaulting to long answers."},
    {t:"Web search", d:"A per-chat toggle for current facts. All plans; on Team/Enterprise an Owner enables it for the workspace first."},
    {t:"Working memory", d:"What the model attends to now — the context window. Fails as a cliff, not a slope."}
  ];

  window.CA.quiz = (window.CA.quiz || []).concat(quiz);
  window.CA.cards = (window.CA.cards || []).concat(cards);

  var have = new Set((window.CA.glossary || []).map(function (g) { return g.t.toLowerCase(); }));
  window.CA.glossary = (window.CA.glossary || []).concat(
    glossary.filter(function (g) { return !have.has(g.t.toLowerCase()); })
  );

  window.CA.blueprint = [
    { d: "Output Evaluation", w: 21, m: ["3", "9"], note: "Discernment, grounding, hallucination detection, triage verdicts" },
    { d: "Workflow Integration", w: 16, m: ["4", "11"], note: "Requirements, delegation mapping, Cowork hand-off, escalation" },
    { d: "Governance", w: 15, m: ["6"], note: "Use-case classification, Skill trust, data tiers, escalation" },
    { d: "Prompting", w: 14, m: ["2", "9"], note: "Five components, decomposition, iteration, task-type fit" },
    { d: "Product & Model Selection", w: 12, m: ["1", "10"], note: "Surfaces, entry points, model tiers, feature defaults" },
    { d: "Configuration & Knowledge", w: 12, m: ["5", "1"], note: "Instructions, knowledge, Skills, memory, drift" },
    { d: "Troubleshooting", w: 10, m: ["7", "9"], note: "Five failure patterns, diagnostic order, optimisation" }
  ];
})();

</script>
<script src="official.js"></script>
<script>
/* ==== app-core.js ==== */
/* ============================================================
   Claude Associate Academy — core shell, routing, study views
   ============================================================ */
const CA = window.CA;
const COURSES = CA.courses.slice().sort((a, b) => a.num - b.num);
const ALL_LESSONS = COURSES.flatMap(c => c.lessons.map(l => Object.assign({}, l, { courseId: c.id, courseNum: c.num, courseTitle: c.title })));
const LESSON_BY_ID = Object.fromEntries(ALL_LESSONS.map(l => [l.id, l]));
const COURSE_BY_ID = Object.fromEntries(COURSES.map(c => [c.id, c]));
const TOTAL_LESSONS = ALL_LESSONS.length;

const LS_KEY = "ca_academy_v1";

const state = Object.assign({
  studied: {},
  cards: {},
  quiz: { right: 0, total: 0, byCourse: {} },
  theme: "dark",
  history: []
}, loadState());

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}

/* ephemeral ui state */
const ui = {
  fc: { course: "all", queue: [], idx: 0, flipped: false, showAll: false, stats: { known: 0, again: 0 } },
  quiz: null,
  exam: null,
  lab: { tool: "prompt", steps: [], lastPrompt: null },
  searchOpen: false, searchSel: 0, searchResults: []
};

/* ---------------- helpers ---------------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const stripHTML = html => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent || ""; };

function icons() { return window.CA_ICONS; }

function courseLessons(c) { return c.lessons; }
function courseDone(c) { return c.lessons.filter(l => state.studied[l.id]).length; }
function coursePct(c) { return c.lessons.length ? Math.round((courseDone(c) / c.lessons.length) * 100) : 0; }
function studiedCount() { return ALL_LESSONS.filter(l => state.studied[l.id]).length; }
function studiedPct() { return Math.round((studiedCount() / TOTAL_LESSONS) * 100); }

function cardStats() {
  const total = CA.cards.length;
  const known = CA.cards.filter((_, i) => state.cards["k" + i] === "known").length;
  return { total, known, pct: total ? Math.round((known / total) * 100) : 0 };
}

function readiness() {
  const s = studiedPct();
  const c = cardStats().pct;
  const q = state.quiz.total ? Math.round((state.quiz.right / state.quiz.total) * 100) : 0;
  const score = Math.round(s * 0.45 + c * 0.25 + q * 0.30);
  return { score, s, c, q, answered: state.quiz.total };
}

function readinessLabel(n) {
  if (n >= 85) return { t: "Exam ready", c: "var(--teal)" };
  if (n >= 65) return { t: "On track", c: "var(--gold)" };
  if (n >= 35) return { t: "Building", c: "var(--accent)" };
  return { t: "Just starting", c: "var(--muted)" };
}

function toast(msg, kind) {
  const wrap = $("#toastWrap");
  const t = document.createElement("div");
  t.className = "toast " + (kind || "");
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transform = "translateY(8px)"; t.style.transition = "all .3s"; }, 1900);
  setTimeout(() => t.remove(), 2300);
}

function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.theme);
  const b = $("#themeBtn");
  if (b) b.innerHTML = state.theme === "dark" ? icons().sun : icons().moon;
}

/* ---------------- router ---------------- */
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  if (!parts.length) return { name: "dashboard" };
  return { name: parts[0], id: parts[1] };
}

function go(path) { location.hash = path; }

function render() {
  const r = parseRoute();
  if (r.name !== "exam" && ui.exam && !ui.exam.done && ui.exam.timerId) {
    clearInterval(ui.exam.timerId);
    ui.exam.timerId = null;
  }
  let html = "";
  switch (r.name) {
    case "dashboard": html = viewDashboard(); break;
    case "course": html = viewCourse(r.id); break;
    case "lesson": html = viewLesson(r.id); break;
    case "flashcards": html = viewFlashcards(); break;
    case "quiz": html = viewQuiz(); break;
    case "exam": html = viewExam(); break;
    case "lab": html = viewLab(); break;
    case "cheatsheet": html = viewCheatSheet(); break;
    case "glossary": html = viewGlossary(); break;
    case "facts": html = viewFacts(); break;
    default: html = viewDashboard();
  }
  const v = $("#view");
  v.innerHTML = '<div class="view-inner' + (r.name === "dashboard" || r.name === "lab" || r.name === "cheatsheet" ? " view-wide" : "") + '">' + html + "</div>";
  v.scrollTop = 0;
  renderChrome(r);
  afterRender(r);
}

function renderChrome(r) {
  // sidebar active states
  $$(".nav-item[data-route]").forEach(n => n.classList.toggle("active", n.dataset.route === "#/" + (r.name === "dashboard" ? "" : r.name)));
  $$(".nav-course").forEach(n => n.classList.toggle("active", r.id === n.dataset.course));
  $$(".nav-lesson").forEach(n => n.classList.toggle("active", r.id === n.dataset.lesson));
  $$(".nav-lesson").forEach(n => {
    const lid = n.dataset.lesson;
    n.classList.toggle("done", !!state.studied[lid]);
  });

  // breadcrumb
  let crumb = "";
  if (r.name === "dashboard") crumb = "<strong>Dashboard</strong>";
  else if (r.name === "course") { const c = COURSE_BY_ID[r.id]; crumb = "<span>Courses</span><span class='sep'>/</span><strong>" + (c ? "Course " + c.num : "Course") + "</strong>"; }
  else if (r.name === "lesson") { const l = LESSON_BY_ID[r.id]; crumb = (l ? "<span>Course " + l.courseNum + "</span><span class='sep'>/</span><strong>" + esc(l.title) + "</strong>" : "<strong>Lesson</strong>"); }
  else { const labels = { flashcards: "Flashcards", quiz: "Practice quiz", exam: "Mock exam", lab: "Diagnostic lab", cheatsheet: "Cheat sheet", glossary: "Glossary", facts: "Exam blueprint" }; crumb = "<strong>" + (labels[r.name] || "Dashboard") + "</strong>"; }
  $("#crumb").innerHTML = crumb;

  // progress ring
  const p = studiedPct();
  const C = 2 * Math.PI * 9;
  const fg = $("#ringFg");
  if (fg) { fg.style.strokeDasharray = C; fg.style.strokeDashoffset = C - (C * p) / 100; }
  const pctEl = $("#ringPct"); if (pctEl) pctEl.textContent = p + "%";

  // streak / studied footer
  const foot = $("#sideFootVal");
  if (foot) foot.textContent = studiedCount() + " / " + TOTAL_LESSONS;

  // keep the active module expanded in the sidebar
  const activeCourse = r.name === "lesson" && LESSON_BY_ID[r.id] ? LESSON_BY_ID[r.id].courseId
    : r.name === "course" ? r.id : null;
  if (activeCourse) {
    const group = document.querySelector('.nav-course[data-course="' + activeCourse + '"]');
    if (group) group.classList.add("open");
    const active = document.querySelector(".nav-course.active");
    if (active && active.scrollIntoView) active.scrollIntoView({ block: "nearest" });
  }
}

/* ---------------- sidebar ---------------- */
function buildSidebar() {
  const nav = $("#sideNav");
  let html = "";
  html += `<div class="nav-group-label">Study</div>`;
  html += `<a class="nav-item" data-route="#/" data-go="#/">${icons().grid}<span>Dashboard</span></a>`;
  html += `<a class="nav-item" data-route="#/lab" data-go="#/lab">${icons().compass}<span>Diagnostic lab</span><span class="nav-count">6</span></a>`;
  html += `<div class="nav-group-label">Curriculum</div>`;
  COURSES.forEach(c => {
    const done = courseDone(c), n = c.lessons.length;
    html += `<div class="nav-course" data-course="${c.id}">
      <button class="nav-course-btn" data-toggle-course="${c.id}">
        <span class="nav-num">${c.num}</span>
        <span class="nav-course-title">${esc(c.title)}</span>
        <span class="nav-count mono">${done}/${n}</span>
        ${icons().caret}
      </button>
      <div class="nav-lessons">

function renderBlock(b) {
  switch (b.t) {
    case "p": return `<p>${b.html}</p>`;
    case "h": return `<h3>${b.html}</h3>`;
    case "ul": return `<ul class="clean">${b.items.map(i => `<li>${i}</li>`).join("")}</ul>`;
    case "ol": return `<ol class="clean">${b.items.map(i => `<li>${i}</li>`).join("")}</ol>`;
    case "table": return `<div class="table-wrap"><table><thead><tr>${b.head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${
      b.rows.map(r => `<tr>${r.map(cell => `<td>${cell}</td>`).join("")}</tr>`).join("")
    }</tbody></table></div>`;
    case "callout": return `<div class="callout co-${b.variant}"><div class="co-title">${calloutIcon(b.variant)} ${b.title}</div><div>${b.body}</div></div>`;
    case "compare": return `<div class="compare"><div class="weak"><div class="ct">✕ Weak</div><p>${b.weak}</p></div><div class="strong"><div class="ct">✓ Strong</div><p>${b.strong}</p></div></div>`;
    case "timeline": return `<div class="timeline">${b.items.map(([t, d]) => `<div class="tl-item"><h4>${t}</h4><p>${d}</p></div>`).join("")}</div>`;
    default: return "";
  }
}
function calloutIcon(v) {
  return { exam: "◆", principle: "◈", tip: "✦", warn: "▲", official: "★", fix: "✎" }[v] || "•";
}
function officialBlocks(id) { return (CA.official && CA.official[id]) || []; }

/* ============================================================
   FLASHCARDS
   ============================================================ */
function fcPool() {
  const all = CA.cards.map((c, i) => Object.assign({}, c, { _id: "k" + i }));
  return ui.fc.course === "all" ? all : all.filter(c => c.c === ui.fc.course);
}
function fcRebuild(shuffle) {
  let pool = fcPool();
  if (!ui.fc.showAll) pool = pool.filter(c => state.cards[c._id] !== "known");
  if (!pool.length) pool = fcPool();
  if (shuffle) pool = pool.slice().sort(() => Math.random() - 0.5);
  ui.fc.queue = pool;
  ui.fc.idx = 0;
  ui.fc.flipped = false;
}

function viewFlashcards() {
  if (!ui.fc.queue.length) fcRebuild(true);
  const q = ui.fc.queue;
  const card = q[Math.min(ui.fc.idx, q.length - 1)];
  if (!card) return emptyState("No cards in this deck", "Try another course filter.");
  const known = state.cards[card._id] === "known";
  const st = cardStats();

  return `
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap">
    <div>
      <div class="eyebrow">Spaced practice</div>
      <h1 style="font-size:34px">Flashcards</h1>
    </div>
    <div class="badge-row">
      <span class="pill teal">${st.known} known</span>
      <span class="pill">${st.total} total</span>
      <span class="pill">${st.pct}%</span>
    </div>
  </div>

  <div class="seg" style="margin:22px 0 26px">
    <button class="${ui.fc.course === "all" ? "on" : ""}" data-act="fcCourse" data-id="all">All courses</button>
    ${COURSES.map(c => `<button class="${ui.fc.course === c.id ? "on" : ""}" data-act="fcCourse" data-id="${c.id}">C${c.num}</button>`).join("")}
    <button class="${ui.fc.showAll ? "on" : ""}" data-act="fcToggleAll" style="margin-left:auto">${ui.fc.showAll ? "Showing all" : "Unseen only"}</button>
  </div>

  <div class="fc-stage">
    <div class="fc-progress">
      <div class="bar"><i style="width:${q.length ? ((ui.fc.idx + 1) / q.length) * 100 : 0}%"></i></div>
      <span class="txt">${ui.fc.idx + 1} / ${q.length}</span>
    </div>

    <div class="flashcard ${ui.fc.flipped ? "flipped" : ""}" data-act="fcFlip" role="button" tabindex="0" aria-label="Flashcard, click to flip">
      <div class="fc-inner">
        <div class="fc-face">
          <div class="fc-tag">C${COURSE_BY_ID[card.c] ? COURSE_BY_ID[card.c].num : "?"} · ${esc(card.t)}</div>
          <div class="fc-q">${esc(card.q)}</div>
          <div class="fc-hint">Click or press Space to reveal</div>
        </div>
        <div class="fc-face back">
          <div class="fc-tag">Answer</div>
          <div class="fc-a">${esc(card.a)}</div>
          <div class="fc-hint">1 = again · 2 = got it · Space = flip</div>
        </div>
      </div>
    </div>

    <div class="fc-controls">
      <button class="btn" data-act="fcRate" data-id="again">Again<small>see it sooner</small></button>
      <button class="btn btn-primary" data-act="fcRate" data-id="known" ${known ? "" : ""}>Got it<small>mark as known</small></button>
    </div>
    <div class="small dim" style="display:flex;gap:14px">
      <span>${known ? "✓ Currently marked known" : "Not yet marked"}</span>
      <span>·</span>
      <span>${esc(COURSE_BY_ID[card.c] ? COURSE_BY_ID[card.c].title : "")}</span>
    </div>
  </div>`;
}

function rateCard(rating) {
  const card = ui.fc.queue[ui.fc.idx];
  if (!card) return;
  state.cards[card._id] = rating;
  saveState();
  if (rating === "known") ui.fc.stats.known++; else ui.fc.stats.again++;
  ui.fc.flipped = false;
  if (ui.fc.idx < ui.fc.queue.length - 1) ui.fc.idx++;
  else { fcRebuild(true); toast("Deck complete — new round", "good"); }
  render();
}
