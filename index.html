      <li><strong>Context</strong> = the component most often left out.</li>
      <li>First three = Who / What I know / What to do → without them: assumption → generic.</li>
      <li>Word counts are <strong>targets</strong>. Use ranges + structure.</li>
      <li>Few-shot = highest-impact single addition.</li>
      <li>Delimiters separate output from commentary.</li>
    </ul></div>

    <div class="cheat-box"><h4>Task-type tuning</h4><ul>
      <li>Analysis: tighten criteria/standards/scope.</li>
      <li>Research: tighten sources/citations/question.</li>
      <li>Drafting: tighten audience/tone/format.</li>
      <li>Brainstorm: tighten goal only.</li>
      <li><strong>Temperature = API only</strong>, not an app setting.</li>
    </ul></div>

    <div class="cheat-box"><h4>Evaluation — 3 references</h4><ul>
      <li>Requirements · source material · professional standards.</li>
      <li>Outcomes: ready / need revision / need human override.</li>
      <li>Completeness is a separate test from accuracy.</li>
      <li>Confidence ≠ accuracy. Fluency ≠ truth.</li>
    </ul></div>

    <div class="cheat-box"><h4>4 failure patterns</h4><ul>
      <li>Hallucination · inconsistency · bias · completeness.</li>
      <li>Numbered claim list exposes contradictions.</li>
      <li>Ask for the counter-case to defuse bias.</li>
      <li><strong>Capability hallucination</strong>: verify actions externally.</li>
    </ul></div>

    <div class="cheat-box"><h4>6 grounding techniques</h4><ul>
      <li>Allow “I don't know”.</li>
      <li>Restrict to provided sources.</li>
      <li>Require verifiable citations.</li>
      <li>Quote before analysing.</li>
      <li>Compare multiple responses.</li>
      <li>Verify against authoritative sources.</li>
      <li><strong>Citations = API feature</strong>; no app toggle.</li>
    </ul></div>

    <div class="cheat-box"><h4>4 risk thresholds</h4><ul>
      <li>Stakes · reversibility · audience · regulatory exposure.</li>
      <li>Never unvalidated: client deliverables, critical financials, regulated data, public statements, legal communications.</li>
      <li>Accountability stays with the approver.</li>
    </ul></div>

    <div class="cheat-box"><h4>Format reliability</h4><ul>
      <li>Inline (lower) → Artifact (medium) → structured (medium-high) → code execution (highest for numbers).</li>
      <li>Structured schema enforcement = API only.</li>
      <li>Code execution: sandbox, no internet, upload inputs.</li>
    </ul></div>

    <div class="cheat-box"><h4>Delegation — 3 criteria (official)</h4><ul>
      <li><strong>Reversibility · Stakes · Accountability.</strong> Accountability never delegates.</li>
      <li>Data sensitivity (Green/Yellow/Red) can still block a step on its own.</li>
      <li>Assignments: AI-appropriate / collaborative / human-retained.</li>
      <li>Failures: halo, fake collaboration, tool-first, over-delegation.</li>
    </ul></div>

    <div class="cheat-box"><h4>Configuration — 5 surfaces</h4><ul>
      <li>Instructions = behaviour (project precedence).</li>
      <li>Knowledge = facts (retrieved excerpts, not full load).</li>
      <li>Skills = procedures (account level, versioned, owned).</li>
      <li>Memory = continuity (scoped, editable; <strong>export as backup</strong> before big changes).</li>
      <li>Custom Skills update <strong>only on re-upload</strong>; Anthropic/org Skills auto-update.</li>
      <li>Connectors = external access (account/org, user permissions).</li>
    </ul></div>

    <div class="cheat-box"><h4>Maintenance</h4><ul>
      <li>Gradual decline → <strong>drift</strong>, not prompting.</li>
      <li>Cadence = change frequency + event triggers.</li>
      <li>Stale metric in instruction → silently wrong output.</li>
      <li>Check Skill currency before blaming the prompt.</li>
      <li>No secrets or regulated data in config.</li>
    </ul></div>

    <div class="cheat-box"><h4>Use-case classification</h4><ul>
      <li>Criteria: reversibility · consequence · human empathy · accountability.</li>
      <li>Human-element criterion can override all others.</li>
      <li>Fully appropriate / with human review / <strong>inappropriate</strong>.</li>
      <li>Inappropriate = decision cannot be delegated, full stop.</li>
      <li>Gate = who · what · when · evidence · rejection path.</li>
    </ul></div>

    <div class="cheat-box"><h4>Skill &amp; connector trust</h4><ul>
      <li><strong>Source · Reach · Appropriateness.</strong></li>
      <li>Reach = what it can see <em>and</em> what it can do.</li>
      <li>Least privilege; approved ≠ permanently safe.</li>
      <li>Prompt injection: content is data, never commands.</li>
      <li>Connectors = standing access = highest reach.</li>
    </ul></div>

    <div class="cheat-box"><h4>Data sensitivity</h4><ul>
      <li>Green / Yellow / Red — <strong>illustrative</strong>, map to org labels.</li>
      <li>Red = regulated · contractual · secrets.</li>
      <li>Credentials: absolute never-paste.</li>
      <li>Redaction test: can the person be re-identified?</li>
      <li>Sandbox protects the host, not the data.</li>
      <li>Incognito ≠ approved; retention still applies.</li>
    </ul></div>

    <div class="cheat-box"><h4>Ethics</h4><ul>
      <li>Bias · transparency · factual reliability · grey areas.</li>
      <li>Most frequent risk = factual unreliability.</li>
      <li>When in doubt, disclose.</li>
      <li>Document grey-area reasoning.</li>
    </ul></div>

    <div class="cheat-box"><h4>5 failure patterns + timing</h4><ul>
      <li>Under-specification → wrong from the first response.</li>
      <li>Context overload → starts strong, degrades (early content auto-summarised).</li>
      <li>Wrong feature → specific repeated error.</li>
      <li>Stale config → worked before, consistently worse now.</li>
      <li>Task-fit → impossible regardless of wording; reframe.</li>
    </ul></div>

    <div class="cheat-box"><h4>Diagnostic sequence (official, 5 steps)</h4><ul>
      <li>Prompt (5 components) → conversation length → feature/model → configuration → task fit <strong>last</strong>.</li>
      <li>Shallow on a speed tier = wrong model → move up.</li>
      <li>Extended thinking is the first lever for depth.</li>
      <li>Vague Skill description → Skill never fires.</li>
      <li>Read generated code; don't trust the printed number.</li>
    </ul></div>

    <div class="cheat-box"><h4>Feedback → configuration</h4><ul>
      <li>Reaction → specific action; test: could someone else apply it?</li>
      <li>Rule → instructions · reference → KB · procedure → Skill.</li>
      <li>Fix the same thing more than twice → promote it.</li>
      <li>Frictions: repetition · corrections · variability.</li>
    </ul></div>

    <div class="cheat-box"><h4>4 Ds &amp; lifecycle</h4><ul>
      <li><strong>Delegation · Description · Discernment · Diligence.</strong></li>
      <li>Simultaneous, not sequential.</li>
      <li>Lifecycle: capability → prompt → validate → integrate → configure → govern → optimise.</li>
      <li>Associate scope excludes developer work → escalate.</li>
    </ul></div>

    <div class="cheat-box"><h4>Four machine properties</h4><ul>
      <li><strong>NTP</strong> (where answers come from) · <strong>Knowledge</strong> (what it knows) · <strong>Working memory</strong> (what it attends to) · <strong>Steerability</strong> (how much control).</li>
      <li>Each is a continuum: capability ↔ limitation.</li>
      <li>Working memory is a <strong>cliff</strong>; the rest degrade gradually.</li>
      <li>Lost in the middle: 30%+ drop — instructions at start and end.</li>
      <li>Fabrication concentrates in specifics.</li>
    </ul></div>

    <div class="cheat-box"><h4>Fingerprints &amp; collisions</h4><ul>
      <li>Sycophancy · verbosity · over-caution · loose calibration.</li>
      <li>NTP + Knowledge → hallucinated citations.</li>
      <li>Working memory + Steerability → long-conversation drift.</li>
      <li>Knowledge + Steerability → agreeable bad premises.</li>
      <li>Letter over spirit → <strong>restate the goal</strong>.</li>
    </ul></div>

    <div class="cheat-box"><h4>Entry points &amp; models</h4><ul>
      <li>Chat · Project · Artifact · Research.</li>
      <li>Project test: <strong>2 of 3</strong> — recurs · stable context · consistent format.</li>
      <li>An Artifact is an output, not a starting point.</li>
      <li><strong>Haiku</strong> fast/structured · <strong>Sonnet</strong> default · <strong>Opus</strong> nuance.</li>
      <li>Layers: <strong>Projects</strong> (context) · <strong>Skills</strong> (procedure, account-level) · <strong>Code Execution</strong> (computation) · <strong>Memory</strong> (continuity).</li>
    </ul></div>

    <div class="cheat-box"><h4>Product defaults</h4><ul>
      <li>Chrome: on Pro/Max/Team · off Enterprise · none Free.</li>
      <li>Design/Slides/Docs: on Pro/Max/Team · off Enterprise.</li>
      <li>Skills need code execution + file creation.</li>
      <li>Enterprise Search: Documents <em>and</em> Chat (email optional).</li>
      <li>Research requires web search on.</li>
      <li>The project description is invisible to Claude.</li>
    </ul></div>

    <div class="cheat-box"><h4>Cowork</h4><ul>
      <li>Delegation, not chat: plan → execute → deliver a file.</li>
      <li>Folder = read <em>and</em> write; scope it to one project.</li>
      <li>Ask before acting is default; <strong>delete always asks</strong>.</li>
      <li>Schedules: connectors only → remote; local files → app open.</li>
      <li>No audit trail → not the right tool (Compliance API = Enterprise beta).</li>
      <li>Eval baseline = the same prompt without the skill.</li>
    </ul></div>

    <div class="cheat-box"><h4>Exam domains</h4><ul>
      <li>Output evaluation <strong>21%</strong>.</li>
      <li>Workflow integration 16% · Governance 15%.</li>
      <li>Prompting 14% · Product &amp; model 12%.</li>
      <li>Configuration 12% · Troubleshooting 10%.</li>
      <li>Guide revision due 17 Nov 2026; content updates 7 Dec 2026.</li>
    </ul></div>
  </div>

  <div class="site-foot"><span>Print-optimised. Dark UI is ignored in print.</span><span>Claude Associate Academy</span></div>`;
}

function emptyState(title, sub) {
  return `<div class="empty-state">${icons().search}<h2>${esc(title)}</h2><p>${esc(sub)}</p>
  <button class="btn" data-go="#/" style="margin-top:14px">Back to dashboard</button></div>`;
}

</script>
<script>
/* ==== app-views.js ==== */
/* ============================================================
   Quiz, exam, lab, search, boot
   ============================================================ */

/* ---------------- QUIZ ---------------- */
ui.quizCourse = "all";
ui.quizLen = 10;

function quizPool() {
  return ui.quizCourse === "all" ? CA.quiz : CA.quiz.filter(q => q.c === ui.quizCourse);
}

function viewQuiz() {
  if (!ui.quiz) {
    const n = quizPool().length;
    return `
    <div class="quiz-shell">
      <div class="eyebrow">Practice</div>
      <h1 style="margin-bottom:10px">Quiz</h1>
      <p class="lede">Scenario questions with a full explanation after every answer. Wrong answers are the useful ones — they tell you which distinction you haven't internalised.</p>

      <div class="card" style="margin-top:28px">
        <div class="field"><label>Module</label>
          <div class="seg" style="flex-wrap:wrap">
            <button class="${ui.quizCourse === "all" ? "on" : ""}" data-act="quizCourse" data-id="all">All (${CA.quiz.length})</button>
            ${COURSES.map(c => `<button class="${ui.quizCourse === c.id ? "on" : ""}" data-act="quizCourse" data-id="${c.id}">C${c.num} (${CA.quiz.filter(q => q.c === c.id).length})</button>`).join("")}
          </div>
        </div>
        <div class="field"><label>Length</label>
          <div class="seg">
            ${[5, 10, 20, 0].map(len => `<button class="${ui.quizLen === len ? "on" : ""}" data-act="quizLen" data-id="${len}">${len === 0 ? "Everything (" + n + ")" : len + " questions"}</button>`).join("")}
          </div>
        </div>
        <button class="btn btn-primary btn-lg btn-block" style="margin-top:8px" data-act="quizStart" ${n ? "" : "disabled"}>Start quiz ${icons().arrow}</button>
        ${n ? "" : `<p class="small dim" style="margin:10px 0 0">No questions for this module yet.</p>`}
      </div>

      <div class="grid g3" style="margin-top:20px">
        <div class="card tight"><div class="l small dim">Accuracy so far</div><div style="font-family:var(--font-serif);font-size:26px">${state.quiz.total ? Math.round((state.quiz.right / state.quiz.total) * 100) + "%" : "—"}</div></div>
        <div class="card tight"><div class="l small dim">Questions answered</div><div style="font-family:var(--font-serif);font-size:26px">${state.quiz.total}</div></div>
        <div class="card tight"><div class="l small dim">Bank size</div><div style="font-family:var(--font-serif);font-size:26px">${CA.quiz.length}</div></div>
      </div>
    </div>`;
  }

  if (ui.quiz.done) return quizResults();
  const q = ui.quiz.pool[ui.quiz.idx];
  const answered = ui.quiz.answers[ui.quiz.idx] != null;
  const chosen = ui.quiz.answers[ui.quiz.idx];
  const c = COURSE_BY_ID[q.c];

  return `
  <div class="quiz-shell">
    <div class="q-head">
      <span class="q-count">Question ${ui.quiz.idx + 1} of ${ui.quiz.pool.length}</span>
      <span class="pill">C${c.num} · ${esc(c.title)}</span>
    </div>
    <div class="bar" style="margin-bottom:24px"><i style="width:${((ui.quiz.idx + (answered ? 1 : 0)) / ui.quiz.pool.length) * 100}%"></i></div>

    <div class="q-text">${esc(q.q)}</div>
    <div class="options">
      ${q.opts.map((o, i) => {
        let cls = "opt";
        if (answered) {
          cls += " locked";
          if (i === q.a) cls += " correct";
          else if (i === chosen) cls += " wrong";
          else cls += " dim";
        }
        return `<button class="${cls}" ${answered ? "" : `data-act="quizAnswer" data-id="${i}"`}>
          <span class="key">${"ABCD"[i]}</span><span>${esc(o)}</span>
        </button>`;
      }).join("")}
    </div>

    ${answered ? `<div class="explain ${chosen === q.a ? "good" : "bad"}">
      <div class="ex-title">${chosen === q.a ? "✓ Correct" : "✕ Not quite"}</div>
      <div>${esc(q.why)}</div>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:18px" data-act="quizNext">${ui.quiz.idx === ui.quiz.pool.length - 1 ? "See results" : "Next question"} ${icons().arrow}</button>` : ""}
  </div>`;
}

function quizResults() {
  const { pool, answers } = ui.quiz;
  const right = pool.filter((q, i) => answers[i] === q.a).length;
  const pct = Math.round((right / pool.length) * 100);
  const missed = pool.map((q, i) => ({ q, i })).filter(({ q, i }) => answers[i] !== q.a);
  return `
  <div class="quiz-shell">
    <div class="result-hero">
      <div class="score-big" style="color:${pct >= 80 ? "var(--teal)" : pct >= 60 ? "var(--gold)" : "var(--rose)"}">${pct}%</div>
      <div class="score-sub">${right} of ${pool.length} correct</div>
      <div style="margin-top:14px"><span class="pill ${pct >= 80 ? "teal" : pct >= 60 ? "gold" : "rose"}">${pct >= 80 ? "Strong" : pct >= 60 ? "Close the gaps" : "Review the module"}</span></div>
    </div>

    ${missed.length ? `
    <div class="section-head"><h2 style="font-size:19px">What to revisit</h2></div>
    <div class="grid" style="gap:10px">
      ${missed.map(({ q, i }) => `<div class="card tight">
        <div class="small" style="color:var(--muted);margin-bottom:6px">C${COURSE_BY_ID[q.c].num} · ${esc(LESSON_BY_ID[q.l] ? LESSON_BY_ID[q.l].title : "")}</div>
        <div style="font-size:14.5px;margin-bottom:8px">${esc(q.q)}</div>
        <div class="small" style="color:var(--teal)">✓ ${esc(q.opts[q.a])}</div>
        <div class="small dim" style="margin-top:6px;line-height:1.55">${esc(q.why)}</div>
      </div>`).join("")}
    </div>` : `<div class="callout co-tip" style="margin-top:26px"><div class="co-title">✦ Clean sweep</div><div>Every answer correct. Move to a harder set — or take the mock exam under time.</div></div>`}

    <div class="lesson-nav" style="margin-top:26px">
      <button class="btn" data-act="quizRestart">${icons().refresh} New quiz</button>
      <button class="btn btn-primary" data-go="#/exam">${icons().clock} Mock exam</button>
    </div>
  </div>`;
}

/* Rotate options so the correct answer is not always in the same position.
   Balanced across the set: option positions cycle 0,1,2,3, so any four consecutive
   questions spread the answer evenly. Offset randomises the starting point per run. */
function presentQuestion(q, i, offset) {
  var rot = (i + offset) % 4;
  if (!rot) return q;
  var opts = q.opts.slice(rot).concat(q.opts.slice(0, rot));
  var a = (q.a - rot + 4) % 4;
  return Object.assign({}, q, { opts: opts, a: a });
}

function quizStart() {
  let pool = quizPool().slice();
  pool = pool.sort(() => Math.random() - 0.5);
  if (ui.quizLen && ui.quizLen < pool.length) pool = pool.slice(0, ui.quizLen);
  const offset = Math.floor(Math.random() * 4);
  pool = pool.map((q, i) => presentQuestion(q, i, offset));
  ui.quiz = { pool, idx: 0, answers: pool.map(() => null), done: false };
  render();
}

/* ---------------- EXAM ---------------- */
function examStart() {
  let pool = CA.quiz.slice().sort(() => Math.random() - 0.5).slice(0, Math.min(40, CA.quiz.length));
  const offset = Math.floor(Math.random() * 4);
  pool = pool.map((q, i) => presentQuestion(q, i, offset));
  ui.exam = {
    pool, idx: 0, answers: pool.map(() => null), flags: pool.map(() => false),
    done: false, end: Date.now() + 45 * 60 * 1000, timerId: null, started: Date.now()
  };
  startExamTimer();
  render();
}

function startExamTimer() {
  if (!ui.exam || ui.exam.done) return;
  clearInterval(ui.exam.timerId);
  ui.exam.timerId = setInterval(() => {
    if (!ui.exam || ui.exam.done) { clearInterval(ui.exam.timerId); return; }
    const left = Math.max(0, ui.exam.end - Date.now());
    const el = document.getElementById("examTimer");
    if (el) {
      el.textContent = fmtTime(left);
      el.className = "timer" + (left < 60000 ? " danger" : left < 300000 ? " warn" : "");
    }
    if (left <= 0) { clearInterval(ui.exam.timerId); submitExam(true); }
  }, 500);
}
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

function viewExam() {
  if (!ui.exam) {
    const mins = 45;
    return `
    <div class="quiz-shell" style="max-width:720px">
      <div class="eyebrow">Timed simulation</div>
      <h1 style="margin-bottom:10px">Mock exam</h1>
      <p class="lede">40 questions drawn from the full bank, ${mins} minutes, no explanations until you submit. This is the closest thing to the real sitting.</p>

      <div class="card" style="margin-top:26px">
        <div class="grid g3" style="gap:12px">
          <div><div class="small dim">Questions</div><div style="font-family:var(--font-serif);font-size:24px">40</div></div>
          <div><div class="small dim">Time limit</div><div style="font-family:var(--font-serif);font-size:24px">${mins} min</div></div>
          <div><div class="small dim">Practice target</div><div style="font-family:var(--font-serif);font-size:24px">80%</div></div>
        </div>
        <hr class="divider" style="margin:20px 0">
        <ul class="clean" style="margin:0">
          <li>You can flag questions and jump between them.</li>
          <li>Unanswered questions score zero — never leave a blank.</li>
          <li>Timer auto-submits at zero; nothing is lost.</li>
        </ul>
        <p class="small dim" style="margin:14px 0 0">The simulation's length and timings are this app's design, and 80% is a practice target — not the official pass mark, which is not in the source notes.</p>
        <button class="btn btn-primary btn-lg btn-block" style="margin-top:16px" data-act="examStart">${icons().play} Begin exam</button>
      </div>
      ${state.history.length ? `<div class="card tight" style="margin-top:16px">
        <div class="small dim" style="margin-bottom:8px">Previous attempts</div>
        ${state.history.slice(-3).reverse().map(h => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0">
          <span class="dim">${new Date(h.at).toLocaleDateString()} · ${h.time}</span>
          <span class="mono">${h.score}%</span>
        </div>`).join("")}
      </div>` : ""}
    </div>`;
  }

  if (ui.exam.done) return examResults();

  const q = ui.exam.pool[ui.exam.idx];
  const chosen = ui.exam.answers[ui.exam.idx];
  const left = Math.max(0, ui.exam.end - Date.now());

  return `
  <div class="quiz-shell" style="max-width:820px">
    <div class="exam-top">
      <span id="examTimer" class="timer ${left < 60000 ? "danger" : left < 300000 ? "warn" : ""}">${fmtTime(left)}</span>
      <div class="qdots">
        ${ui.exam.pool.map((_, i) => `<button class="qdot ${i === ui.exam.idx ? "cur" : ""} ${ui.exam.answers[i] != null ? "done" : ""} ${ui.exam.flags[i] ? "flag" : ""}" data-act="examGo" data-id="${i}" title="Question ${i + 1}">${i + 1}</button>`).join("")}
      </div>
      <button class="btn btn-sm btn-ghost" data-act="examSubmit">Submit</button>
    </div>

    <div class="q-head">
      <span class="q-count">Question ${ui.exam.idx + 1} of ${ui.exam.pool.length}</span>
      <button class="btn btn-sm btn-ghost" data-act="examFlag" data-id="${ui.exam.idx}">${ui.exam.flags[ui.exam.idx] ? "★ Flagged" : "☆ Flag"}</button>
    </div>

    <div class="q-text">${esc(q.q)}</div>
    <div class="options">
      ${q.opts.map((o, i) => `<button class="opt ${chosen === i ? "picked" : ""}" data-act="examAnswer" data-id="${i}">
        <span class="key">${"ABCD"[i]}</span><span>${esc(o)}</span>
      </button>`).join("")}
    </div>

    <div style="display:flex;gap:10px;margin-top:24px">
      <button class="btn" data-act="examPrev" ${ui.exam.idx === 0 ? "disabled" : ""}>← Previous</button>
      <div style="flex:1"></div>
      ${ui.exam.idx === ui.exam.pool.length - 1
        ? `<button class="btn btn-primary" data-act="examSubmit">Review &amp; submit ${icons().arrow}</button>`
        : `<button class="btn btn-primary" data-act="examNext">Next ${icons().arrow}</button>`}
    </div>
  </div>`;
}

function submitExam(auto) {
  if (!ui.exam || ui.exam.done) return;
  const blanks = ui.exam.answers.filter(a => a == null).length;
  if (!auto && blanks > 0) {
    const ok = confirm(`${blanks} question${blanks > 1 ? "s" : ""} left unanswered. Submit anyway?`);
    if (!ok) return;
  }
  ui.exam.done = true;
  clearInterval(ui.exam.timerId);
  const right = ui.exam.pool.filter((q, i) => ui.exam.answers[i] === q.a).length;
  const pct = Math.round((right / ui.exam.pool.length) * 100);
  const used = Date.now() - ui.exam.started;
  state.history.push({ at: Date.now(), score: pct, time: fmtTime(used) });
  state.quiz.right += right;
  state.quiz.total += ui.exam.pool.length;
  saveState();
  render();
}

function examResults() {
  const { pool, answers } = ui.exam;
  const right = pool.filter((q, i) => answers[i] === q.a).length;
  const pct = Math.round((right / pool.length) * 100);
  const byCourse = {};
  pool.forEach((q, i) => {
    byCourse[q.c] = byCourse[q.c] || { r: 0, t: 0 };
    byCourse[q.c].t++;
    if (answers[i] === q.a) byCourse[q.c].r++;
  });
  return `
  <div class="quiz-shell" style="max-width:820px">
    <div class="result-hero">
      <div class="eyebrow" style="justify-content:center">Result</div>
      <div class="score-big" style="color:${pct >= 80 ? "var(--teal)" : pct >= 65 ? "var(--gold)" : "var(--rose)"}">${pct}%</div>
      <div class="score-sub">${right} / ${pool.length} correct · ${pct >= 80 ? "above the practice pass line" : "below the practice pass line"}</div>
    </div>

    <div class="card" style="margin-top:24px">
      <h3 style="font-size:14px;font-family:var(--font-sans);letter-spacing:.4px;margin-bottom:14px">By module</h3>
      ${Object.keys(byCourse).sort().map(cid => {
        const b = byCourse[cid], pc = Math.round((b.r / b.t) * 100);
        return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
          <span class="small" style="width:150px;color:var(--text-dim)">C${COURSE_BY_ID[cid].num} ${esc(COURSE_BY_ID[cid].title.split(" ")[0])}</span>
          <div class="bar" style="height:5px"><i style="width:${pc}%;background:${pc >= 80 ? "var(--teal)" : pc >= 60 ? "var(--gold)" : "var(--rose)"}"></i></div>
          <span class="mono small" style="width:52px;text-align:right;color:var(--muted)">${b.r}/${b.t}</span>
        </div>`;
      }).join("")}
    </div>

    <div class="section-head"><h2 style="font-size:19px">Full review</h2><span class="small dim">Tap a question to expand</span></div>
    <div class="grid" style="gap:8px">
      ${pool.map((q, i) => {
        const ok = answers[i] === q.a;
        return `<details class="card tight" style="padding:0">
          <summary style="padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;list-style:none">
            <span style="color:${ok ? "var(--teal)" : "var(--rose)"};font-family:var(--font-mono);font-size:12px;flex:0 0 auto;margin-top:2px">${ok ? "✓" : "✕"}</span>
            <span style="flex:1;font-size:13.8px;color:var(--text-dim)">${esc(q.q)}</span>
            <span class="small mono" style="color:var(--faint)">${i + 1}</span>
          </summary>
          <div style="padding:0 16px 16px 40px">
            <div class="small" style="color:${ok ? "var(--teal)" : "var(--rose)"};margin-bottom:6px">Your answer: ${answers[i] == null ? "—" : esc(q.opts[answers[i]])}</div>
            ${ok ? "" : `<div class="small" style="color:var(--teal);margin-bottom:6px">Correct: ${esc(q.opts[q.a])}</div>`}
            <div class="small dim" style="line-height:1.6;margin-top:8px">${esc(q.why)}</div>
          </div>
        </details>`;
      }).join("")}
    </div>

    <div class="lesson-nav" style="margin-top:26px">
      <button class="btn" data-act="examRestart">${icons().refresh} Another attempt</button>
      <button class="btn btn-primary" data-go="#/dashboard">Back to dashboard</button>
    </div>
  </div>`;
}

function promptPreview() {
  const p = ui.labState.prompt;

function promptVerdict(filled, p) {
  const m = [];
  if (!p.role.trim()) m.push("role");
  if (!p.context.trim()) m.push("context");
  if (!p.format.trim()) m.push("format");
  if (filled === 6) return `<div class="v-label">Audit</div><div class="v-title" style="color:var(--teal)">Complete brief</div><div class="v-body">All six components are present. If the output still disappoints, the problem is probably not specification — check conversation length, feature choice and configuration.</div>`;
  return `<div class="v-label">Audit</div><div class="v-title" style="color:var(--gold)">${filled} of 6 components</div><div class="v-body">Most likely failure: <strong>${m.includes("context") ? "generic output from missing context" : m.includes("format") ? "rework from unspecified format" : "an assumed answer from a thin brief"}</strong>. Add ${m.slice(0, 2).join(" and ")} first — they carry the most leverage.</div>`;
}

/* ---- 3. delegation mapper ---- */
function classifyStep(f) {
  const reasons = [];
  if (f.cleared === "no") {
    return { v: "Blocked — data gate", cls: "v-bad", reasons: ["Data is not cleared for use with Claude. This is an independent gate: it blocks the step regardless of how low-risk everything else is."] };
  }
  if (f.stakes === "high" && f.reversible === "no") {
    return { v: "Human-retained", cls: "v-bad", reasons: ["High stakes and irreversible — the decision and the action stay with a person."] };
  }
  if (f.nature === "external" && f.reversible === "no") {
    return { v: "Human-retained", cls: "v-bad", reasons: ["An external, irreversible action (send, sign, publish). It cannot be unsent, so a person must own it."] };
  }
  if (f.stakes === "high" || f.accountability === "human" || f.nature === "external" || f.reversible === "no") {
    return { v: "Collaborative", cls: "v-warn", reasons: ["Claude can prepare the work, but a named person must review and approve before it moves forward."] };
  }
  return { v: "AI-appropriate", cls: "v-good", reasons: ["Low stakes, reversible, no external action, and the accountable person can verify the output cheaply."] };
}

/* ---- 4. surface router ---- */
const SURFACES = {
  instructions: { t: "Project instructions", d: "Behaviour applied to every conversation in the Project: tone, formatting, verification requirements, citation practice.", ex: "“Always cite the source for every factual claim.”" },
  kb: { t: "Knowledge base", d: "Facts and reference material retrieved as excerpts: policies, brand guidelines, process docs, templates.", ex: "“Client brand guidelines and prior status reports.”" },
  skill: { t: "Skill", d: "A versioned, account-level repeatable procedure: report formatting, spreadsheet processing, a standard workflow.", ex: "“Standard report formatting procedure.”" },
  memory: { t: "Scoped memory", d: "Continuity within one Project: stakeholder names, decisions, long-running preferences.", ex: "“The client prefers Thursday reviews.”" },
  connector: { t: "Connector", d: "External system access at account/org level, under the user's own permissions.", ex: "“Search our shared drive for the signed SOW.”" }
};

function classifySurface(q) {
  const s = q.toLowerCase();
  const score = { instructions: 0, kb: 0, skill: 0, memory: 0, connector: 0 };
  const hits = (arr) => arr.filter(w => s.includes(w)).length;
  score.instructions += hits(["always", "every", "tone", "style", "never", "cite", "format the", "response", "behaviour", "behavior", "rule"]) * 2;
  score.kb += hits(["policy", "policies", "brand", "guideline", "document", "manual", "template", "reference", "look up", "catalog", "catalogue"]) * 2;
  score.skill += hits(["process", "procedure", "steps", "workflow", "build a report", "each week", "weekly", "recurring", "checklist"]) * 2;
  score.memory += hits(["remember", "stakeholder", "prefers", "decision", "last time", "earlier", "name", "continuity"]) * 2;
  score.connector += hits(["drive", "email", "slack", "sharepoint", "jira", "ticket", "crm", "database", "repository", "messages"]) * 2;
  let best = "instructions", bestScore = -1;
  Object.keys(score).forEach(k => { if (score[k] > bestScore) { bestScore = score[k]; best = k; } });
  return { key: best, confident: bestScore > 0 };
}

  return `<div class="lab-grid">
    <div class="card">
      <h4 style="margin-bottom:6px">Where does this belong?</h4>
      <p class="small dim" style="margin-bottom:14px">Describe what you're trying to make permanent.</p>

  </div>`;

function routerRightHTML(q) {
  if (q.trim().length < 4) {
    return `<div class="card" style="min-height:260px;display:grid;place-items:center;text-align:center;color:var(--faint)"><div><div style="font-size:30px;opacity:.35;margin-bottom:10px">▤</div>Type a need — the surface resolves.</div></div>`;
  }
  const res = classifySurface(q);
  const s = SURFACES[res.key];
  return `<div class="card">

/* ---- 5. data classifier ---- */
function labData() {
  const a = ui.labState.dataAns;
  const questions = [
    ["creds", "Contains credentials, API keys or tokens?", "Red — secrets. Absolute never-paste."],
    ["regulated", "Regulated data? (health, financial, government)", "Red — regulated. Needs an approved pathway."],
    ["contractual", "Contractual or NDA-bound, or customer data under a DPA?", "Red — contractual. Needs an approved pathway."],
    ["public", "Public, published, or approved for broad sharing?", "Green — use freely, with standard review."]
  ];
  let verdict = null;
  if (a.creds === "yes") verdict = { t: "Red — secrets", c: "v-bad", d: "Credentials are different in kind. Never paste a password, key or token into Claude under any circumstance — no redaction, no pathway, no exception. If already exposed, treat it as an incident and rotate." };
  else if (a.regulated === "yes" || a.contractual === "yes") verdict = { t: "Red — restricted", c: "v-bad", d: (a.regulated === "yes" ? "Regulated data. " : "") + (a.contractual === "yes" ? "Contractual/NDA-bound data. " : "") + "Do not upload unless an approved pathway exists. Consider whether redaction reduces the tier — and apply the re-identification test." };
  else if (a.public === "yes") verdict = { t: "Green — safe to use", c: "v-good", d: "Use freely with standard quality review. Still be purposeful: upload only what the task needs." };
  else if (a.public === "no" || a.regulated === "no" || a.contractual === "no") verdict = { t: "Yellow — pause and check", c: "v-warn", d: "Internal or draft material. Check your organisation's policy before uploading, and consider redaction. This is the tier where most governance mistakes happen." };

  return `<div class="lab-grid">
    <div class="card">
      <h4 style="margin-bottom:14px">Classify before you upload</h4>
      ${questions.map(([k, label]) => `<div class="field"><label style="margin-bottom:5px">${label}</label>
        <div class="seg"><button class="${a[k] === "yes" ? "on" : ""}" data-act="dataAns" data-k="${k}" data-v="yes">Yes</button><button class="${a[k] === "no" ? "on" : ""}" data-act="dataAns" data-k="${k}" data-v="no">No</button><button class="${!a[k] ? "on" : ""}" data-act="dataAns" data-k="${k}" data-v="">Unsure</button></div></div>`).join("")}
      <p class="small dim" style="margin:6px 0 0">Green / Yellow / Red is an illustrative model — map it onto your organisation's labels.</p>
    </div>
    <div>
      ${!verdict ? `<div class="card" style="min-height:260px;display:grid;place-items:center;text-align:center;color:var(--faint)"><div><div style="font-size:30px;opacity:.35;margin-bottom:10px">◆</div>Answer the checks to classify.</div></div>` : `<div class="verdict ${verdict.c}" style="margin-top:0"><div class="v-label">Classification</div><div class="v-title">${verdict.t}</div><div class="v-body">${verdict.d}</div></div>`}
      <div class="callout co-exam" style="margin-top:16px"><div class="co-title">◆ Two traps</div><div><strong>Partial redaction</strong> — removing a name but keeping a unique identifier still allows re-identification. <strong>Sandbox ≠ safe</strong> — code execution protects the host system, not the data's classification.</div></div>
    </div>
  </div>`;
}

/* ---- 6. review gate ---- */
function labGate() {
  const g = ui.labState.gate;
  const checks = [
    ["who", "Who reviews", "A named role — not 'someone'"],
    ["what", "What is reviewed", "Accuracy, bias, completeness, compliance"],
    ["when", "When", "Before use, not after"],
    ["how", "How it is evidenced", "Sign-off, ticket, version note"],
    ["reject", "What happens on rejection", "Escalate, rework, abandon"]
  ];
  return `<div class="lab-grid">
    <div class="card">
      <h4 style="margin-bottom:6px">Build a review gate</h4>
      <p class="small dim" style="margin-bottom:14px">A gate is a control only when all five elements are specified.</p>
      ${checks.map(([k, label, hint]) => `<div class="field">
        <label>${label}</label>
        <input type="text" data-gate="${k}" value="${esc(g[k])}" placeholder="${hint}">
      </div>`).join("")}
    </div>
    <div id="gateRight">${gateRightHTML(g)}</div>
  </div>`;
}

function gateRightHTML(g) {
  const filled = ["who", "what", "when", "how", "reject"].filter(k => (g[k] || "").trim()).length;
  const strong = filled >= 5;
  return `<div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        <div class="bar" style="flex:1;height:6px"><i style="width:${(filled / 5) * 100}%;background:${strong ? "var(--teal)" : "var(--accent)"}"></i></div>
        <span class="mono small" style="color:var(--muted)">${filled}/5</span>
      </div>
      <h4 style="margin:16px 0 10px">Gate statement</h4>
      <pre style="white-space:pre-wrap;font-family:var(--font-sans);font-size:13.5px;line-height:1.7;background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--text-dim);margin:0">${esc(gateStatement(g))}</pre>
    </div>
    <div class="verdict ${strong ? "v-good" : filled > 2 ? "v-warn" : "v-bad"}" style="margin-top:16px">
      <div class="v-label">Assessment</div>
      <div class="v-title">${strong ? "Functioning control" : filled > 2 ? "Incomplete gate" : "Not yet a control"}</div>
      <div class="v-body">${strong
        ? "All five elements are specified. This gate can be tested in an audit and defended to a risk team."
        : "A gate missing its owner, its evidence, or its rejection path cannot be audited — it reads as oversight without functioning as oversight."}</div>
    </div>`;
}

function gateStatement(g) {
  const parts = [];
  parts.push(g.who ? g.who + " reviews the output" : "[who] reviews the output");
  parts.push(g.what ? "for " + g.what : "[what]");
  parts.push(g.when ? g.when : "[when]");
  parts.push(g.how ? "Evidence: " + g.how + "." : "Evidence: [how].");
  parts.push(g.reject ? "On rejection: " + g.reject + "." : "On rejection: [what happens].");
  return parts.join(", ").replace(/,(?=[^,]*$)/, ".");
}

/* ============================================================
   SEARCH
   ============================================================ */
let SEARCH_INDEX = null;
function buildIndex() {
  if (SEARCH_INDEX) return SEARCH_INDEX;
  const idx = [];
  ALL_LESSONS.forEach(l => {
    const txt = l.blocks.concat(officialBlocks(l.id)).map(b => b.body || b.html || (b.items ? b.items.join(" ") : "") || (b.rows ? b.rows.flat().join(" ") : "") || "").join(" ");
    idx.push({ kind: "Lesson", title: l.title, sub: "Course " + l.courseNum, route: "#/lesson/" + l.id, text: stripHTML(txt).toLowerCase() });
    l.keyPoints.forEach(k => idx.push({ kind: "Key point", title: k, sub: "C" + l.courseNum + " · " + l.title, route: "#/lesson/" + l.id, text: "" }));
  });
  CA.glossary.forEach(g => idx.push({ kind: "Term", title: g.t, sub: g.d, route: "#/glossary", text: g.d.toLowerCase() }));
  idx.push({ kind: "Tool", title: "Diagnostic lab", sub: "Prompt audit, failure triage, delegation, data class, review gate", route: "#/lab", text: "" });
  idx.push({ kind: "Page", title: "Cheat sheet", sub: "Everything compressed onto one page", route: "#/cheatsheet", text: "" });
  idx.push({ kind: "Page", title: "Mock exam", sub: "40 questions, 45 minutes", route: "#/exam", text: "" });
  SEARCH_INDEX = idx;
  return idx;
}

function openSearch() {
  ui.searchOpen = true;
  ui.searchSel = 0;
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.id = "searchOverlay";
  ov.innerHTML = `<div class="palette">
    <input class="palette-input" id="searchInput" placeholder="Search lessons, terms, key points…" autocomplete="off" spellcheck="false">
    <div class="palette-results" id="searchResults"></div>
  </div>`;
  document.body.appendChild(ov);
  const input = $("#searchInput");
  input.focus();
  input.addEventListener("input", () => runSearch(input.value));
  runSearch("");
  ov.addEventListener("mousedown", e => { if (e.target === ov) closeSearch(); });
}
function closeSearch() {
  ui.searchOpen = false;
  const ov = $("#searchOverlay");
  if (ov) ov.remove();
}
function runSearch(q) {
  const query = q.trim().toLowerCase();
  const idx = buildIndex();
  let results;
  if (!query) {
    results = idx.filter(i => i.kind === "Lesson").slice(0, 8);
  } else {
    results = idx.filter(i => (i.title + " " + i.sub + " " + i.text).toLowerCase().includes(query)).slice(0, 40);
    results.sort((a, b) => (a.title.toLowerCase().startsWith(query) ? -1 : 0) - (b.title.toLowerCase().startsWith(query) ? -1 : 0));
  }
  ui.searchResults = results;
  ui.searchSel = 0;
  const box = $("#searchResults");
  if (!box) return;
  box.innerHTML = results.length ? results.map((r, i) => `<div class="p-item ${i === 0 ? "sel" : ""}" data-sr="${i}">
    <span class="p-title">${esc(r.title)}</span>
    <span class="p-kind">${r.kind}</span>
  </div>`).join("") : `<div class="p-empty">Nothing matched “${esc(q)}”.</div>`;
  $$(".p-item", box).forEach(el => el.addEventListener("click", () => {
    const r = results[+el.dataset.sr];
    closeSearch(); go(r.route);
  }));
}
function moveSearch(dir) {
  const items = $$(".p-item");
  if (!items.length) return;
  ui.searchSel = (ui.searchSel + dir + items.length) % items.length;
  items.forEach((el, i) => el.classList.toggle("sel", i === ui.searchSel));
  items[ui.searchSel].scrollIntoView({ block: "nearest" });
}

/* ============================================================
   EVENTS + BOOT
   ============================================================ */
function afterRender(r) {
  if (r.name === "lab") bindLab();
  if (r.name === "exam" && ui.exam && !ui.exam.done) startExamTimer();
}

function bindLab() {
  $$("[data-pb]").forEach(inp => {
    inp.addEventListener("input", () => {
      ui.labState.prompt[inp.dataset.pb] = inp.value;
      const p = ui.labState.prompt;
      const comps = ["role", "context", "task", "constraints", "format", "examples"];
      const filled = comps.filter(k => (p[k] || "").trim()).length;
      const bar = $("#pbBar"); if (bar) bar.style.width = (filled / 6) * 100 + "%";
      const cnt = $("#pbCount"); if (cnt) cnt.textContent = filled + "/6";
      const prev = $("#pbPreview"); if (prev) prev.textContent = promptPreview();
      const v = $("#pbVerdict"); if (v) v.innerHTML = promptVerdict(filled, p);
      const miss = $("#pbMissing");
      if (miss) {
        const labels = { role: "Role", context: "Context", task: "Task", constraints: "Constraints", format: "Output format", examples: "Examples" };
        const missing = comps.filter(k => !(p[k] || "").trim());
        miss.innerHTML = missing.length
          ? `<div class="small dim" style="margin-bottom:10px">Missing:</div><div class="badge-row">${missing.map(m => `<span class="pill rose">${labels[m]}</span>`).join("")}</div>`
          : `<div class="pill teal">All six components present</div>`;
      }
    });
  });
  $$("[data-gate]").forEach(inp => {
    inp.addEventListener("input", () => {
      ui.labState.gate[inp.dataset.gate] = inp.value;
      const right = $("#gateRight");
      if (right) right.innerHTML = gateRightHTML(ui.labState.gate);
    });
  });
  const rq = $("#routerQ");
  if (rq) {
    rq.addEventListener("input", () => {
      ui.labState.routerQ = rq.value;
      const right = $("#routerRight");
      if (right) right.innerHTML = routerRightHTML(rq.value);
    });
  }
}

function handleClick(e) {
  const goEl = e.target.closest("[data-go]");
  if (goEl) { e.preventDefault(); go(goEl.dataset.go); closeMobileNav(); return; }

  const toggle = e.target.closest("[data-toggle-course]");
  if (toggle) {
    const wrap = toggle.closest(".nav-course");
    wrap.classList.toggle("open");
    return;
  }

  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  const id = act.dataset.id;

  switch (a) {
    case "toggleStudied": {
      state.studied[id] = !state.studied[id];
      saveState();
      render();
      toast(state.studied[id] ? "Lesson marked studied" : "Marked as not studied", "good");
      break;
    }
    case "fcCourse": ui.fc.course = id; fcRebuild(true); render(); break;
    case "fcToggleAll": ui.fc.showAll = !ui.fc.showAll; fcRebuild(true); render(); break;
    case "fcFlip": ui.fc.flipped = !ui.fc.flipped; render(); break;
    case "fcRate": rateCard(id); break;

    case "quizCourse": ui.quizCourse = id; render(); break;
    case "quizForCourse": ui.quizCourse = id; ui.quiz = null; go("#/quiz"); break;
    case "quizLen": ui.quizLen = +id; render(); break;
    case "quizStart": quizStart(); break;
    case "quizAnswer": {
      if (ui.quiz.answers[ui.quiz.idx] != null) break;
      ui.quiz.answers[ui.quiz.idx] = +id;
      const q = ui.quiz.pool[ui.quiz.idx];
      state.quiz.total++;
      if (+id === q.a) state.quiz.right++;
      saveState();
      render();
      break;
    }
    case "quizNext": {
      if (ui.quiz.idx < ui.quiz.pool.length - 1) { ui.quiz.idx++; }
      else { ui.quiz.done = true; }
      render();
      break;
    }
    case "quizRestart": ui.quiz = null; render(); break;

    case "examStart": examStart(); break;
    case "examAnswer": {
      ui.exam.answers[ui.exam.idx] = +id;
      if (ui.exam.idx < ui.exam.pool.length - 1) ui.exam.idx++;
      render();
      break;
    }
    case "examNext": if (ui.exam.idx < ui.exam.pool.length - 1) { ui.exam.idx++; render(); } break;
    case "examPrev": if (ui.exam.idx > 0) { ui.exam.idx--; render(); } break;
    case "examGo": ui.exam.idx = +id; render(); break;
    case "examFlag": ui.exam.flags[+id] = !ui.exam.flags[+id]; render(); break;
    case "examSubmit": submitExam(false); break;
    case "examRestart": ui.exam = null; render(); break;

    case "labTool": ui.labState.tool = id; render(); break;
    case "pbExample": {
      ui.labState.prompt = {
        role: "Operations Analyst",
        context: "You are writing a one-page update for the Regional Director. The audience cares about throughput and cost, not methodology. Q3 data is attached as a CSV.",
        task: "Summarise the attached Q3 operations data, covering only the metrics that deviate more than 10% from target.",
        constraints: "Roughly 120–160 words. Factual, no adjectives. If a metric has no target in the file, say so rather than estimating.",
        format: "One headline sentence, then three bullets. Wrap the whole thing in <summary> tags.",
        examples: "Headline: Throughput missed target on two lines in Q3.\n• Line A: 14% below target — downtime.\n• Line B: 11% below target — staffing gap."
      };
      render(); toast("Example brief loaded", "good");
      break;
    }
    case "pbClear": ui.labState.prompt = { role: "", context: "", task: "", constraints: "", format: "", examples: "" }; render(); break;
    case "pbCopy": {
      navigator.clipboard.writeText(promptPreview()).then(() => toast("Prompt copied", "good")).catch(() => toast("Copy blocked by the browser"));
      break;
    }
    case "triage": ui.labState.timing = id; render(); break;
    case "dlgField": {
      ui.labState.form[act.dataset.k] = act.dataset.v;
      render();
      break;
    }
    case "dlgAdd": {
      const nameEl = $("#dlgName");
      const name = nameEl ? nameEl.value.trim() : "";
      if (!name) { toast("Name the step first"); break; }
      const f = ui.labState.form;
      const r = classifyStep(f);
      ui.labState.steps.push({ name, v: r.v, cls: r.cls });
      ui.labState.form = { name: "", nature: "artefact", reversible: "yes", stakes: "low", accountability: "collab", cleared: "yes" };
      render();
      break;
    }
    case "dlgClear": ui.labState.steps = []; render(); break;
    case "routerChip": ui.labState.routerQ = id; render(); break;
    case "dataAns": ui.labState.dataAns[act.dataset.k] = act.dataset.v; render(); break;
    case "resetProgress": {
      if (!confirm("Reset all study progress, flashcard ratings and quiz history? This cannot be undone.")) break;
      state.studied = {}; state.cards = {}; state.quiz = { right: 0, total: 0, byCourse: {} }; state.history = [];
      ui.fc.queue = []; ui.quiz = null; ui.exam = null;
      saveState(); render(); toast("Progress reset");
      break;
    }
  }
}

function handleKey(e) {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); ui.searchOpen ? closeSearch() : openSearch(); return; }
  if (e.key === "Escape") {
    if (ui.searchOpen) { closeSearch(); return; }
    closeMobileNav();
  }
  const typing = /input|textarea|select/i.test((e.target.tagName || ""));
  if (e.key === "/" && !typing && !ui.searchOpen) { e.preventDefault(); openSearch(); return; }

  if (ui.searchOpen) {
    if (e.key === "ArrowDown") { e.preventDefault(); moveSearch(1); }
    if (e.key === "ArrowUp") { e.preventDefault(); moveSearch(-1); }
    if (e.key === "Enter") {
      const r = ui.searchResults[ui.searchSel];
      if (r) { closeSearch(); go(r.route); }
    }
    return;
  }

  const r = parseRoute();
  if (r.name === "flashcards" && !typing) {
    if (e.key === " ") { e.preventDefault(); ui.fc.flipped = !ui.fc.flipped; render(); }
    if (e.key === "1") rateCard("again");
    if (e.key === "2") rateCard("known");
  }
  if (r.name === "quiz" && ui.quiz && !ui.quiz.done && !typing) {
    if (["1", "2", "3", "4"].includes(e.key)) {
      const i = +e.key - 1;
      if (ui.quiz.answers[ui.quiz.idx] == null && i < ui.quiz.pool[ui.quiz.idx].opts.length) {
        e.preventDefault();
        document.querySelector(`[data-act="quizAnswer"][data-id="${i}"]`)?.click();
      }
    }
    if (e.key === "Enter" && ui.quiz.answers[ui.quiz.idx] != null) { e.preventDefault(); document.querySelector('[data-act="quizNext"]')?.click(); }
  }
}

function closeMobileNav() {
  $("#sidebar").classList.remove("open");
  $("#scrim").classList.remove("show");
}

function boot() {
  applyTheme();
  buildSidebar();
  render();
  window.addEventListener("hashchange", () => { render(); closeMobileNav(); });

  document.addEventListener("click", handleClick);
  document.addEventListener("keydown", handleKey);

  $("#themeBtn").addEventListener("click", () => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    saveState(); applyTheme();
  });
  $("#hamburger").addEventListener("click", () => {
    $("#sidebar").classList.toggle("open");
    $("#scrim").classList.toggle("show");
  });
  $("#scrim").addEventListener("click", closeMobileNav);
  $("#searchBtn").addEventListener("click", openSearch);
  $(".brand").addEventListener("click", () => go("#/"));

  if (!location.hash) location.replace("#/");
}

document.addEventListener("DOMContentLoaded", boot);

</script>
<script>
  document.getElementById('hamburger').innerHTML = window.CA_ICONS.menu;
</script>
</body>
