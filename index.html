<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Claude Associate · Study Academy</title>
<meta name="description" content="An interactive study companion and exam trainer for the Claude Associate certification.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23d97757'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3ECA%3C/text%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Claude Associate — Study Academy
   Design system: warm editorial dark/light, clay accent, serif display
   ========================================================================== */

:root {
  --font-sans: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.14);
  --accent-line: rgba(217, 119, 87, 0.38);
  --teal: #6fae9c;
  --teal-soft: rgba(111, 174, 156, 0.14);
  --gold: #d9a441;
  --gold-soft: rgba(217, 164, 65, 0.13);
  --blue: #6f97c9;
  --blue-soft: rgba(111, 151, 201, 0.14);
  --rose: #cf6a7a;
  --rose-soft: rgba(207, 106, 122, 0.13);

  --bg: #0e1014;
  --bg-elev: #14171e;
  --panel: #171b23;
  --panel-2: #1d222c;
  --panel-3: #242a36;
  --text: #eae7e1;
  --text-dim: #b3b7c0;
  --muted: #8b919d;
  --faint: #666d79;
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.14);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow: 0 8px 24px -12px rgba(0, 0, 0, 0.65), 0 1px 0 rgba(255, 255, 255, 0.03) inset;
  --shadow-lg: 0 28px 60px -24px rgba(0, 0, 0, 0.8);

  --r-sm: 8px;
  --r: 12px;
  --r-lg: 18px;
  --r-xl: 26px;

  --sidebar-w: 300px;
  --maxw: 920px;
}

[data-theme="light"] {
  --accent: #bd5b3a;
  --accent-soft: rgba(189, 91, 58, 0.1);
  --accent-line: rgba(189, 91, 58, 0.3);
  --teal: #3f8471;
  --teal-soft: rgba(63, 132, 113, 0.1);
  --gold: #a97a12;
  --gold-soft: rgba(169, 122, 18, 0.12);
  --blue: #3c6fa8;
  --blue-soft: rgba(60, 111, 168, 0.1);
  --rose: #b04b5e;
  --rose-soft: rgba(176, 75, 94, 0.09);

  --bg: #f6f3ee;
  --bg-elev: #fbf9f6;
  --panel: #ffffff;
  --panel-2: #f7f4ef;
  --panel-3: #efeae2;
  --text: #1d2126;
  --text-dim: #40474f;
  --muted: #666e79;
  --faint: #8b929c;
  --line: rgba(20, 24, 30, 0.09);
  --line-strong: rgba(20, 24, 30, 0.16);
  --shadow-sm: 0 1px 2px rgba(40, 30, 20, 0.06);
  --shadow: 0 10px 30px -18px rgba(60, 45, 30, 0.35), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
  --shadow-lg: 0 30px 70px -30px rgba(60, 45, 30, 0.4);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 15.5px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(217, 119, 87, 0.09), transparent 65%),
    radial-gradient(700px 500px at -10% 110%, rgba(111, 174, 156, 0.07), transparent 60%);
}

::selection { background: var(--accent-soft); color: var(--text); }

/* Inline icons default to text size; class rules override where larger is needed */
svg { width: 18px; height: 18px; flex: 0 0 auto; }
.pill svg { width: 13px; height: 13px; }
.eyebrow svg, .crumb svg { width: 14px; height: 14px; }
.gauge { width: 104px; height: 104px; }
.ring { width: 22px; height: 22px; }

/* Scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--panel-3) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 20px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--line-strong); background-clip: content-box; }

/* ============================ Layout ============================ */
.app { display: flex; height: 100dvh; position: relative; z-index: 1; }

.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  height: 100%;
  background: var(--bg-elev);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 40;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 22px 22px 16px;
  cursor: pointer;
  user-select: none;
}
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, var(--accent), #a8502f);
  box-shadow: 0 6px 18px -8px var(--accent), inset 0 1px 0 rgba(255,255,255,0.25);
  flex: 0 0 auto;
  font-family: var(--font-serif);
  font-size: 19px; font-weight: 700; color: #fff;
  letter-spacing: -0.5px;
}
.brand-text { line-height: 1.2; min-width: 0; }
.brand-title { font-family: var(--font-serif); font-size: 17.5px; letter-spacing: 0.1px; }
.brand-sub { font-size: 11px; text-transform: uppercase; letter-spacing: 1.7px; color: var(--faint); font-weight: 600; margin-top: 4px; }

.sidebar-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 12px 24px; }

.nav-group-label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.6px;
  color: var(--faint); font-weight: 700;
  padding: 18px 12px 8px;
}

.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px; border-radius: 9px;
  color: var(--text-dim); text-decoration: none;
  font-size: 14px; cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.15s, color 0.15s;
  position: relative;
}
.nav-item:hover { background: var(--panel); color: var(--text); }
.nav-item.active { background: var(--panel-2); color: var(--text); border-color: var(--line); }
.nav-item.active::before {
  content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px;
  width: 3px; border-radius: 0 3px 3px 0; background: var(--accent);
}
.nav-item svg { width: 17px; height: 17px; flex: 0 0 17px; opacity: 0.85; }
.nav-item .nav-count {
  margin-left: auto; font-size: 11px; color: var(--faint);
  font-variant-numeric: tabular-nums; font-family: var(--font-mono);
}

.nav-course { border-radius: 10px; overflow: hidden; }
.nav-course-btn {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 10px 12px; background: none; border: 0; color: var(--text-dim);
  font: inherit; font-size: 13.8px; cursor: pointer; text-align: left; border-radius: 9px;
  transition: background 0.15s, color 0.15s;
}
.nav-course-btn:hover { background: var(--panel); color: var(--text); }
.nav-course.open > .nav-course-btn { color: var(--text); }
.nav-course.active > .nav-course-btn { background: var(--panel-2); color: var(--text); }
.nav-num {
  width: 22px; height: 22px; border-radius: 7px; flex: 0 0 22px;
  display: grid; place-items: center;
  font-size: 10.5px; font-weight: 700; font-family: var(--font-mono);
  background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
}
.nav-course.active .nav-num { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.nav-course-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-caret { width: 14px; height: 14px; opacity: 0.5; transition: transform 0.22s; flex: 0 0 14px; }
.nav-course.open .nav-caret { transform: rotate(90deg); }

.nav-lessons { display: none; padding: 2px 0 8px 34px; }
.nav-course.open .nav-lessons { display: block; }
.nav-lesson {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 7px; cursor: pointer;
  font-size: 12.9px; color: var(--muted); line-height: 1.35;
  border-left: 1px solid var(--line);
}
.nav-lesson:hover { color: var(--text); background: var(--panel); }
.nav-lesson.active { color: var(--accent); background: var(--accent-soft); border-left-color: var(--accent); }
.nav-lesson .dot {
  width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px;
  background: var(--panel-3); border: 1px solid var(--line-strong);
}
.nav-lesson.done .dot { background: var(--teal); border-color: var(--teal); }

.sidebar-foot { padding: 12px; border-top: 1px solid var(--line); }
.streak-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.streak-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--faint); font-weight: 700; }
.streak-card .val { font-family: var(--font-serif); font-size: 20px; }

/* Main */
.main { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; position: relative; }

.topbar {
  height: 62px; flex: 0 0 62px;
  display: flex; align-items: center; gap: 14px;
  padding: 0 28px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px);
  z-index: 30;
}
.hamburger { display: none !important; }
.crumb { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); min-width: 0; }
.crumb strong { color: var(--text); font-weight: 600; }
.crumb .sep { opacity: 0.4; }

.topbar-spacer { flex: 1; }

.search-trigger {
  display: flex; align-items: center; gap: 9px;
  height: 36px; padding: 0 12px; min-width: 210px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
  color: var(--muted); font-size: 13px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.search-trigger:hover { border-color: var(--line-strong); color: var(--text-dim); }
.search-trigger svg { width: 15px; height: 15px; }
.kbd {
  font-family: var(--font-mono); font-size: 10.5px; padding: 2px 5px;
  border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px;
  color: var(--faint); margin-left: auto; background: var(--bg-elev);
}

.icon-btn {
  width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center;
  background: var(--panel); border: 1px solid var(--line); color: var(--muted);
  cursor: pointer; transition: all 0.15s; flex: 0 0 auto;
}
.icon-btn:hover { color: var(--text); border-color: var(--line-strong); }
.icon-btn svg { width: 16px; height: 16px; }

.progress-chip {
  display: flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 12px 0 8px; border-radius: 9px;
  background: var(--panel); border: 1px solid var(--line);
  font-size: 12.5px; color: var(--text-dim); font-variant-numeric: tabular-nums;
}
.ring { width: 22px; height: 22px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3; }
.ring .bg { stroke: var(--panel-3); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.6s; }

.view {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 44px 28px 120px;
  scroll-behavior: smooth;
}
.view-inner { max-width: var(--maxw); margin: 0 auto; animation: fadeUp 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
.view-wide { max-width: 1180px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ============================ Typography ============================ */
h1, h2, h3, h4 { font-family: var(--font-serif); font-weight: 600; letter-spacing: -0.2px; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(30px, 3.6vw, 42px); letter-spacing: -0.8px; }
h2 { font-size: 25px; margin-bottom: 14px; }
h3 { font-size: 19px; margin-bottom: 10px; }
h4 { font-size: 15.5px; font-family: var(--font-sans); font-weight: 700; letter-spacing: 0; }

p { margin: 0 0 16px; }
a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-line); }
a:hover { border-bottom-color: var(--accent); }
strong, b { color: var(--text); font-weight: 650; }
em { color: var(--text-dim); }
code {
  font-family: var(--font-mono); font-size: 0.87em;
  background: var(--panel-2); border: 1px solid var(--line);
  padding: 1.5px 5px; border-radius: 5px; color: var(--text-dim);
}
mark { background: var(--gold-soft); color: var(--text); border-radius: 3px; padding: 0 2px; }

.eyebrow {
  font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
  color: var(--accent); font-weight: 700; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--accent); }
.lede { font-size: 17px; color: var(--text-dim); line-height: 1.6; max-width: 68ch; }
.dim { color: var(--muted); }
.small { font-size: 12.5px; }
.mono { font-family: var(--font-mono); }

/* ============================ Components ============================ */
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 22px;
  box-shadow: var(--shadow-sm);
}
.card.tight { padding: 16px; }
.card-hover { transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; cursor: pointer; }
.card-hover:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow); }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 18px; border-radius: 10px;
  background: var(--panel-2); border: 1px solid var(--line-strong);
  color: var(--text); font: inherit; font-size: 13.5px; font-weight: 550;
  cursor: pointer; transition: all 0.15s; white-space: nowrap; text-decoration: none;
}
.btn:hover { border-color: var(--muted); background: var(--panel-3); border-bottom-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 15px; height: 15px; }
.btn-primary {
  background: var(--accent); border-color: transparent; color: #fff;
  box-shadow: 0 8px 20px -12px var(--accent);
}
.btn-primary:hover { background: #e08a6b; border-color: transparent; color: #fff; }
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 8px; }
.btn-lg { height: 46px; padding: 0 24px; font-size: 14.5px; border-radius: 11px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 9px; border-radius: 20px;
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.2px;
  background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
  white-space: nowrap;
}
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.pill.teal { background: var(--teal-soft); color: var(--teal); border-color: rgba(111,174,156,0.3); }
.pill.gold { background: var(--gold-soft); color: var(--gold); border-color: rgba(217,164,65,0.3); }
.pill.rose { background: var(--rose-soft); color: var(--rose); border-color: rgba(207,106,122,0.3); }
.pill.blue { background: var(--blue-soft); color: var(--blue); border-color: rgba(111,151,201,0.3); }

.divider { height: 1px; background: var(--line); margin: 28px 0; border: 0; }

/* Hero / dashboard */
.hero {
  display: grid; grid-template-columns: 1.35fr 1fr; gap: 28px;
  align-items: stretch; margin-bottom: 26px;
}
.hero-main {
  background:
    radial-gradient(600px 240px at 100% 0%, var(--accent-soft), transparent 70%),
    var(--panel);
  border: 1px solid var(--line); border-radius: var(--r-xl);
  padding: 32px; position: relative; overflow: hidden;
}
.hero-main h1 { margin-bottom: 12px; }
.hero-main h1 em { font-style: italic; color: var(--accent); }
.hero-actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }

.readiness {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl);
  padding: 24px; display: flex; flex-direction: column; justify-content: space-between;
}
.gauge-wrap { display: flex; align-items: center; gap: 20px; }
.gauge { width: 104px; height: 104px; transform: rotate(-90deg); flex: 0 0 auto; }
.gauge circle { fill: none; stroke-width: 8; stroke-linecap: round; }
.gauge .gbg { stroke: var(--panel-3); }
.gauge .gfg { stroke: url(#gaugeGrad); transition: stroke-dashoffset 1s cubic-bezier(0.2,0.8,0.2,1); }
.gauge-num { font-family: var(--font-serif); font-size: 34px; line-height: 1; }
.gauge-label { font-size: 12px; color: var(--muted); margin-top: 5px; }

.stat-row { display: flex; gap: 10px; margin-top: 18px; }
.stat {
  flex: 1; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 11px; padding: 11px 12px;
}
.stat .n { font-family: var(--font-serif); font-size: 21px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--faint); margin-top: 5px; font-weight: 600; }

.course-card { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
.course-card .cc-top { display: flex; align-items: flex-start; gap: 14px; }
.cc-num {
  font-family: var(--font-serif); font-size: 30px; line-height: 1;
  color: var(--accent); opacity: 0.85; min-width: 46px;
}
.cc-title { font-family: var(--font-serif); font-size: 17px; line-height: 1.25; }
.cc-tag { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.45; }
.cc-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; }
.bar { flex: 1; height: 5px; background: var(--panel-3); border-radius: 10px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 10px; transition: width 0.5s; }

/* Lesson */
.lesson-head { margin-bottom: 30px; }
.lesson-head h1 { margin: 10px 0 14px; }
.lesson-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 16px; }

.objectives {
  background: var(--panel-2); border: 1px solid var(--line);
  border-left: 2px solid var(--teal); border-radius: 0 12px 12px 0;
  padding: 18px 22px; margin: 0 0 32px;
}
.objectives .obj-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.6px; font-weight: 700; color: var(--teal); margin-bottom: 10px; }
.objectives ul { margin: 0; padding-left: 18px; }
.objectives li { font-size: 13.8px; color: var(--text-dim); margin-bottom: 5px; }

.block { margin-bottom: 26px; }
.block > h3 { margin-top: 34px; margin-bottom: 12px; }
.block p { color: var(--text-dim); }
.block p strong { color: var(--text); }

ul.clean, ol.clean { margin: 0 0 18px; padding-left: 0; list-style: none; }
ul.clean > li, ol.clean > li {
  position: relative; padding-left: 26px; margin-bottom: 10px;
  color: var(--text-dim);
}
ul.clean > li::before {
  content: ""; position: absolute; left: 6px; top: 10px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: 0.75;
}
ol.clean { counter-reset: n; }
ol.clean > li { counter-increment: n; padding-left: 32px; }
ol.clean > li::before {
  content: counter(n);
  position: absolute; left: 0; top: 1px;
  width: 21px; height: 21px; border-radius: 50%;
  background: var(--panel-2); border: 1px solid var(--line-strong);
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--accent); font-weight: 600;
}
li strong { color: var(--text); }

/* Callouts */
.callout {
  border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px 16px 18px; margin: 22px 0;
  background: var(--panel-2); position: relative;
  border-left: 2px solid var(--muted);
}
.callout .co-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
  font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 7px;
}
.callout p, .callout li { font-size: 14px; margin-bottom: 8px; }
.callout p:last-child, .callout ul:last-child, .callout li:last-child { margin-bottom: 0; }
.callout ul { margin: 0; padding-left: 18px; }
.callout ul li { color: var(--text-dim); }
.co-exam { border-left-color: var(--gold); background: var(--gold-soft); }
.co-exam .co-title { color: var(--gold); }
.co-principle { border-left-color: var(--accent); background: var(--accent-soft); }
.co-principle .co-title { color: var(--accent); }
.co-tip { border-left-color: var(--teal); background: var(--teal-soft); }
.co-tip .co-title { color: var(--teal); }
.co-warn { border-left-color: var(--rose); background: var(--rose-soft); }
.co-warn .co-title { color: var(--rose); }
.co-official { border-left-color: var(--blue); background: var(--blue-soft); }
.co-official .co-title { color: var(--blue); }
.co-fix { border-left-color: var(--rose); background: var(--rose-soft); }
.co-fix .co-title { color: var(--rose); }
.official { margin-top: 34px; padding-top: 22px; border-top: 1px dashed var(--line); }
.official-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.official-head h3 { margin: 0; }
.official-head .small { color: var(--muted); }

/* Tables */
.table-wrap { overflow-x: auto; margin: 22px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: 13.6px; }
th {
  text-align: left; padding: 11px 15px; font-size: 10.5px; text-transform: uppercase;
  letter-spacing: 1.1px; color: var(--muted); font-weight: 700;
  background: var(--panel-2); border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
td { padding: 12px 15px; border-bottom: 1px solid var(--line); color: var(--text-dim); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--panel-2); }
td strong { color: var(--text); }
td .tag { font-size: 11.5px; font-weight: 600; }

/* Split compare */
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 22px 0; }
.compare > div { border-radius: 12px; padding: 16px 18px; border: 1px solid var(--line); }
.compare .weak { background: var(--rose-soft); border-color: rgba(207,106,122,0.25); }
.compare .strong { background: var(--teal-soft); border-color: rgba(111,174,156,0.25); }
.compare .ct { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.4px; font-weight: 700; margin-bottom: 9px; }
.compare .weak .ct { color: var(--rose); }
.compare .strong .ct { color: var(--teal); }
.compare p { font-size: 13.5px; margin: 0; color: var(--text-dim); }
.compare p + p { margin-top: 8px; }

/* Keypoint strip at lesson end */
.takeaways {
  border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  margin: 40px 0 0; background: var(--panel);
}
.takeaways-head {
  padding: 14px 20px; background: var(--panel-2); border-bottom: 1px solid var(--line);
  font-size: 11px; text-transform: uppercase; letter-spacing: 1.6px; font-weight: 700; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.takeaways ul { margin: 0; padding: 18px 22px 18px 22px; list-style: none; }
.takeaways li {
  padding-left: 24px; position: relative; margin-bottom: 11px;
  font-size: 14px; color: var(--text-dim);
}
.takeaways li:last-child { margin-bottom: 0; }
.takeaways li::before {
  content: "→"; position: absolute; left: 0; color: var(--accent); font-size: 13px;
}

.lesson-nav { display: flex; gap: 12px; margin-top: 36px; }
.lesson-nav .btn { flex: 1; justify-content: flex-start; height: auto; padding: 14px 16px; flex-direction: column; align-items: flex-start; gap: 3px; }
.lesson-nav .btn.next { align-items: flex-end; text-align: right; }
.lesson-nav .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--faint); font-weight: 600; }
.lesson-nav .ttl { font-size: 13.5px; color: var(--text); }

/* ============================ Flashcards ============================ */
.fc-stage { display: flex; flex-direction: column; align-items: center; gap: 24px; padding-top: 8px; }
.fc-progress { width: 100%; max-width: 660px; display: flex; align-items: center; gap: 14px; }
.fc-progress .bar { height: 4px; }
.fc-progress .txt { font-size: 12px; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }

.flashcard {
  width: 100%; max-width: 660px; min-height: 330px;
  perspective: 1600px; cursor: pointer; background: none; border: 0; padding: 0;
}
.fc-inner {
  position: relative; width: 100%; min-height: 330px;
  transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
  transform-style: preserve-3d;
}
.flashcard.flipped .fc-inner { transform: rotateY(180deg); }
.fc-face {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: var(--r-xl); border: 1px solid var(--line-strong);
  background: var(--panel); box-shadow: var(--shadow-lg);
  padding: 34px; display: flex; flex-direction: column;
  overflow-y: auto;
}
.fc-face.back { transform: rotateY(180deg); background: var(--panel-2); }
.fc-tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); font-weight: 700; margin-bottom: 18px; }
.fc-q { font-family: var(--font-serif); font-size: clamp(20px, 2.4vw, 26px); line-height: 1.32; color: var(--text); flex: 1; display: flex; align-items: center; }
.fc-a { font-size: 15px; line-height: 1.62; color: var(--text-dim); flex: 1; }
.fc-hint { font-size: 11.5px; color: var(--faint); text-align: center; letter-spacing: 0.4px; }
.fc-controls { display: flex; gap: 10px; width: 100%; max-width: 660px; }
.fc-controls .btn { flex: 1; flex-direction: column; height: auto; padding: 10px; gap: 1px; font-size: 13px; }
.fc-controls .btn small { font-size: 10.5px; color: var(--faint); font-weight: 400; }

/* ============================ Quiz / Exam ============================ */
.quiz-shell { max-width: 780px; margin: 0 auto; }
.q-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; }
.q-count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.q-text { font-family: var(--font-serif); font-size: 22px; line-height: 1.38; margin-bottom: 24px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 13px; text-align: left;
  padding: 15px 17px; border-radius: 12px; background: var(--panel);
  border: 1px solid var(--line); color: var(--text-dim);
  font: inherit; font-size: 14.2px; cursor: pointer; transition: all 0.15s;
  line-height: 1.5;
}
.opt:hover:not(.locked) { border-color: var(--line-strong); background: var(--panel-2); color: var(--text); }
.opt .key {
  width: 23px; height: 23px; flex: 0 0 23px; border-radius: 6px;
  display: grid; place-items: center; font-family: var(--font-mono);
  font-size: 11px; background: var(--panel-2); border: 1px solid var(--line-strong);
  color: var(--muted); font-weight: 600; margin-top: 1px;
}
.opt.correct { border-color: var(--teal); background: var(--teal-soft); color: var(--text); }
.opt.correct .key { background: var(--teal); color: #fff; border-color: var(--teal); }
.opt.wrong { border-color: var(--rose); background: var(--rose-soft); color: var(--text); }
.opt.wrong .key { background: var(--rose); color: #fff; border-color: var(--rose); }
.opt.locked { cursor: default; }
.opt.dim { opacity: 0.55; }
.opt.picked { border-color: var(--muted); }

.explain {
  margin-top: 18px; padding: 16px 18px; border-radius: 12px;
  background: var(--panel-2); border: 1px solid var(--line);
  font-size: 14px; color: var(--text-dim); animation: fadeUp 0.25s;
}
.explain .ex-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.4px; font-weight: 700; margin-bottom: 7px; }
.explain.good .ex-title { color: var(--teal); }
.explain.bad .ex-title { color: var(--rose); }

.exam-top {
  display: flex; align-items: center; gap: 14px; padding: 12px 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  margin-bottom: 22px; position: sticky; top: 0; z-index: 10;
}
.timer { font-family: var(--font-mono); font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
.timer.warn { color: var(--gold); }
.timer.danger { color: var(--rose); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.45; } }
.qdots { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
.qdot {
  width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--line-strong);
  background: var(--panel-2); cursor: pointer; font-size: 9px; color: var(--faint);
  display: grid; place-items: center; font-family: var(--font-mono); padding: 0;
}
.qdot.done { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.qdot.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.qdot.flag { border-color: var(--gold); color: var(--gold); }

.result-hero { text-align: center; padding: 20px 0 10px; }
.score-big { font-family: var(--font-serif); font-size: 68px; line-height: 1; letter-spacing: -3px; }
.score-sub { color: var(--muted); font-size: 14px; margin-top: 8px; }

/* ============================ Lab ============================ */
.lab-grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
input[type="text"], input[type="number"], textarea, select {
  width: 100%; background: var(--bg-elev); border: 1px solid var(--line-strong);
  border-radius: 9px; padding: 9px 12px; color: var(--text);
  font: inherit; font-size: 13.5px; outline: none; transition: border-color 0.15s;
}
textarea { resize: vertical; min-height: 74px; line-height: 1.55; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }

.checkline {
  display: flex; align-items: flex-start; gap: 10px; padding: 9px 0;
  cursor: pointer; font-size: 13.5px; color: var(--text-dim);
}
.checkline input { margin: 3px 0 0; accent-color: var(--accent); width: 15px; height: 15px; flex: 0 0 15px; }

.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button {
  background: none; border: 0; color: var(--muted); font: inherit; font-size: 12.5px;
  padding: 6px 12px; border-radius: 7px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--panel-3); color: var(--text); box-shadow: var(--shadow-sm); }

.verdict {
  border-radius: 14px; padding: 18px 20px; border: 1px solid var(--line);
  background: var(--panel-2); margin-top: 18px;
}
.verdict .v-label { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.verdict .v-title { font-family: var(--font-serif); font-size: 21px; margin-bottom: 8px; }
.verdict .v-body { font-size: 13.8px; color: var(--text-dim); }
.verdict.v-good { background: var(--teal-soft); border-color: rgba(111,174,156,0.3); }
.verdict.v-warn { background: var(--gold-soft); border-color: rgba(217,164,65,0.3); }
.verdict.v-bad { background: var(--rose-soft); border-color: rgba(207,106,122,0.3); }

.lab-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 26px; }
.lab-tab {
  padding: 8px 14px; border-radius: 9px; background: transparent; border: 1px solid var(--line);
  color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.lab-tab:hover { color: var(--text); border-color: var(--line-strong); }
.lab-tab.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }

/* ============================ Search palette ============================ */
.overlay {
  position: fixed; inset: 0; background: rgba(5, 6, 9, 0.62);
  backdrop-filter: blur(6px); z-index: 100;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 12vh 20px 20px; animation: fadeIn 0.15s;
}
[data-theme="light"] .overlay { background: rgba(40, 32, 24, 0.35); }
.palette {
  width: 100%; max-width: 620px; background: var(--panel);
  border: 1px solid var(--line-strong); border-radius: 16px;
  box-shadow: var(--shadow-lg); overflow: hidden;
}
.palette-input {
  width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  background: transparent; padding: 18px 20px; font-size: 16px; color: var(--text); outline: none;
}
.palette-input::placeholder { color: var(--faint); }
.palette-results { max-height: 52vh; overflow-y: auto; padding: 8px; }
.p-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border-radius: 9px; cursor: pointer; font-size: 13.5px; color: var(--text-dim);
}
.p-item:hover, .p-item.sel { background: var(--panel-2); color: var(--text); }
.p-item .p-kind { font-size: 9.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--faint); margin-left: auto; white-space: nowrap; }
.p-item .p-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-empty { padding: 26px; text-align: center; color: var(--faint); font-size: 13.5px; }

/* Toast */
.toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: var(--panel-3); border: 1px solid var(--line-strong); color: var(--text);
  padding: 10px 18px; border-radius: 30px; font-size: 13px; box-shadow: var(--shadow-lg);
  animation: toastIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex; align-items: center; gap: 8px;
}
.toast.good { border-color: rgba(111,174,156,0.5); }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ============================ Misc pages ============================ */
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 38px 0 16px; }
.section-head h2 { margin: 0; }

.cheat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cheat-box { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 16px 18px; break-inside: avoid; }
.cheat-box h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--accent); margin-bottom: 10px; }
.cheat-box ul { margin: 0; padding-left: 16px; font-size: 12.8px; color: var(--text-dim); }
.cheat-box li { margin-bottom: 5px; }
.cheat-box li:last-child { margin-bottom: 0; }

.terms { display: flex; flex-direction: column; gap: 2px; }
.term {
  display: flex; gap: 16px; padding: 13px 4px; border-bottom: 1px solid var(--line);
  font-size: 13.8px; align-items: baseline;
}
.term:last-child { border-bottom: 0; }
.term dt { flex: 0 0 200px; font-weight: 650; color: var(--text); }
.term dd { margin: 0; color: var(--text-dim); flex: 1; }

.empty-state { text-align: center; padding: 70px 20px; color: var(--muted); }
.empty-state svg { width: 44px; height: 44px; opacity: 0.3; margin-bottom: 14px; }

.timeline { position: relative; padding-left: 28px; margin: 26px 0; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 1px; background: var(--line-strong); }
.tl-item { position: relative; margin-bottom: 22px; }
.tl-item::before {
  content: ""; position: absolute; left: -27px; top: 6px;
  width: 9px; height: 9px; border-radius: 50%; background: var(--bg);
  border: 2px solid var(--accent);
}
.tl-item h4 { margin-bottom: 4px; }
.tl-item p { font-size: 13.5px; margin: 0; }

.badge-row { display: flex; gap: 6px; flex-wrap: wrap; }

/* Footer */
.site-foot {
  margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  font-size: 12px; color: var(--faint);
}

.scrim { display: none; }

/* ============================ Responsive ============================ */
@media (max-width: 1080px) {
  .hero { grid-template-columns: 1fr; }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lab-grid { grid-template-columns: 1fr; }
  .cheat { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  :root { --sidebar-w: 300px; }
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    transform: translateX(-100%); box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: none; }
  .scrim.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 35; animation: fadeIn 0.2s; }
  .hamburger { display: grid !important; }
  .view { padding: 28px 18px 100px; }
  .topbar { padding: 0 16px; height: 56px; flex-basis: 56px; gap: 10px; }
  .search-trigger { min-width: 0; width: 36px; padding: 0; justify-content: center; }
  .search-trigger span, .search-trigger .kbd { display: none; }
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .compare { grid-template-columns: 1fr; }
  .hero-main { padding: 24px; }
  .term { flex-direction: column; gap: 3px; }
  .term dt { flex: none; }
  .progress-chip .pct { display: none; }
}
@media (max-width: 520px) {
  .crumb .sep, .crumb .c-sub { display: none; }
  .fc-face { padding: 24px; }
  .flashcard, .fc-inner { min-height: 300px; }
  .lesson-nav { flex-direction: column; }
}

/* Print */
@media print {
  :root, [data-theme="light"], [data-theme="dark"] {
    --bg: #ffffff;
    --bg-elev: #ffffff;
    --panel: #ffffff;
    --panel-2: #f7f4ef;
    --panel-3: #edeae3;
    --text: #14181d;
    --text-dim: #2e3439;
    --muted: #4d555d;
    --faint: #6b737b;
    --line: rgba(0, 0, 0, 0.14);
    --line-strong: rgba(0, 0, 0, 0.24);
    --accent: #a94a2b;
    --accent-soft: rgba(169, 74, 43, 0.07);
    --accent-line: rgba(169, 74, 43, 0.3);
    --teal: #2f6f5e;
    --teal-soft: rgba(47, 111, 94, 0.07);
    --gold: #8a6410;
    --gold-soft: rgba(138, 100, 16, 0.08);
    --rose: #93404f;
    --rose-soft: rgba(147, 64, 79, 0.07);
  }
  body { overflow: visible; background: #fff; color: #14181d; }
  body::before { display: none; }
  .sidebar, .topbar, .site-foot, .lesson-nav, .fc-controls, .exam-top, .lab-tabs, .btn { display: none !important; }
  .view { overflow: visible; height: auto; padding: 0; }
  .app { display: block; height: auto; }
  .view-inner { max-width: none; animation: none; }
  .card, .cheat-box, .callout, .table-wrap, .takeaways { break-inside: avoid; box-shadow: none; }
  .cheat { grid-template-columns: 1fr 1fr; gap: 10px; }
  .cheat-box { border-color: #c9c4bb; }
  h1 { font-size: 26px; }
  .lede { font-size: 13px; }
  a { color: inherit; border: 0; }
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand" title="Home">
      <div class="brand-mark">CA</div>
      <div class="brand-text">
        <div class="brand-title">Associate</div>
        <div class="brand-sub">Study Academy</div>
      </div>
    </div>
    <div class="sidebar-scroll" id="sideNav"></div>
    <div class="sidebar-foot">
      <div class="streak-card">
        <div>
          <div class="label">Progress</div>
          <div class="val" id="sideFootVal">0 / 0</div>
        </div>
        <span class="pill accent">lessons</span>
      </div>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn hamburger" id="hamburger" aria-label="Menu"></button>
      <div class="crumb" id="crumb"></div>
      <div class="topbar-spacer"></div>
      <div class="progress-chip" title="Lessons studied">
        <svg class="ring" viewBox="0 0 22 22">
          <circle class="bg" cx="11" cy="11" r="9"/>
          <circle class="fg" id="ringFg" cx="11" cy="11" r="9" stroke-dasharray="56.5" stroke-dashoffset="56.5"/>
        </svg>
        <span class="pct" id="ringPct">0%</span>
      </div>
      <button class="search-trigger" id="searchBtn">
        <span style="display:flex;align-items:center;gap:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span></span>
        <span class="kbd">Ctrl K</span>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"></button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ==== icons.js ==== */

/* ============================== COURSE 2 ============================== */
{
  id: "c2", num: 2,
  title: "Prompting & Task Execution",
  tagline: "Getting a reliable first draft",
  blurb: "Structure beats eloquence. Five components, deliberate decomposition, diagnostic iteration, and matching prompt tightness to task type.",
  lessons: [

  {
    id: "c2l1", title: "Anatomy of an Effective Prompt", time: 11,
    sub: "The six components, and why the first three do most of the work",
    objectives: [
      "Name and order the six components of an effective prompt",
      "Diagnose which component is missing from a weak prompt",
      "Explain why exact word counts fail while structural limits hold"
    ],
    blocks: [
      {t:"p", html:"A prompt is not a wish — it is a <strong>brief</strong>. Six components turn a vague instruction into something a skilled colleague could execute without asking follow-up questions. Think of them as a checklist you run when output disappoints, not a ritual you perform every time."},

      {t:"h", html:"The six components"},
      {t:"table", head:["#","Component","What it answers","If missing"],
       rows:[
        ["1","<strong>Role</strong>","Who am I? (Financial Analyst, PM, Technical Architect, Policy Reviewer, Content Editor)","Generic vocabulary and depth; no point of view"],
        ["2","<strong>Context</strong>","What do I know? Audience, business situation, prior decisions, supporting docs, objectives","Claude assumes — the single most common cause of generic output"],
        ["3","<strong>Task</strong>","What should I do? Direct verb: Summarize, Compare, Draft, Extract, Audit","Claude answers a neighbouring question"],
        ["4","<strong>Constraints</strong>","Where are the boundaries? Length, tone, include/exclude, formatting rules","Wrong length, wrong register, wrong scope"],
        ["5","<strong>Output format</strong>","What shape should the answer take? Table, email, exec summary, bullets, 3-paragraph report","Rework; you re-paste the answer into shape yourself"],
        ["6","<strong>Examples</strong>","What does good look like? 1–2 worked examples (<em>few-shot</em>)","Tone and structure drift"]
       ]},

      {t:"callout", variant:"principle", title:"Why the first three dominate",
       body:"Role, Context and Task answer the three questions any competent professional asks before starting: <em>Who am I? What do I know? What should I do?</em> When they are absent Claude does not stop — it <strong>assumes</strong>. Assumption is the mechanism behind almost every 'generic' output."},

      {t:"h", html:"Ranking the components by leverage"},
      {t:"ul", items:[
        "<strong>Context</strong> is the highest-leverage fix in practice, because it is the thing that only exists in your head. Claude cannot see your meeting, your regulator, or last quarter's decision.",
        "<strong>Examples (few-shot)</strong> are often the single highest-impact addition. One bullet-style example steers tone and structure more reliably than a paragraph of adjectives like 'professional' or 'engaging'.",
        "<strong>Role</strong> is cheap to add and shapes vocabulary and depth, but it will not rescue missing context.",
        "<strong>Constraints and format</strong> mainly prevent rework — they rarely improve substance."
      ]},

      {t:"callout", variant:"exam", title:"Exam trap — word counts",
       body:"<strong>Word counts are targets, not limits.</strong> Models approximate length. 'Exactly 150 words' produces something in the neighbourhood, then you spend a turn correcting it. Use <strong>ranges</strong> ('roughly 100–150 words', 'three short paragraphs'). <strong>Structural</strong> constraints — number of bullets, number of sections, order of sections — are followed far more reliably than exact word counts."},

      {t:"h", html:"Delimiters and output shape"},
      {t:"p", html:"When you need to reuse the output programmatically or move it between systems, ask for it inside a delimiter: <code>&lt;summary&gt;…&lt;/summary&gt;</code> or <code>### SECTION ###</code>. This is not decoration — it prevents Claude's commentary from being mixed into the artefact you intend to paste elsewhere."},

      {t:"h", html:"Weak vs strong — the same request, twice"},
      {t:"compare",
       weak:"<strong>Prompt:</strong> 'Write a summary of our quarterly operations.'<br><br>No role, no context, no constraints, no format. The output will be a plausible, generic operations summary that could describe any company in any quarter — and you will rewrite all of it.",
       strong:"<strong>Role:</strong> Operations Analyst.<br><strong>Context:</strong> one-page update for the Regional Director, focused on throughput and cost.<br><strong>Task:</strong> summarise the attached Q3 data, covering only metrics that deviate more than 10% from target.<br><strong>Format:</strong> a headline plus three bullets.<br><br>Same request, five of six components present (no examples needed)."},

      {t:"callout", variant:"warn", title:"The strong prompt has a precondition",
       body:"'Only metrics deviating more than 10% from target' only works if the file is <strong>actually attached</strong> and actually <strong>contains targets</strong>. If it does not, Claude will infer plausible-looking targets or quietly drop the comparison. A precise instruction over missing data produces confident fiction — worse than a vague instruction, because it looks rigorous."},

      {t:"h", html:"Diagnosing a disappointing prompt"},
      {t:"p", html:"Run the six components as a checklist against the prompt you actually sent. Whichever component is absent or thin is your suspect. 'Analyze our sales data' contains a Task and nothing else — no role, no context, no audience, no format — which is why it returns a textbook-shaped answer rather than a decision-shaped one."}
    ],
    keyPoints: [
      "Official five components: Role, Context, Task, Constraints, Output format (examples are a useful extra).",
      "The first three answer Who am I / What do I know / What should I do — their absence causes assumption, which causes generic output.",
      "Few-shot examples are frequently the highest-impact single addition.",
      "Word counts are targets; ranges and structural limits are obeyed reliably.",
      "Delimiters keep the answer separate from Claude's commentary.",
      "Not every prompt needs all six — the list is a diagnostic checklist."
    ]
  },

  {
    id: "c2l2", title: "Breaking Down Complex Tasks", time: 9,
    sub: "Task decomposition, and why it is about reviewability rather than context limits",
    objectives: [
      "Explain the real rationale for decomposition",
      "Design a multi-step workflow with a review checkpoint after each step",
      "Avoid the fresh-conversation mistake"
    ],
    blocks: [
      {t:"p", html:"Decomposition means splitting a large request into smaller logical steps and running them <strong>one at a time</strong>, reviewing each intermediate result. The reason is not that Claude cannot hold a large request — modern context windows comfortably hold most business documents. The reason is <strong>reviewability and error isolation</strong>."},

      {t:"callout", variant:"principle", title:"The point of a step is the checkpoint after it",
       body:"If you cannot review the output of a step before it feeds the next, you have not decomposed anything — you have just written a longer prompt with numbering. Each step should end in an artefact a human can validate: a criteria list, a score table, a trade-off note."},

      {t:"h", html:"Worked example — vendor evaluation in four steps"},
      {t:"ol", items:[
        "<strong>Define criteria.</strong> Five to seven weighted criteria: cost, integration speed, support quality, migration risk, scalability. <em>Checkpoint:</em> are these the right criteria, and do the weights reflect actual priorities?",
        "<strong>Score vendors.</strong> A 1–5 scale per criterion in a comparison table with totals. <em>Checkpoint:</em> spot-check scores against actual vendor data — not against how the table reads.",
        "<strong>Identify trade-offs.</strong> Name the two criteria where scores differ most, and state the implications for timeline and budget. <em>Checkpoint:</em> this is the last cheap moment to catch an error before it influences the recommendation.",
        "<strong>Recommend.</strong> Justify against the criteria, scores and trade-offs; include rationale and note the risks."
      ]},
      {t:"p", html:"The ordering matters. <strong>If the criteria are wrong, fix them before scoring.</strong> Scoring against bad criteria produces a beautifully formatted wrong answer. Decomposition makes that visible early; a single mega-prompt hides it until the end."},

      {t:"h", html:"Three rules"},
      {t:"ul", items:[
        "<strong>Keep every step in the same conversation.</strong> A fresh chat for step 3 loses the criteria and scores from steps 1 and 2 — and Claude will invent replacements without telling you.",
        "<strong>Decompose for reviewability, not for size limits.</strong> The justification is control, not capacity.",
        "<strong>Catch errors early.</strong> A wrong criterion costs one correction; a wrong recommendation costs a meeting."
      ]},
      {t:"callout", variant:"exam", title:"Exam trap",
       body:"If a question asks <em>why</em> you decompose, the answer is <strong>reviewability and error isolation</strong> — not 'because Claude's context window is small'. That framing is a distractor."}
    ],
    keyPoints: [
      "Decompose for reviewability and error isolation, not context size.",
      "Each step ends in a checkable artefact.",
      "Fix criteria before scoring.",
      "Keep all steps in one conversation — a fresh chat loses the shared state.",
      "Catch errors early; the cheapest correction is the earliest one."
    ]
  },

  {
    id: "c2l3", title: "Improving Outputs Through Iteration", time: 10,
    sub: "Diagnose one component, fix one thing, and know when to stop",
    objectives: [
      "Refine a prompt by fixing a specific component rather than rewriting it",
      "Use reasoning-first and extended thinking to expose gaps",
      "Apply the stopping rule"
    ],
    blocks: [
      {t:"p", html:"The amateur move on a bad output is to rewrite the whole prompt. The professional move is to identify <strong>which component failed</strong> and change only that. Rewriting from scratch discards the parts that were working and makes it impossible to learn what actually helped."},

      {t:"h", html:"Two diagnostic techniques"},
      {t:"ul", items:[
        "<strong>Ask for reasoning first.</strong> 'Before answering, list the assumptions you are making and the parts of the brief that are underspecified.' Claude's own list usually names the missing component for you.",
        "<strong>Turn on extended thinking</strong> for multi-step analytical work. It gives the model room to reason before committing, and produces materially better depth on analysis, comparison and planning."
      ]},

      {t:"h", html:"Diagnosis table — symptom to fix"},
      {t:"table", head:["Symptom","Likely missing","Fix"],
       rows:[
        ["Output is generic","Context","Add audience, business situation, prior decisions"],
        ["Answers a different question","Task clarity","Restate the instruction with a direct verb and explicit scope"],
        ["Right content, wrong tone or length","Constraints","Add explicit, measurable constraints"],
        ["Only one section is weak","Partial prompt","Refine only that section's instruction"],
        ["Plausible but wrong fact, figure or citation","A gap the model filled","Supply the source; instruct it to answer only from that source and to say when information is absent"],
        ["Claude asks clarification or declines","Ambiguous or out-of-policy request","Restate scope and intended use"]
       ]},

      {t:"h", html:"The email example — three iterations, one gap each"},
      {t:"ol", items:[
        "<em>Iteration 1:</em> 'Write a follow-up email regarding a delayed deliverable.' → generic. Diagnosis: it has a <strong>Task only</strong>; context and constraints are missing.",
        "<em>Iteration 2:</em> add the two-day delay, the data-quality issue already resolved, the new date (Thursday), the tone (accountable, not grovelling), and roughly 100–120 words. → good, but no subject line. Diagnosis: <strong>format</strong> gap.",
        "<em>Iteration 3:</em> 'Add a subject line that emphasises resolution rather than delay.' → polished. Diagnosis: one narrow addition."
      ]},
      {t:"callout", variant:"tip", title:"Note what did not happen",
       body:"No iteration restarted the conversation. No iteration rewrote the earlier instructions. Each turn changed <strong>one</strong> thing, which is what makes it possible to know which change produced the improvement."},

      {t:"h", html:"Knowing when to stop"},
      {t:"p", html:"The goal is a <strong>usable outcome</strong>, not a perfect prompt. Refine only while each turn produces a meaningful improvement. When the last <strong>two</strong> iterations produced only cosmetic changes, stop iterating and do a final manual edit — you are now faster than the model."},
      {t:"callout", variant:"exam", title:"Exam trap",
       body:"Extended thinking is the first lever for 'lacks depth despite detailed instructions' — before swapping models. Reaching for a bigger model first is the classic wrong answer."}
    ],
    keyPoints: [
      "Do not rewrite the whole prompt — fix the specific failing component.",
      "Asking for assumptions up front reveals underspecification.",
      "Extended thinking for multi-step analytical work.",
      "Change one thing per iteration so you can attribute the improvement.",
      "Stop when two consecutive iterations are cosmetic only."
    ]
  },

  {
    id: "c2l4", title: "Adapting Prompts to Task Types", time: 9,
    sub: "Tighten or loosen — the same model needs different handling",
    objectives: [
      "Match prompt tightness to the task type",
      "Explain why temperature is not available in the Claude apps",
      "Apply research verification rules"
    ],
    blocks: [
      {t:"p", html:"One prompt style does not fit all work. The variable is <strong>how tightly you specify</strong> — and which parts you leave loose. Tighten what governs correctness; loosen what benefits from latitude."},

      {t:"table", head:["Task type","Tighten","Loosen","Why"],
       rows:[
        ["<strong>Analysis</strong>","Criteria, standards, scope","Wording and phrasing","Judgement must be applied against a fixed yardstick"],
        ["<strong>Research</strong>","Sources, citation requirements, the research question","Synthesis approach","Traceability is the product"],
        ["<strong>Drafting</strong>","Audience, tone, length, format","Word choice within the structure","Voice varies; structure must not"],
        ["<strong>Brainstorming</strong>","Goal and basic guardrails","Quantity, creativity, structure","Constraints suppress divergence"]
       ]},

      {t:"h", html:"Analysis"},
      {t:"p", html:"Instruct Claude to evaluate strictly against the stated criteria, ground every claim in the supplied data, and flag what the data does not support."},
      {t:"callout", variant:"exam", title:"Exam trap — temperature",
       body:"<strong>Temperature is an API parameter.</strong> It is not exposed in the Claude apps. 'Set creativity to low' is not a setting you can turn. The correct move is to instruct Claude to <em>evaluate strictly against stated criteria</em>, which is what low temperature would have approximated."},

      {t:"h", html:"Research"},
      {t:"p", html:"Specify the question, source requirements, citation style and boundaries. Then verify before you rely on it: training data has a cutoff, so prices, org structures, regulations and headcounts are silently out of date — silently is the operative word, because the prose does not become less confident."},
      {t:"ul", items:[
        "<strong>Web search must be available and explicitly requested.</strong> It is not an automatic behaviour.",
        "<strong>Citations must be opened and checked.</strong> A link can be real while the claim attached to it is not. This is one of the most common failure modes in AI-assisted research.",
        "<strong>Boundaries matter.</strong> 'Only sources published after 2024' filters noise better than cleaning it after the fact."
      ]},

      {t:"h", html:"Drafting"},
      {t:"p", html:"Fix audience, tone, length and format; allow flexibility in the wording inside that structure. Over-specifying the prose produces stiff output; under-specifying the audience produces the wrong register entirely."},

      {t:"h", html:"Brainstorming"},
      {t:"p", html:"State the goal and a few guardrails, then deliberately under-constrain. Excessive constraints reduce the range of ideas, which defeats the purpose. Generate broadly and filter later — filtering during generation is what kills the value."}
    ],
    keyPoints: [
      "Analysis: tighten criteria, standards, scope; loosen wording.",
      "Research: tighten sources, citations, question; loosen synthesis.",
      "Drafting: tighten audience, tone, format; loosen word choice.",
      "Brainstorming: tighten goals and guardrails; loosen quantity and creativity.",
      "Temperature is an API parameter, not an app setting.",
      "A real-looking citation does not mean the attached claim is real."
    ]
  }
  ]
},

/* ============================== COURSE 3 ============================== */
{
  id: "c3", num: 3,
  title: "Evaluating & Validating Output",
  tagline: "From plausible to verified",
  blurb: "Discernment and diligence: the three evaluation references, the four failure patterns, six grounding techniques, and the format reliability ladder.",
  lessons: [

  {
    id: "c3l1", title: "Discernment — Three Evaluation References", time: 10,
    sub: "'Looks good' is not an evaluation",
    objectives: [
      "Evaluate output against requirements, source material and professional standards",
      "Scale review depth to risk",
      "Classify output as ready, needs revision, or needs human override"
    ],
    blocks: [
      {t:"p", html:"The cost case is simple: one fabricated statistic that reaches a client or a regulator creates more work than the hours the draft saved. Blind trust is a bad trade at any scale. Two competencies carry the work — <strong>discernment</strong> (critically evaluate against requirements, source materials and professional standards) and <strong>diligence</strong> (know when extra verification is needed, and take responsibility for the final deliverable)."},

      {t:"h", html:"The three references"},
      {t:"ol", items:[
        "<strong>Requirements.</strong> Does it answer the request? Check <em>every</em> requirement. The classic trap: it addresses the main ask beautifully while silently skipping the secondary requirement buried in paragraph four of your prompt. Re-read your own brief, not just the output.",
        "<strong>Source material.</strong> Trace claims back to the original. Do not assume a quote or figure is right because it appeared in the uploaded file — Claude can misread tables, skip rows, misalign columns, and attribute a number to the wrong document. Verify the interpretation, not just the presence.",
        "<strong>Professional standards.</strong> Would this pass in your profession? Numbers without units, recommendations without reasoning, unverifiable citations. Fluent writing can fail all three, and fluency is precisely what makes the failure hard to see."
      ]},

      {t:"callout", variant:"principle", title:"Adjust the review to the risk",
       body:"High-risk work — legal review, financial analysis, compliance reporting — requires <strong>every claim verified</strong>. Low-risk work — idea generation, internal brainstorming — justifies a lighter pass. The question that sets the level is: <em>what happens if this is wrong?</em>"},

      {t:"h", html:"Three outcomes"},
      {t:"table", head:["Outcome","Meaning","Action"],
       rows:[
        ["<strong>Ready to use</strong>","Meets requirements, matches sources, meets standards","Release"],
        ["<strong>Needs revision</strong>","Useful, with identifiable and fixable gaps","Return with specific fixes"],
        ["<strong>Needs human override</strong>","High risk, significant uncertainty, or real business impact","Subject-matter expert reviews or takes over"]
       ]},

      {t:"callout", variant:"exam", title:"The completeness trap",
       body:"An output can be <strong>100% accurate and still useless</strong> — for example, a flawless market analysis that omits the competitor the client cares most about. Accuracy and completeness are separate tests, and completeness failures are harder to see because nothing in the document is wrong."}
    ],
    keyPoints: [
      "Three references: requirements, source material, professional standards.",
      "Check every requirement — secondary asks are skipped silently.",
      "Verification of source interpretation, not merely source presence.",
      "Three outcomes: ready / needs revision / needs human override.",
      "Accuracy without completeness is still a failure."
    ]
  },

  {
    id: "c3l2", title: "Hallucinations, Inconsistencies & Bias", time: 10,
    sub: "Four failure patterns and the signals that expose them",
    objectives: [
      "Recognise the four output failure patterns",
      "Apply the fabricated-statistic checklist",
      "Detect confirmation bias and capability hallucinations"
    ],
    blocks: [
      {t:"p", html:"The core difficulty: Claude writes with the <strong>same fluency whether it is right or wrong</strong>. Confidence is a property of the prose, not evidence of accuracy. Never let a well-formed sentence do the work of a verified one."},

      {t:"h", html:"Four patterns"},
      {t:"table", head:["Pattern","What it looks like","Detection"],
       rows:[
        ["<strong>Hallucination</strong>","Plausible claims with no support: invented statistics, dates, names, quotes, citations","Ask for the source; check it exists and says what is claimed"],
        ["<strong>Inconsistency</strong>","Long documents contradict themselves between sections","Ask Claude to list key claims as a numbered list; check any pair that conflicts"],
        ["<strong>Bias</strong>","Output skews toward the answer the prompt implied","Ask for arguments for <em>and</em> against; ask it to challenge its own recommendation"],
        ["<strong>Completeness failure</strong>","Finds several real findings but omits the most important one","Compare against your own domain knowledge and the original brief"]
       ]},

      {t:"h", html:"Confirmation bias"},
      {t:"p", html:"If your prompt strongly suggests a preferred conclusion, Claude may build the case for it. The remedy is structural: request the counter-case explicitly, or ask it to attack its own draft before finalising. Framing is not neutral, and the model inherits your framing."},

      {t:"h", html:"Capability hallucinations"},
      {t:"callout", variant:"warn", title:"The most overlooked category",
       body:"Claude may state or imply that it <strong>sent an email, saved a file, updated a record, or notified a colleague</strong> when no tool performed that action. Text describing an action is not the action. Verify externally that anything with side effects actually happened — this is a governance issue as much as an accuracy one."},

      {t:"h", html:"The fabricated statistic checklist"},
      {t:"p", html:"Consider: <em>“63% of mid-market SaaS companies adopted AI tools in 2025.”</em> The precision itself is a warning sign — real research usually hedges, and fabricated numbers rarely do."},
      {t:"ol", items:[
        "Is a source cited? If no — flag it.",
        "Is the precision disproportionate? ('63%' versus 'roughly two-thirds') Precision implies measurement.",
        "Does it appear in a trusted external source you can open?",
        "Any 'no' means treat as <strong>unverified</strong> until confirmed."
      ]},
      {t:"callout", variant:"exam", title:"Exam trap",
       body:"A confident tone does <strong>not</strong> indicate accuracy — the answer to 'confident tone means accurate, true or false?' is <strong>false</strong>. The style is identical in both cases."}
    ],
    keyPoints: [
      "Fluency is not evidence; confidence is not accuracy.",
      "Four patterns: hallucination, inconsistency, bias, completeness failure.",
      "Numbered claim list exposes internal contradictions.",
      "Ask for the counter-case to defuse confirmation bias.",
      "Capability hallucinations: verify side effects externally.",
      "Disproportionate precision with no source is a red flag."
    ]
  },

  {
    id: "c3l3", title: "Fact-Checking & Grounding", time: 11,
    sub: "Six techniques — all delivered through prompting, not product toggles",
    objectives: [
      "Apply the six grounding techniques",
      "Distinguish native citations (API) from a citations mode in the app",
      "Explain why self-verification is not verification"
