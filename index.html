        "Capabilities differ per connector and change with releases."
      ]},

      {t:"h", html:"Three boundaries worth memorising"},
      {t:"ol", items:[
        "<strong>Capability limits.</strong> Every connector has them. A mail connector may search and read emails but not send them. Hitting a limit is not a malfunction.",
        "<strong>Permissions.</strong> Connectors operate under the <strong>authorising user's own permissions</strong> — no more, no less. They do not grant access the user lacks.",
        "<strong>Data exchange.</strong> Content is exchanged with the third-party system as part of using the connector. That is inherent to the function, not a bug."
      ]},

      {t:"h", html:"Common challenges"},
      {t:"ul", items:[
        "<strong>Wrong connector path.</strong> Connect from the organisation's approved connector list — not by pasting an arbitrary custom MCP server URL found elsewhere. Admins can allowlist and block; if unsure, ask the workspace admin.",
        "<strong>Boundary confusion.</strong> Users assume malfunction when the connector has simply reached the limit of its permitted capabilities. Diagnosis, not escalation."
      ]},
      {t:"callout", variant:"tip", title:"How to read the classic exam stem",
       body:"'A connector can search messages but errors when asked to send one — what does that indicate?' Not a bug, not a permissions failure: it indicates the connector's <strong>defined capability boundary</strong>. The tool was never authorised to send."},

      {t:"h", html:"Managing uploaded knowledge"},
      {t:"p", html:"Keep it current: remove old documents, eliminate duplicate versions, replace outdated policies. Multiple versions of the same policy in one knowledge base is worse than none — Claude will retrieve the wrong one and sound equally confident either way."},
      {t:"callout", variant:"principle", title:"The trust test",
       body:"If you would not trust a colleague to use a document, remove it from the knowledge base. Stale knowledge is not neutral storage — it is an active source of wrong answers."}
    ],
    keyPoints: [
      "Connectors are account/org level, not project level.",
      "They act within the authorising user's permissions only.",
      "Capability limits (read but not send) are boundaries, not bugs.",
      "Use the approved connector list, never an arbitrary MCP URL.",
      "Duplicate and stale documents actively cause wrong answers."
    ]
  },

  {
    id: "c5l3", title: "Writing System-Level Instructions", time: 9,
    sub: "Measurable rules, not aspirations",
    objectives: [
      "Convert vague standards into observable criteria",
      "Write reusable guardrails that apply automatically"
    ],
    blocks: [
      {t:"p", html:"Project instructions define persistent behaviour for every conversation in the Project. The point is to stop retyping the same guidance and to stop depending on who remembered to include it."},
      {t:"callout", variant:"exam", title:"The governing principle",
       body:"<strong>Vague instructions produce inconsistent results — and they fail silently.</strong> 'Make it professional' has no observable criteria, so Claude interprets it differently each time and no reviewer can say whether it was followed."},

      {t:"h", html:"Weak versus strong"},
      {t:"compare",
       weak:"'Make the reports professional.'<br><br>'Professional' means different things to different people, there are no measurable criteria, it is interpreted differently each time, and compliance varies across conversations.<br><br>'Make reports accurate and high quality' has the same defect: it describes a desired <em>outcome</em> without <em>observable criteria</em>.",
       strong:"'Use formal language, define acronyms when first introduced, and keep paragraphs under four sentences.'<br><br>Specific, measurable, consistently followed, verifiable by any reviewer, predictable.<br><br>'For every metric, provide the source. Label unsupported figures as unverified. Start each report with a one-sentence summary headline.'"},

      {t:"h", html:"Reusable guardrails"},
      {t:"p", html:"A single well-written pair of sentences can carry a lot of governance: <em>'Cite the source document for every factual statement. If supporting evidence is unavailable, state that the information is unknown rather than guessing.'</em> That is grounding, citation practice and honesty about uncertainty, applied automatically to every response."},

      {t:"h", html:"Anticipating future use"},
      {t:"p", html:"Define tone, formatting, verification requirements and output expectations <strong>before</strong> the next person starts. Every standard you encode in advance is a round of editing that does not happen later."}
    ],
    keyPoints: [
      "Vague instructions fail silently and inconsistently.",
      "Observable criteria: measurable, verifiable, repeatable.",
      "Outcome language ('high quality') is not an instruction.",
      "Guardrails should encode citation, verification and uncertainty behaviour."
    ]
  },

  {
    id: "c5l4", title: "Maintaining Configurations", time: 10,
    sub: "Configuration drift is the silent killer",
    objectives: [
      "Build a review cadence tied to change, not the calendar alone",
      "Diagnose gradual quality degradation as drift",
      "State the hard limits of what configuration can do"
    ],
    blocks: [
      {t:"p", html:"Configuration is not permanent. It evolves with processes, documents and priorities. Without maintenance, a well-designed Project <strong>gradually</strong> produces lower quality — and because the decline is gradual, it is almost always misdiagnosed as a prompting problem."},

      {t:"h", html:"Cadence"},
      {t:"p", html:"There is no fixed rule that monthly is correct for every Project. Match the cadence to how often the underlying documents and processes change, and add <strong>event-driven reviews</strong>: fiscal year rollover, policy reissue, team change. A monthly default is reasonable; a trigger event always earns an extra review."},

      {t:"h", html:"What decays, element by element"},
      {t:"table", head:["Element","Decay","Fix"],
       rows:[
        ["<strong>Instructions</strong>","Process changed, reporting requirements evolved, tone standards updated, metrics renamed or retired","Review each cycle; update or remove stale rules. An outdated metric in an instruction produces <strong>silently incorrect output</strong> — the error is in the configuration, not the prompt"],
        ["<strong>Knowledge</strong>","Old documents, duplicate versions, superseded policies","Remove, deduplicate, replace. If you would not trust a colleague to use it, remove it"],
        ["<strong>Skills</strong>","Outdated procedure, wrong formatting, changed requirements, version misaligned with process","Check the Skill is current <strong>before</strong> troubleshooting the prompt — one of the most overlooked diagnostic steps"],
        ["<strong>Memory</strong>","Stakeholders left, decisions reversed, preferences changed","View, edit, delete. There is <strong>no backup</strong> — if you need a record outside the product, copy it out manually"]
       ]},
      {t:"callout", variant:"warn", title:"No backup for memory",
       body:"Supported actions are <strong>view, edit, delete</strong>. Nothing else. Accuracy matters more than quantity — a small accurate memory beats a large stale one."},

      {t:"h", html:"The drift scenario"},
      {t:"p", html:"A recurring reporting Project starts producing subtle errors. The instructions reference a metric that was renamed eight months ago; the knowledge base holds three versions of the template; memory includes a stakeholder who left the company."},
      {t:"callout", variant:"principle", title:"The fix is maintenance, not prompt engineering",
       body:"Update the instructions, remove the outdated templates, clean the memory. No prompt changes were needed. <strong>When quality degrades gradually, investigate configuration drift before rewriting prompts.</strong>"},

      {t:"h", html:"Hard limits"},
      {t:"ul", items:[
        "A configured Project reduces variance — it does <strong>not</strong> remove the need for judgement or verification.",
        "Never put secrets, credentials or regulated personal data into instructions, knowledge or memory. These are configuration surfaces, not secure storage.",
        "A configured Project does <strong>not</strong> grant autonomous action. Claude acts within a conversation when prompted — configuration changes behaviour, not initiative."
      ]}
    ],
    keyPoints: [
      "Without maintenance, quality degrades gradually — this is drift.",
      "Match cadence to change frequency, plus event-driven reviews (fiscal rollover).",
      "Stale instruction metrics cause silently wrong output.",
      "Check Skill currency before blaming the prompt.",
      "Memory: review, edit, delete; export as a backup before a major change; reset if it misleads.",
      "Config is not secure storage and does not grant autonomy."
    ]
  }
  ]
},

/* ============================== COURSE 6 ============================== */
{
  id: "c6", num: 6,
  title: "Governance, Risk & Responsible Use",
  tagline: "Everyone's daily decisions, not a policy team's job",
  blurb: "Use-case classification, Skill and connector trust, data sensitivity, escalation routes and the four ethical areas.",
  lessons: [

  {
    id: "c6l1", title: "Appropriate vs Inappropriate Use Cases", time: 12,
    sub: "Four criteria, three classifications, one real review gate",
    objectives: [
      "Classify a use case as fully appropriate, human-reviewed, or inappropriate",
      "Apply the four criteria including the human-element override",
      "Specify what makes a review gate valid"
    ],
    blocks: [
      {t:"p", html:"A single misuse can set an adoption programme back years: sensitive information uploaded to the wrong place, an unreviewed Skill, a policy violated without anyone noticing. Can force an organisation to suspend AI use entirely. Governance is how that is prevented — and it is built from daily decisions, not policy documents."},

      {t:"h", html:"Four evaluation criteria"},
      {t:"table", head:["Criterion","Question","Reading"],
       rows:[
        ["<strong>Reversibility</strong>","Can the mistake be corrected before harm?","Internal summary — easily redone. Client report — cannot be unsent. Regulatory filing — legally binding, stop."],
        ["<strong>Consequence of error</strong>","How bad is it?","Low: minor inconvenience. Medium: reputational risk, rework. High: financial loss, legal exposure, safety impact. High-consequence work is <em>not</em> automatically off-limits — it requires <strong>mandatory human review as a control</strong>."],
        ["<strong>Need for human creativity or empathy</strong>","Does this need judgement, emotional intelligence, personal accountability?","A condolence message may be low-risk and reversible, but empathy and relationship management are the whole point. <strong>This criterion can override all the others.</strong>"],
        ["<strong>Accountability</strong>","Who is responsible?","Stays with the individual and organisation. A qualified reviewer's approval reduces risk; it does not move ownership."]
       ]},
      {t:"callout", variant:"exam", title:"Course 4 versus Course 6 criteria",
       body:"Course 4 delegation uses <strong>reversibility, stakes, accountability, data sensitivity</strong>. Course 6 use-case evaluation uses <strong>reversibility, consequence of error, human creativity/empathy, accountability</strong>. The notes describe the Course 6 set as a course construct layered on the delegation competency — do not cite it as official framework terminology."},

      {t:"h", html:"Three classifications"},
      {t:"table", head:["Classification","Profile","Examples","Gate"],
       rows:[
        ["<strong>Fully appropriate</strong>","Low risk, reversible, no significant human judgement","Drafting FAQs from approved documents; organising information for internal use","Standard quality review. No special gate — meaning review is not <em>mandatory</em>, not that it never happens"],
        ["<strong>Appropriate with human review</strong>","AI assists, human oversight mandatory","Resume screening, customer communications, financial summaries, employee-facing content","A defined review gate before use"],
        ["<strong>Inappropriate</strong>","The decision itself cannot be delegated, regardless of AI quality","Final medical decisions, final legal determinations, benefits eligibility decisions, work requiring professional accountability","Never delegated. A responsible professional makes and owns the determination"]
       ]},
      {t:"callout", variant:"warn", title:"The distinction that gets tested",
       body:"Inappropriate is <strong>not</strong> 'high-risk work that needs more review'. It is work where the <strong>decision itself</strong> cannot be delegated at all. 'Appropriate with human review' is high-risk work that remains permissible because a qualified human makes the call."},

      {t:"h", html:"What makes a review gate valid"},
      {t:"p", html:"'Human review' is a phrase until it is specified. A functioning gate defines five things:"},
      {t:"ol", items:[
        "<strong>Who</strong> reviews — a named role, not 'someone'.",
        "<strong>What</strong> is reviewed — accuracy, bias, completeness, compliance.",
        "<strong>When</strong> — <em>before</em> use, not after.",
        "<strong>How it is evidenced</strong> — sign-off, ticket, version note.",
        "<strong>What happens on rejection</strong> — escalate, rework, abandon."
      ]},
      {t:"callout", variant:"principle", title:"A gate with no rejection path is a formality",
       body:"If nothing can happen when the reviewer says no, and no outcome is recorded, the gate cannot be tested in an audit. That is not a control — it is a gesture."},

      {t:"h", html:"Applied"},
      {t:"table", head:["Use case","Classification","Reasoning"],
       rows:[
        ["Internal FAQ generation from approved policy docs","Fully appropriate","Low risk, easily reviewed, supported by source"],
        ["Resume screening","Appropriate with human review","Fairness and bias exposure; hiring decisions stay with human recruiters"],
        ["Final medical or legal determination","Inappropriate","Irreversible; professional accountability cannot transfer"],
        ["Billing complaint responses","Appropriate with human review","Gate: agent verifies account info, reviews wording and tone, sends only after approval"]
       ]}
    ],
    keyPoints: [
      "Four criteria: reversibility, consequence, human creativity/empathy, accountability.",
      "The human-element criterion can override the others.",
      "Three classifications: fully appropriate, human review, inappropriate.",
      "Inappropriate means the decision cannot be delegated at all.",
      "A valid gate defines who, what, when, how evidenced, and rejection handling."
    ]
  },

  {
    id: "c6l2", title: "Skill Trust & Feature-Level Risk", time: 11,
    sub: "Treat a Skill as software — because it is",
    objectives: [
      "Apply source / reach / appropriateness to a Skill or connector",
      "Explain prompt injection from untrusted content",
      "Recognise connectors as the highest-reach surface"
    ],
    blocks: [
      {t:"p", html:"A Skill is a package: instructions, optional files, sometimes scripts. The instructions enter the model's context as <strong>trusted guidance</strong>, and any bundled code runs in the code execution environment. It is not a setting — it is software with access."},
      {t:"callout", variant:"warn", title:"The risk is not only what it can see",
       body:"A poorly built or malicious Skill can <strong>act</strong> on session data: transform it, write it to a file, pass it to a tool. 'It only reads the document' understates the risk if it can also transmit the result. Existing in a library is not evidence of trustworthiness."},

      {t:"h", html:"Three-part trust evaluation"},
      {t:"table", head:["Part","Question","Judgement"],
       rows:[
        ["<strong>1. Source</strong>","Who published it?","Organisation or approved vendor → fine. Known third party → review before enabling. Unknown publisher or unclear origin → escalate or decline."],
        ["<strong>2. Reach</strong>","What can it access, and what can it <em>do</em> with that access?","It inherits the session's <strong>visibility</strong> (what it can see) and separately its <strong>capability</strong> (transform, save, transmit). Read plus write to sensitive data is far riskier than read alone."],
        ["<strong>3. Appropriateness</strong>","Is this the only capability the task needs?","<strong>Least privilege.</strong> A document-formatting Skill should not need access to an entire Drive. Permissions that exceed the task → escalate or decline."]
       ]},
      {t:"p", html:"Also check: does it bundle executable code? Is it admin-approved or allow-listed? Which external services or connectors does it call? How is it versioned and updated? <strong>An approved Skill can change after review</strong> — that is exactly the moment a 'safe' Skill becomes an incident."},

      {t:"h", html:"Outcomes"},
      {t:"ul", items:[
        "<strong>Enable</strong> — trusted source, appropriate permissions, capability matches the need.",
        "<strong>Escalate</strong> — useful but needs security or governance review.",
        "<strong>Decline</strong> — source unvalidated, or access disproportionate to the task."
      ]},
      {t:"p", html:"Example: a Document Formatting Skill from a trusted internal source → enable. An 'Analytics Booster' from an unknown publisher requesting broad access → escalate or decline."},

      {t:"h", html:"Prompt injection"},
      {t:"callout", variant:"warn", title:"The single most common real-world governance failure",
       body:"Instructions can be embedded in any material Claude reads: an uploaded PDF, a web page, a connector record, a comment in a shared document. That text is <strong>data, never a command</strong>.<br><br>Practical rule: content telling the assistant to ignore prior instructions, change permissions, or send data somewhere is <strong>surfaced to a human</strong>, never obeyed."},

      {t:"h", html:"Connectors and MCP — the highest-reach feature"},
      {t:"p", html:"Same three-part review, higher stakes. A connector grants <strong>standing access</strong> to a system — mail, files, ticketing, CRM — rather than a single upload. Ask: who authorised the connection, what scopes were granted, is it read or write, and how is it revoked?"}
    ],
    keyPoints: [
      "A Skill is software: instructions as trusted guidance, code in the execution environment.",
      "Trust = source + reach (see AND do) + appropriateness (least privilege).",
      "Existing ≠ trustworthy; approved Skills can change after review.",
      "Prompt injection: embedded instructions are data, never commands.",
      "Connectors grant standing access — the highest-reach surface."
    ]
  },

  {
    id: "c6l3", title: "Data Sensitivity, Privacy & Controls", time: 12,
    sub: "Green, yellow, red — and why a credential is different in kind",
    objectives: [
      "Classify data and route it correctly",
      "Apply the redaction test",
      "State what sandbox, memory and incognito do and do not protect"
    ],
    blocks: [
      {t:"p", html:"Before uploading anything, identify its sensitivity. This is one of the highest-value governance habits, and it costs about ten seconds."},
      {t:"callout", variant:"exam", title:"It is a course model, not a standard",
       body:"Green / Yellow / Red is an <strong>illustrative model</strong> — not an Anthropic taxonomy and not an industry standard. You are expected to map it onto your organisation's labels, e.g. Public / Internal / Confidential / Restricted."},

      {t:"table", head:["Tier","Contents","Action"],
       rows:[
        ["<strong>Green — safe to use</strong>","Public information, published documents, aggregated or anonymised data, materials approved for broad sharing","Use freely with standard quality review. Still be purposeful — do not upload more than the task requires"],
        ["<strong>Yellow — review first</strong>","Internal documents, contact information, draft announcements, unreleased project information","Check organisational policy before uploading. Consider whether <strong>redaction</strong> can reduce the tier. This is the <em>pause and check</em> tier — most governance mistakes are Yellow data treated as Green without review"],
        ["<strong>Red — restricted</strong>","<strong>Regulated:</strong> health, financial, government-regulated. <strong>Contractual:</strong> NDA-bound material, customer data under a processing agreement. <strong>Secrets:</strong> credentials, keys, tokens","Do not upload unless an approved pathway exists"]
       ]},
      {t:"callout", variant:"warn", title:"Credentials are different in kind",
       body:"A regulated document might be usable through an approved pathway. A password or API key must <strong>never</strong> be pasted into Claude under any circumstance. This is an absolute never-paste rule, not a sensitivity tier you can negotiate upward."},

      {t:"h", html:"Redaction and anonymisation"},
      {t:"ul", items:[
        "Remove unnecessary sensitive details before upload: names, account numbers, identifiers, personal details.",
        "Replace names with labels — 'Customer A', 'Customer B' — which preserves analytical value while reducing risk.",
        "<strong>Partial redaction</strong> risk: removing the name but leaving a unique identifier can still re-identify the individual.",
        "<strong>Over-redaction</strong>: if the task genuinely needs the sensitive detail, redaction does not solve the problem — use an approved pathway or do not upload."
      ]},
      {t:"callout", variant:"tip", title:"The redaction test",
       body:"Could someone re-identify the individual from what remains? If yes, the redaction is incomplete."},

      {t:"h", html:"Feature controls and their limits"},
      {t:"table", head:["Control","What it protects","What it does not"],
       rows:[
        ["<strong>Code execution sandbox</strong>","The host system, from code execution. Isolated, session-scoped; uploaded files available for the session; outputs generated there","The <strong>data</strong>. Red-tier content is still Red once uploaded — sandboxing does not downgrade sensitivity. Review file <em>contents</em>, not the filename"],
        ["<strong>Memory controls</strong>","Gives you view / edit / delete, and per-project scoping where available","Automatic exclusion. Behaviour differs by plan and admin config. If sensitive information entered memory, check and clear it"],
        ["<strong>Incognito mode</strong>","Prevents the session appearing in memory and chat history","Organisational retention requirements. Conversation is not saved, so you cannot retrieve it later — which matters when a record of an AI-assisted decision is itself a compliance requirement. Enterprise logging and audit obligations continue independently"]
       ]},
      {t:"callout", variant:"principle", title:"Incognito does not make data safe",
       body:"The first question is always: <em>is this information approved for use with Claude?</em> Only after that is answered do features like Incognito become relevant. Privacy features change where a record lives; they do not change whether the data was permitted."}
    ],
    keyPoints: [
      "Classify before upload: Green / Yellow / Red, mapped to your org's labels.",
      "Red splits into regulated, contractual and secrets.",
      "Credentials: absolute never-paste — not a tier.",
      "Redaction test: can the person be re-identified?",
      "Sandbox protects the host, not the data.",
      "Incognito does not override retention or make data approved."
    ]
  },

  {
    id: "c6l4", title: "Organisational Policies & Diligence", time: 6,
    sub: "Audits, escalation and staying current",
    objectives: [
      "Describe usage audits and their common gaps",
      "State the escalation route for a suspected breach"
    ],
    blocks: [
      {t:"p", html:"A policy is only valuable when it is consistently followed. Governance is applying it repeatedly in everyday decisions — not acknowledging it once during onboarding."},
      {t:"h", html:"Usage audits"},
      {t:"p", html:"Periodically compare actual usage against policy. The recurring gaps are consistent:"},
      {t:"ul", items:[
        "Uploading restricted information",
        "Enabling Skills without review",
        "Skipping mandatory human-review checkpoints"
      ]},
      {t:"h", html:"Escalation"},
      {t:"callout", variant:"warn", title:"Do not wait for the audit",
       body:"If you realise restricted data was uploaded or a policy was breached, report it through your organisation's <strong>incident channel</strong> immediately. Incident reporting is the one governance behaviour you may need on day one — never leave it implicit."},
      {t:"p", html:"And stay current: capabilities and policies both evolve. New features create new surfaces; updated policies change what is permitted; emerging governance requirements change what must be evidenced."}
    ],
    keyPoints: [
      "Audit actual usage against policy periodically.",
      "Known gaps: restricted uploads, unreviewed Skills, skipped review gates.",
      "Report breaches immediately via the incident channel.",
      "Capabilities and policies both change — keep current."
    ]
  },

  {
    id: "c6l5", title: "Ethical Implications", time: 9,
    sub: "Four areas, and the most frequent risk of all",
    objectives: [
      "Apply fairness, transparency, reliability and grey-area reasoning",
      "Decide when disclosure is required"
    ],
    blocks: [
      {t:"p", html:"Ethical risk rarely announces itself. It appears inside ordinary-looking outputs — a screening summary, a performance note, a recommendation — which is why it needs ongoing review rather than a one-time policy sign-off."},
      {t:"p", html:"<strong>Factual reliability is the most frequent day-to-day risk</strong>: fluent, confident, wrong; misattributed or fabricated citations. Every review gate in this course depends on somebody actually checking the quoted figure against the original."},

      {t:"h", html:"Four ethical areas"},
      {t:"table", head:["Area","What to watch","Practice"],
       rows:[
        ["<strong>Bias & fairness</strong>","Bias entering through prompt wording, problem framing, or generated recommendations. Extra care for people decisions: hiring, evaluation, communication","Ask whether individuals or groups are treated fairly and whether anything creates unintended disadvantage. Watch for language favouring one group, screening criteria that disproportionately exclude, recommendations reflecting prompt bias rather than balanced analysis"],
        ["<strong>Transparency & disclosure</strong>","Whether the audience knows AI was involved","Likely required when contracts or procurement policies mandate it, regulatory frameworks require AI transparency, or the audience reasonably expects human authorship. Good practice even when not required: internal deliverables colleagues assume are human-only; outputs influencing people decisions"],
        ["<strong>Factual reliability</strong>","Quoted statistics, citations, key figures","Add a 'verify before you rely' step. Are quoted statistics traceable to a named source? Do citations point to real, accessible documents? Have key figures been cross-checked against original data? Does the output match your professional knowledge?"],
        ["<strong>Grey-area reasoning</strong>","Situations with no policy answer","Ask: who is affected? What potential harm? What outcome would be fair? What level of disclosure is appropriate? <strong>Documenting this reasoning creates a defensible decision process</strong>"]
       ]},
      {t:"callout", variant:"principle", title:"When in doubt, disclose",
       body:"The reputational cost of undisclosed AI discovered later far exceeds the cost of disclosure. Transparency is almost always the cheaper error."},

      {t:"h", html:"Example — performance reviews"},
      {t:"p", html:"A manager drafts performance-review summaries from personal notes. The relevant controls are: verify fairness, check consistency across employees, review tone, and confirm accuracy. The manager remains responsible for the final review — the drafting assistance changes nothing about that."}
    ],
    keyPoints: [
      "Factual reliability is the most common day-to-day ethical risk.",
      "Four areas: bias/fairness, transparency, reliability, grey-area reasoning.",
      "Disclose when required, and when in doubt.",
      "Document grey-area reasoning to make the decision defensible."
    ]
  }
  ]
},

/* ============================== COURSE 7 ============================== */
{
  id: "c7", num: 7,
  title: "Troubleshooting & Optimization",
  tagline: "Diagnose the cause, then fix it once",
  blurb: "Five failure patterns keyed to timing, a cheapest-first diagnostic sequence, feedback loops that promote fixes into configuration, and workflow optimisation.",
  lessons: [

  {
    id: "c7l1", title: "Diagnosing Underperforming Outputs", time: 13,
    sub: "Five failure patterns — timing is the first clue",
    objectives: [
      "Identify the five failure patterns from their symptoms and timing",
      "Run the seven-step diagnostic sequence in order",
      "Distinguish ordinary non-determinism from stale configuration"
    ],
    blocks: [
      {t:"p", html:"Two ineffective reactions dominate. The first is concluding Claude cannot do the task. The second is changing prompts at random until something works — which occasionally succeeds and teaches you nothing. Troubleshooting is: <strong>identify the real cause, apply the correct fix</strong>."},
      {t:"callout", variant:"exam", title:"Timing is the first diagnostic clue",
       body:"Before reading the symptom in detail, ask <strong>when</strong> the problem appears. Wrong from the very first response points somewhere completely different from 'started strong, then degraded'. Timing narrows the pattern faster than any other signal."},

      {t:"h", html:"Five failure patterns"},
      {t:"table", head:["Pattern","Timing","Symptoms","Cause","Fix"],
       rows:[
        ["<strong>1. Under-specification</strong>","Wrong from the first response","Disappointing, generic, key details missing","Missing context, constraints, audience, output specs","Add the missing information — most common and usually easiest"],
        ["<strong>2. Context overload</strong>","Starts strong, then degrades","Forgets earlier instructions, formatting drifts, quality declines","Exceeds the context window; earliest turns fall out of scope; instruction-to-content ratio dilutes","Start a fresh conversation, write the summary yourself, reload essential context. <strong>A better prompt will not solve it</strong>"],
        ["<strong>3. Wrong feature or model</strong>","Specific error, every time","Calculations slightly wrong; analysis shallow despite detailed instructions","Text generation used for arithmetic; lightweight model for complex analysis; no extended thinking for multi-step reasoning","Select the right capability. For 'lacks depth despite detail', <strong>extended thinking is the first lever</strong> — before any model swap"],
        ["<strong>4. Stale configuration</strong>","Worked before, not now — consistently","Formatting or knowledge outdated","Drift in instructions, knowledge, Skills, config","Review and update the Project configuration"],
        ["<strong>5. Task-fit mismatch</strong>","Impossible regardless of wording","Asked for a single precise future number, or an action outside tool capability","A mismatch no prompt can fix","<strong>Reframe</strong> — ask for a range, key factors, or scenarios instead of one guaranteed figure"]
       ]},
      {t:"callout", variant:"warn", title:"Do not mistake variance for drift",
       body:"Outputs are non-deterministic. A single weaker run is not evidence of stale configuration. Reserve diagnosis 4 for a <strong>consistent, repeatable</strong> drop — not a one-off. Misdiagnosing ordinary variance sends you rewriting a configuration that was fine."},

      {t:"h", html:"The seven-step diagnostic sequence"},
      {t:"p", html:"Work in order. Most problems are solved in steps 1–5, and step 7 is a last resort rather than a starting hypothesis."},
      {t:"ol", items:[
        "<strong>Revisit the prompt.</strong> Missing context? Unclear constraints? Output format specified? Detailed enough?",
        "<strong>Check conversation length.</strong> Very long? Stopped following earlier instructions? Restart with a concise summary of the work so far. Note: <strong>no summariser silently rewrites history</strong> — nothing prunes the conversation for you.",
        "<strong>Verify feature and model.</strong> Does it need code execution, a more capable model, extended thinking, or a different capability?",

/* ============================== MODULE 1 ============================== */
{
  id: "m1", num: 9,
  title: "AI Capabilities & Limitations",
  tagline: "The machine properties your skills respond to",
  blurb: "Four properties, each a continuum of capability and limitation. Learn to place a task on each one, and your verification effort stops being guesswork.",
  lessons: [

  {
    id: "m1l1", title: "Generative AI & Next Token Prediction", time: 11,
    sub: "Why fluency and fabrication come from the same mechanism",
    objectives: [
      "Distinguish generative AI from classification and prediction systems",
      "Explain how next-token prediction produces both fluency and hallucination",
      "Understand sampling knobs and where to place verification effort"
    ],
    blocks: [
      {t:"p", html:"Most AI you already use — spam filters, recommendations, fraud detection — <strong>classifies, ranks or predicts</strong>. It sorts inputs into buckets. Generative AI does something different: it <strong>produces new content, one token at a time</strong>. That single change is the source of everything in this module, including every way it fails."},

      {t:"callout", variant:"principle", title:"The four properties",
       body:"Every capability and every limitation traces back to four properties, and each is a <strong>continuum</strong> — capability at one end, limitation at the other: <strong>Next Token Prediction</strong> (where answers come from), <strong>Knowledge</strong> (what it actually knows), <strong>Working Memory</strong> (what it is paying attention to now), and <strong>Steerability</strong> (how much you are in control)."},

      {t:"h", html:"Property 1 — Next Token Prediction"},
      {t:"p", html:"Claude is closer to <strong>sophisticated autocomplete</strong> than to a search engine. It writes word by word, each token drawn from what tends to follow what came before. There is no lookup, no database, no internal fact-checker."},
      {t:"table", head:["Capability zone","Limitation zone"],
       rows:[
        ["Fluent text in any style or register","<strong>Hallucination</strong> — a plausible continuation that simply is not true"],
        ["Fast synthesis across fields","<strong>Confabulation</strong> — filling a gap with plausible material instead of flagging it"],
        ["Strong on familiar, well-worn tasks","<strong>Inconsistency</strong> — sampling means the same prompt gives different answers"],
        ["Coherent continuation of long material","<strong>Misplaced confidence</strong> — smooth prose wrapped around a guess"]
       ]},
      {t:"callout", variant:"exam", title:"Where fabrication concentrates",
       body:"Specificity. Names, dates, statistics, citations, URLs and quotes are where fabrication lives, because those are exactly the tokens that have many plausible continuations and few consequences for the model. <strong>The more precise the claim, the more verification it earns.</strong> A summary's overall gist is usually safe because summarising is a well-worn path; its precise figures are not."},

      {t:"h", html:"Sampling — the randomness knob"},
      {t:"p", html:"A model turns its internal probability distribution into an actual word by <strong>sampling</strong> from it. Three knobs shape that sampling:"},
      {t:"ul", items:[
        "<strong>Temperature</strong> — low is focused and repetitive; high is varied and random.",
        "<strong>Top-k</strong> — keep only the k most likely candidates.",
        "<strong>Top-p</strong> — keep the smallest set of candidates whose probabilities sum to p (e.g. 0.9). It <em>adapts</em> to confidence: a broad set when the model is unsure, a narrow one when it is certain."
       ]},
      {t:"p", html:"This is why identical prompts produce different outputs. Variation is not a bug to be eliminated; it is the mechanism working. It also explains why a single good result is not proof — run the same high-stakes prompt two or three times and compare the claims."},
      {t:"p", html:"Historically the sampling step is old: Markov chains in 1906, n-gram phone keyboards around 2010, RNNs around 2015, transformers in 2017. What changed is how the probability distribution is computed — the model reads the <strong>entire conversation</strong>, not just the last word. The sampling step itself is the same."},
      {t:"callout", variant:"tip", title:"The 4D link",
       body:"Next token prediction is the foundation of <strong>Discernment</strong>. You cannot verify by tone, because tone is generated by the same process whether the content is true or invented."}
    ],
    keyPoints: [
      "Generative AI produces tokens; it does not classify or look up.",
      "Fluency and hallucination are the same mechanism, differently lucky.",
      "Confabulation = filling gaps instead of saying 'I do not know'.",
      "Fabrication concentrates in specifics: names, dates, stats, citations, URLs, quotes.",
      "Sampling (temperature, top-k, top-p) makes variation inherent.",
      "NTP is the foundation of Discernment."
    ]
  },

  {
    id: "m1l2", title: "Knowledge — and What It Cannot Know", time: 10,
    sub: "Frozen at the cutoff, uneven in coverage, silent about its sources",
    objectives: [
      "Explain the knowledge cutoff and its practical consequences",
      "Describe embeddings and retrieval in plain terms",
      "Choose between web search, retrieval and tool use"
    ],
    blocks: [
      {t:"p", html:"Claude knows only what was in its training data, frozen at a <strong>knowledge cutoff</strong>. There is no live browsing by default. The useful question is therefore not <em>'does it know this?'</em> but <em>'how well-represented was this in what it read?'</em>"},

      {t:"table", head:["Capability zone","Limitation zone"],
       rows:[
        ["Broad general knowledge","<strong>Knowledge cutoff</strong> — anything after the cutoff simply does not exist for the model"],
        ["Depth in well-represented domains","<strong>Staleness</strong> — prices, org charts, regulations drift while the prose stays confident"],
        ["Cross-field connections via embeddings","<strong>Uneven coverage</strong> — niche, local and specialist topics are thin"],
        ["Fast orientation in a new field","<strong>Inherited bias</strong> — defaults reflect blind spots in the training data"],
        ["","<strong>Source amnesia</strong> — 'I read it somewhere' is not a citation"]
       ]},

      {t:"h", html:"Embeddings — meaning as position"},
      {t:"p", html:"Old search matched strings: searching 'car' missed 'automobile', and engineers patched it with hand-written synonyms and stemming rules. <strong>Embeddings</strong> replaced that with something better: text becomes a <strong>fixed-length vector of numbers</strong> — say 1,024 values — so that meaning becomes a <em>place</em>. Similar concepts land near each other, and the mapping is learned, not hand-authored."},
      {t:"ul", items:[
        "Any text in — three words or three paragraphs — becomes the same length vector.",
        "The dimensions are unlabeled and emergent. You cannot point at 'dimension 847' and name it.",
        "<strong>Similarity search</strong> embeds the question and retrieves the nearest k items.",
        "Closeness is measured by <strong>cosine similarity</strong>: −1 opposite, 0 unrelated, 1 identical."
       ]},
      {t:"p", html:"This is the machinery behind retrieval — <strong>RAG</strong> (retrieval-augmented generation) fetches relevant documents into the context window before the model answers. It is also why a Project's knowledge base can scale: the model stops holding everything and starts <em>searching</em>."},

      {t:"h", html:"Mitigations, matched to the failure"},
      {t:"table", head:["Failure","Mitigation"],

        ["Time-sensitive facts (post-cutoff)","<strong>Web search</strong> — a per-chat toggle on all plans; on Team/Enterprise an owner enables it for the workspace first"],
        ["Material the model was never trained on","<strong>Retrieval / RAG</strong>, or a connector via <strong>MCP</strong>"],
        ["Anything needing precision","<strong>Tool use</strong> — calculators, databases, APIs, code execution"],
        ["Uncertainty about recency","<strong>Explicit cutoff disclosure</strong> — ask it to say what it cannot know"]

       body:"A larger context window does <strong>not</strong> help with post-cutoff facts. Context is Working Memory; the cutoff is Knowledge. If a question is about last week's news, the correct answer is web search — not 'use a bigger window' or 'use a better model'."},
      {t:"callout", variant:"tip", title:"The 4D link",
       body:"Knowledge is central to <strong>Delegation</strong>: deciding whether to hand the task over, supply context, connect a source, or do it elsewhere entirely."}
    ],
    keyPoints: [
      "Knowledge is frozen at the cutoff; there is no browsing by default.",
      "Ask how well-represented the topic was, not whether the model knows it.",
      "Embeddings turn meaning into position; cosine similarity measures closeness.",
      "RAG retrieves relevant documents into context.",
      "Match the mitigation: web search for recency, retrieval for private material, tools for precision.",
      "The cutoff is Knowledge; a bigger context window will not fix it."
    ]
  },

  {
    id: "m1l3", title: "Working Memory & the Context Cliff", time: 10,
    sub: "Why the middle of your document disappears",
    objectives: [
      "Explain the context window and why it fails abruptly",
      "Apply primacy–recency placement to long prompts",
      "Recognise that corrections change context, not the model"

    blocks: [
      {t:"p", html:"Everything the model can attend to sits in a fixed-size <strong>context window</strong>. Nothing outside it exists for the model at that moment. This is the property where the failure mode is different from the others: it is a <strong>cliff, not a slope</strong>. The first three properties degrade gradually; working memory works right up until it does not."},

      {t:"table", head:["Capability zone","Limitation zone"],
       rows:[
        ["Rapid in-session adaptation — a style guide applies immediately","<strong>Hard length limits</strong> and <strong>silent truncation</strong>; you may never be warned"],
        ["Works with <em>your</em> material, not the training corpus","<strong>Lost in the middle</strong> — attention is not uniform across the window"],
        ["Context is leverage: supplying the right material is the highest-leverage act available","<strong>No persistent memory by default</strong> — each session starts at zero"],
        ["","<strong>No learning from you</strong> — a correction changes the context, never the model"]
       ]},

      {t:"h", html:"The U-curve"},
      {t:"p", html:"Human memory shows a serial position effect: we remember the beginning and the end, and lose the middle. LLMs show the <strong>same U-curve</strong>."},
      {t:"callout", variant:"exam", title:"Lost in the middle",
       body:"The finding (Liu et al., 2023, Stanford): when the key fact sits in the <strong>middle</strong> of a long context, accuracy drops by <strong>30% or more</strong>. The practical rule follows directly — put critical instructions at the <strong>beginning and again at the end</strong>, and restate must-follow constraints near the close."},

      {t:"h", html:"Context engineering"},
      {t:"p", html:"More context does not mean better results. <strong>Context engineering</strong> is the discipline of deciding what to include, where to place it, and — hardest of all — what to leave out. Curate ruthlessly, place strategically, and repeat what matters."},
      {t:"ul", items:[
        "Front-load the material that must shape the answer.",
        "Chunk long work rather than pasting everything at once.",
        "Re-supply critical context after long detours.",
        "Start fresh when the conversation has degraded."

      {t:"h", html:"The correction that doesn't stick"},
      {t:"p", html:"Correct Claude in one chat and it adapts — within that chat. Open a new chat and the mistake returns, because the correction only ever changed the context, never the model. This is the single most misunderstood behaviour in everyday use."},
      {t:"callout", variant:"principle", title:"Standing context is a configuration job",
       body:"If a correction must survive across sessions, it belongs in <strong>Project instructions</strong>, a <strong>Skill</strong>, or <strong>Memory</strong>. Repeating it in chat buys you one session."},

      {t:"h", html:"Mitigations"},
      {t:"ul", items:[
        "<strong>Memory</strong> and <strong>Projects</strong> for continuity that outlives a session.",
        "<strong>Compaction / summarisation</strong> to free room — accepting that detail compresses.",
        "<strong>Skills</strong> that load instructions only when relevant, rather than holding everything permanently.",
        "Larger context windows, and multi-agent workflows that divide the load."
       ]},
      {t:"callout", variant:"tip", title:"The 4D link",
       body:"Working memory is what <strong>Description</strong> acts on. Every decision about what to include and where to put it is a description decision."}
    ],
    keyPoints: [
      "The context window is fixed-size; nothing outside it exists for the model.",
      "Working memory fails as a cliff; the other three properties degrade gradually.",
      "Truncation can be silent.",
      "Lost in the middle: 30%+ accuracy drop for mid-context facts — put instructions at the start and repeat at the end.",
      "Corrections change context, not the model.",

  {
    id: "m1l4", title: "Steerability, Fingerprints & Collisions", time: 12,

    blocks: [
      {t:"p", html:"Steerability works because fine-tuning taught instruction-following. It is limited because those instructions are followed by <strong>pattern-matching, not understanding</strong>. That distinction explains every oddity in this lesson."},

      {t:"table", head:["Capability zone","Limitation zone"],

      {t:"callout", variant:"exam", title:"The letter-over-spirit fix",
       body:"When Claude follows an instruction literally but uselessly, <strong>restate the goal</strong>. Repeating the instruction more forcefully will not close the gap between your words and your intent — that gap is exactly the problem.<br><br>'Make it shorter' → 'shorten it so a skimmer sees the ask in line one.' 'More professional' → 'reframe for this audience and channel.' 'Add detail' → 'expand only what drives a decision.'"},

      {t:"h", html:"How AI gets its character — two stages"},
      {t:"ol", items:[
        "<strong>Pretraining.</strong> Read vast amounts of text and learn to predict what comes next. The result is a <strong>document completer</strong> — it has no concept of helping you.",

      {t:"table", head:["Fingerprint","What it looks like","Counter"],
       rows:[
        ["<strong>Sycophancy</strong>","Pulls toward agreeing with you and validating your framing","'Disagree with me if I am wrong.' Ask for the counter-case"],
        ["<strong>Verbosity</strong>","Defaults to long answers","'Answer in one sentence' / set an explicit range"],
        ["<strong>Over-caution</strong>","Hedges or declines more than the risk warrants","Restate scope and intended use"],
        ["<strong>Loose confidence calibration</strong>","Stated confidence does not track actual reliability","Verify specifics independently; never use tone as a proxy"]
       ]},

      {t:"h", html:"When properties collide"},
      {t:"p", html:"Most real failures are not one property failing. They are <strong>two properties interacting</strong> — which is why naming the pair points straight at the fix."},
      {t:"table", head:["Collision","Failure","Fix"],
       rows:[
        ["NTP + Knowledge","<strong>Hallucinated citations</strong>","Verify specifics independently; ground in sources"],
        ["Working Memory + Steerability","<strong>Long-conversation drift</strong> — early constraints fade, latest instructions win","Re-supply critical context, or restart with essentials up front"],
        ["NTP + Steerability","<strong>Confidently wrong reasoning</strong> — errors compound, tone stays certain","Visible reasoning; offload precise steps to code execution"],
        ["NTP + Working Memory","<strong>Context-poisoned generation</strong> — builds fluently on bad context","Curate the context carefully"],
        ["Knowledge + Steerability","<strong>Agreeable bad premises</strong> — follows your wrong framing","Explicitly invite pushback"],
        ["Knowledge + Working Memory","<strong>Stale context vs trained knowledge</strong> — blends the document with the training","Say which source takes priority"]
       ]},
      {t:"callout", variant:"principle", title:"Naming the pair is discernment applied",
       body:"'This is NTP plus Steerability' tells you to expose the reasoning and offload the arithmetic. 'This is Knowledge plus Steerability' tells you to invite pushback on your own premise. The diagnosis generates the remedy."},

      {t:"h", html:"Calibrated trust"},
      {t:"p", html:"The goal is neither trust nor suspicion — it is <strong>calibrated trust</strong>: locate the task on each continuum, then match verification to that location. The course scale runs: trust it → spot-check → check details → verify carefully → high risk. A task can sit at different points on different axes at once."}
    ],
    keyPoints: [
      "Steerability follows instructions by pattern-matching, not understanding.",
      "Letter over spirit is fixed by restating the goal, not by repeating louder.",
      "Fine-tuning fingerprints: sycophancy, verbosity, over-caution, loose calibration.",
      "Most failures are two properties colliding — name the pair to find the fix.",
      "NTP + Knowledge = hallucinated citations; Knowledge + Steerability = agreeable bad premises.",
      "Calibrated trust = task position on the continua, not a fixed attitude."
    ]
  }
  ]

{c:"c2",t:"Prompt anatomy",q:"Name the official five components of an effective prompt.",a:"1. Role · 2. Context · 3. Task · 4. Constraints · 5. Output format. Context is the one most often left out. (Examples / few-shot are a useful extra, not one of the official five.)"},
{c:"c2",t:"Prompt anatomy",q:"Why do the first three components (Role, Context, Task) do most of the work?",a:"They answer Who am I? / What do I know? / What should I do? Without them Claude doesn't stop — it assumes, and assumption is the mechanism behind generic output."},

{c:"c2",t:"Prompt anatomy",q:"How should you specify length, and why?",a:"Word counts are targets, not limits — models approximate. Use ranges ('roughly 100–150 words') and structural limits (three bullets, four sections), which are followed far more reliably."},

{c:"c2",t:"Prompt anatomy",q:"Do all five components belong in every prompt?",a:"No. They form a diagnostic checklist for disappointing output, not a mandatory ritual for every request."},

{c:"c2",t:"Decomposition",q:"What is the real rationale for breaking a complex task into steps?",a:"Reviewability and error isolation — not context-window size. Each step produces an artefact that can be validated before it feeds the next."},
